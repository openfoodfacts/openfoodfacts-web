"en:1-unprocessed-or-minimally-processed-foods":
  content: |-
    - ***ما هي؟*** الأطعمة غير المصنعة (أو الطبيعية) هي أجزاء صالحة للأكل من النباتات (البذور، الثمار، الأوراق، السيقان، الجذور) أو من الحيوانات (العضلات، الأحشاء، البيض، الحليب)، وكذلك الفطريات والطحالب والماء، بعد فصلها عن الطبيعة.
    - ***الأطعمة المصنعة بشكل طفيف:*** أطعمة طبيعية تم تعديلها من خلال عمليات تشمل إزالة الأجزاء غير الصالحة للأكل أو غير المرغوب فيها، والتجفيف، والسحق، والطحن، والتجزئة، والترشيح، والتحميص، والغلي، والتخمير غير الكحولي، والبسترة، والتبريد، والتجميد، ووضعها في عبوات، والتعبئة والتغليف بالتفريغ. صُممت هذه العمليات لحفظ الأطعمة الطبيعية، وجعلها مناسبة للتخزين، أو لجعلها آمنة أو صالحة للأكل أو أكثر استساغة للاستهلاك.
    - ***الاستخدام:*** يتم تحضير وطهي العديد من الأطعمة غير المصنعة أو المصنعة بشكل طفيف في المنزل أو في مطابخ المطاعم مع مكونات طهي مصنعة كأطباق أو وجبات.
    - ***مزيد من المعلومات:*** [تصنيف NOVA على Open Food Facts](https://world.openfoodfacts.org/nova)
"en:2-processed-culinary-ingredients":
  content: |-
    - ***ما هي؟*** المكونات الغذائية المُصنّعة، مثل الزيوت والزبدة والسكر والملح، هي مواد مُشتقة من أطعمة المجموعة الأولى أو من الطبيعة، وذلك من خلال عمليات تشمل الكبس والتكرير والطحن والتجفيف.
    - ***الغرض:*** يهدف استخدام هذه العمليات إلى إنتاج منتجات متينة مناسبة للاستخدام في المطابخ المنزلية والمطاعم لتحضير وتتبيل وطهي أطعمة المجموعة الأولى، ولإعداد أطباق ووجبات متنوعة ولذيذة، مثل اليخنات والحساء والمرق والسلطات والخبز والمربى والمشروبات والحلويات.
    - ***الاستخدام:*** لا يُقصد استهلاكها بمفردها، وعادةً ما تُستخدم مع أطعمة المجموعة الأولى لإعداد مشروبات وأطباق ووجبات طازجة.
    - ***مزيد من المعلومات:*** [تصنيف NOVA على Open Food Facts](https://world.openfoodfacts.org/nova)
"en:3-processed-foods":
  content: |-
    - ***ما هي؟*** تُصنع الأطعمة المُصنّعة، مثل الخضراوات المُعلّبة، والأسماك المُعلّبة، والفواكه في الشراب، والأجبان، والخبز الطازج، بشكل أساسي عن طريق إضافة الملح أو الزيت أو السكر أو مواد أخرى من المجموعة 2 إلى أطعمة المجموعة 1.
    - ***طرق التصنيع:*** تشمل طرق التصنيع طرقًا مختلفة للحفظ أو الطهي، وفي حالة الخبز والجبن، التخمير غير الكحولي. تحتوي معظم الأطعمة المُصنّعة على مكونين أو ثلاثة، ويمكن تمييزها كنسخ مُعدّلة من أطعمة المجموعة 1.
    - ***الغرض:*** الغرض من التصنيع هنا هو زيادة مدة صلاحية أطعمة المجموعة 1، أو تعديل أو تحسين خصائصها الحسية.
    - ***الاستخدام:*** يمكن تناولها بمفردها أو، في أغلب الأحيان، مع أطعمة أخرى.
    - ***مزيد من المعلومات:*** [تصنيف NOVA على Open Food Facts](https://world.openfoodfacts.org/nova)
"en:4-ultra-processed-food-and-drink-products":
  content: |-
    - ***ما هي؟*** الأطعمة فائقة المعالجة، مثل المشروبات الغازية، والوجبات الخفيفة المُعبأة الحلوة أو المالحة، ومنتجات اللحوم المُعاد تكوينها، والأطباق المُجمدة الجاهزة، ليست أطعمة مُعدلة، بل هي تركيبات مصنوعة في الغالب أو كليًا من مواد مُشتقة من الأطعمة والمُضافات الغذائية، مع القليل من، إن وُجد، من أطعمة المجموعة الأولى السليمة.
    - ***المكونات:*** تشمل مكونات هذه التركيبات عادةً تلك المُستخدمة أيضًا في الأطعمة المُصنعة، مثل السكريات والزيوت والدهون والملح. لكن المنتجات فائقة المعالجة تشمل أيضًا مصادر أخرى للطاقة والمغذيات التي لا تُستخدم عادةً في تحضير الطعام. بعض هذه المصادر مُستخلص مباشرةً من الأطعمة، مثل الكازين واللاكتوز ومصل اللبن والغلوتين.
    - ***المعالجة المُتقدمة:*** يُشتق العديد منها من معالجة مُكونات الطعام، مثل الزيوت المُهدرجة أو المُعدلة، والبروتينات المُحللة، وبروتين الصويا المُعزول، والمالتوديكسترين، والسكر المُحَوَّل، وشراب الذرة عالي الفركتوز.
    المعالجة المُتقدمة:
    يُشتق العديد منها من مُعالجة مُكونات الطعام، مثل الزيوت المُهدرجة أو المُعدلة، والبروتينات المُحللة، وبروتين الصويا المُعزول، والمالتوديكسترين، والسكر المُحَوَّل، وشراب الذرة عالي الفركتوز.
    - ***المضافات الغذائية:*** تشمل المضافات الغذائية في الأطعمة فائقة المعالجة بعض المضافات المستخدمة أيضًا في الأطعمة المصنعة، مثل المواد الحافظة ومضادات الأكسدة والمثبتات. وتشمل فئات المضافات الموجودة فقط في المنتجات فائقة المعالجة تلك المستخدمة لمحاكاة أو تحسين الخصائص الحسية للأطعمة أو لإخفاء الجوانب غير المرغوبة في المنتج النهائي. وتشمل هذه المضافات الأصباغ والألوان الأخرى، ومثبتات الألوان، والنكهات، ومحسنات النكهة، والمحليات غير السكرية، ومساعدات المعالجة مثل عوامل الكربنة، والتماسك، والتكثيف، ومنع التكتل، وإزالة الرغوة، ومنع التكتل، والتلميع، والمستحلبات، وعوامل العزل، والمرطبات.
    - ***المعالجة المعقدة:*** تُستخدم سلسلة من العمليات لدمج المكونات الكثيرة عادةً وإنتاج المنتج النهائي (ومن هنا جاءت تسمية "فائق المعالجة"). وتشمل هذه العمليات العديد من العمليات التي لا مثيل لها محليًا، مثل الهدرجة والتحلل المائي، والبثق والتشكيل، والمعالجة المسبقة للقلي.
    المعالجة المعقدة:*** تُستخدم سلسلة من العمليات لدمج المكونات الكثيرة عادةً وإنتاج المنتج النهائي (ومن هنا جاءت تسمية "فائق المعالجة"). وتشمل هذه العمليات العديد من العمليات التي لا يوجد لها مثيل محليًا، مثل الهدرجة والتحلل المائي، والبثق والتشكيل، والمعالجة المسبقة للقلي.
    المعالجة المعقدة:*** - ***الهدف:*** يتمثل الهدف العام من المعالجة الفائقة في إنتاج منتجات غذائية تحمل علامات تجارية، سهلة الاستخدام (متينة، جاهزة للاستهلاك)، جذابة (ذات مذاق رائع)، ومربحة للغاية (بمكونات منخفضة التكلفة)، مصممة لتحل محل جميع المجموعات الغذائية الأخرى. عادةً ما تُعبأ المنتجات الغذائية فائقة المعالجة بشكل جذاب ويتم تسويقها بشكل مكثف.
    - ***مزيد من المعلومات:*** [تصنيف NOVA على موقع Open Food Facts](https://world.openfoodfacts.org/nova)
