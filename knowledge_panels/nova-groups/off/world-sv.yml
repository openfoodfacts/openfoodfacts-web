"en:1-unprocessed-or-minimally-processed-foods":
  content: |-
    - ***Vad det är:*** Obearbetade (eller naturliga) livsmedel är ätliga delar av växter (frön, frukter, blad, stjälkar och rötter) eller djur (muskler, inälvor, ägg och mjölk), samt svampar, alger och vatten, sedan de har avskilts från naturen.
    - ***Minimalt bearbetade livsmedel:*** Naturliga livsmedel som har förändrats genom processer som avlägsnande av oätliga eller oönskade delar, torkning, krossning, malning, fraktionering, filtrering, rostning, kokning, alkoholfri fermentering, pastörisering, kylförvaring, nedkylning, infrysning, förpackning i behållare och vakuumförpackning. Processerna ska bevara de naturliga livsmedlen, göra dem lämpliga att lagra eller göra dem säkra, ätliga eller godare att konsumera.
    - ***Användning:*** Många obearbetade eller minimalt bearbetade livsmedel bereds och tillagas hemma eller i restaurangkök tillsammans med bearbetade kulinariska ingredienser till maträtter eller måltider.
    - ***Mer information:*** [NOVA-klassificeringen på Open Food Facts](https://world.openfoodfacts.org/nova)
"en:2-processed-culinary-ingredients":
  content: |-
    - ***Vad det är:*** Bearbetade kulinariska ingredienser, såsom oljor, smör, socker och salt, är ämnen som framställs av livsmedel i grupp 1 eller direkt från naturen genom bland annat pressning, raffinering, krossning, malning och torkning.
    - ***Syfte:*** Processerna ska framställa hållbara produkter som kan användas i hem- och restaurangkök för att bereda, krydda och tillaga livsmedel i grupp 1 och göra varierade, välsmakande hemlagade maträtter och måltider, såsom grytor, soppor och buljonger, sallader, bröd, konserver, drycker och desserter.
    - ***Användning:*** De är inte avsedda att konsumeras som de är utan används vanligtvis tillsammans med livsmedel i grupp 1 för att göra nyberedda drycker, maträtter och måltider.
    - ***Mer information:*** [NOVA-klassificeringen på Open Food Facts](https://world.openfoodfacts.org/nova)
"en:3-processed-foods":
  content: |-
    - ***Vad det är:*** Bearbetade livsmedel, såsom grönsaker på flaska, fiskkonserver, frukt i sockerlag, ostar och nybakat bröd, framställs huvudsakligen genom att salt, olja, socker eller andra ämnen från grupp 2 tillsätts till livsmedel i grupp 1.
    - ***Bearbetningsmetoder:*** Processerna omfattar olika konserverings- eller tillagningsmetoder och, för bröd och ost, alkoholfri fermentering. De flesta bearbetade livsmedel innehåller två eller tre ingredienser och känns igen som modifierade versioner av livsmedel i grupp 1.
    - ***Syfte:*** Bearbetningen ska förlänga hållbarheten hos livsmedel i grupp 1 eller förändra eller förbättra deras sensoriska egenskaper.
    - ***Användning:*** De kan ätas som de är eller, vilket är vanligare, tillsammans med andra livsmedel.
    - ***Mer information:*** [NOVA-klassificeringen på Open Food Facts](https://world.openfoodfacts.org/nova)
"en:4-ultra-processed-food-and-drink-products":
  content: |-
    - ***Vad det är:*** Ultrabearbetade livsmedel, såsom läsk, söta eller salta förpackade snacks, rekonstituerade köttprodukter och färdiglagade frysta rätter, är inte modifierade livsmedel utan sammansättningar som till största delen eller helt består av ämnen som utvunnits ur livsmedel samt tillsatser, med mycket lite eller inga intakta livsmedel från grupp 1.
    - ***Ingredienser:*** Sammansättningarna innehåller vanligtvis ingredienser som också används i bearbetade livsmedel, såsom sockerarter, oljor, fetter och salt. Ultrabearbetade produkter innehåller dock även andra energi- och näringskällor som normalt inte används i matlagning. Vissa utvinns direkt ur livsmedel, till exempel kasein, laktos, vassle och gluten.
    - ***Avancerad bearbetning:*** Många framställs genom ytterligare bearbetning av livsmedelsbeståndsdelar, exempelvis hydrerade eller omförestrade oljor, hydrolyserade proteiner, sojaproteinisolat, maltodextrin, invertsocker och majssirap med hög fruktoshalt.
    - ***Tillsatser:*** Ultrabearbetade livsmedel innehåller vissa tillsatser som också används i bearbetade livsmedel, såsom konserveringsmedel, antioxidanter och stabiliseringsmedel. Tillsatskategorier som bara förekommer i ultrabearbetade produkter används för att efterlikna eller förstärka livsmedlens sensoriska egenskaper eller dölja oaptitliga egenskaper hos slutprodukten. Dit hör färgämnen och andra färgtillsatser, färgstabiliseringsmedel, aromer, smakförstärkare och sockerfria sötningsmedel samt processhjälpmedel som karboneringsmedel, fasthetsmedel, fyllnadsmedel, skumdämpande och klumpförebyggande medel, ytbehandlingsmedel, emulgeringsmedel, komplexbildare och fuktighetsbevarande medel.
    - ***Komplex bearbetning:*** Många processer i följd används för att kombinera det vanligtvis stora antalet ingredienser och skapa slutprodukten (därav ”ultrabearbetad”). Flera processer saknar motsvarighet i hushållet, till exempel hydrogenering och hydrolys, extrudering och formning samt förbehandling inför fritering.
    - ***Syfte:*** Det övergripande syftet med ultrabearbetning är att skapa varumärkesskyddade, praktiska (hållbara och färdiga att konsumera), attraktiva (hypervälsmakande) och mycket lönsamma (billiga ingredienser) livsmedelsprodukter som är utformade för att tränga undan alla andra livsmedelsgrupper. Ultrabearbetade livsmedelsprodukter har vanligtvis attraktiva förpackningar och marknadsförs intensivt.
    - ***Mer information:*** [NOVA-klassificeringen på Open Food Facts](https://world.openfoodfacts.org/nova)
