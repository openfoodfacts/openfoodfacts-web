"en:1-unprocessed-or-minimally-processed-foods":
  content: |-
    - ***Що це таке:*** Необроблені (або натуральні) продукти — це їстівні частини рослин (насіння, плоди, листя, стебла, коріння) або тварин (м'язи, субпродукти, яйця, молоко), а також гриби, водорості та вода після їх отримання з природи.
    -***Мінімально оброблені продукти:*** Натуральні продукти, змінені процесами, що включають видалення їстівних або небажаних частин, а також сушіння, подрібнення, розтирання, фракціонування, фільтрацію, смаження, варіння, безалкогольну ферментацію, пастеризацію, охолодження, заморожування, пакування в контейнери та вакуумне пакування. Ці процеси призначені для збереження натуральних продуктів, щоб зробити їх придатними для зберігання, безпечними, їстівними або приємнішими для споживання.
    -***Використання:*** Багато необроблених або мінімально оброблених продуктів готуються вдома або на кухнях ресторанів у поєднанні з обробленими кулінарними інгредієнтами як страви або повноцінні прийоми їжі.
    -***Додаткова інформація:*** [Класифікація NOVA на Open Food Facts](https://world.openfoodfacts.org/nova)
"en:2-processed-culinary-ingredients":
  content: |-
    - ***Що це таке:*** Оброблені кулінарні інгредієнти, такі як олії, вершкове масло, цукор та сіль, — це речовини, отримані з продуктів 1-ї групи або з природи за допомогою процесів, що включають пресування, рафінування, подрібнення, помел та сушіння.
    - ***Мета:*** Мета таких процесів — створення довговічних продуктів, придатних для використання на домашніх та ресторанних кухнях для приготування, приправлення та готування продуктів 1-ї групи, а також для створення з ними різноманітних та приємних страв, приготованих власноруч, таких як рагу, супи та бульйони, салати, хліб, консерви, напої та десерти.
    - ***Використання:*** Вони не призначені для споживання окремо і зазвичай використовуються в поєднанні з продуктами 1-ї групи для створення свіжоприготованих напоїв, страв та прийомів їжі.
    - ***Додаткова інформація:*** [Класифікація NOVA на Open Food Facts](https://world.openfoodfacts.org/nova)
"en:3-processed-foods":
  content: |-
    - ***Що це таке:*** Оброблені продукти, такі як консервовані овочі, консервована риба, фрукти в сиропі, сири та свіжоспечений хліб, виготовляються переважно шляхом додавання солі, олії, цукру або інших речовин із 2-ї групи до продуктів 1-ї групи.
    - ***Методи обробки:*** Процеси включають різні методи консервації або приготування, а у випадку хліба та сиру — безалкогольну ферментацію. Більшість оброблених продуктів мають два або три інгредієнти і є впізнаваними як модифіковані версії продуктів 1-ї групи.
    - ***Мета:*** Мета обробки тут полягає у підвищенні терміну придатності продуктів 1-ї групи, або в модифікації чи покращенні їхніх сенсорних якостей.
    - ***Використання:*** Вони придатні для споживання окремо або, частіше, у поєднанні з іншими продуктами.
    - ***Додаткова інформація:*** [Класифікація NOVA на Open Food Facts](https://world.openfoodfacts.org/nova)
"en:4-ultra-processed-food-and-drink-products":
  content: |-
    - ***Що це таке:*** Ультраоброблені продукти, такі як безалкогольні напої, солодкі чи солоні упаковані закуски, м'ясні продукти зі вторинної сировини та готові заморожені страви, — це не просто модифіковані продукти, а суміші, виготовлені переважно або повністю з речовин, отриманих із харчових продуктів та добавок, у яких майже немає цілісних продуктів 1-ї групи.
    - ***Інгредієнти:*** Інгредієнти цих сумішей зазвичай включають ті, що також використовуються в оброблених продуктах, наприклад цукри, олії, жири або сіль. Але ультраоброблені продукти також містять інші джерела енергії та поживних речовин, які зазвичай не використовуються в кулінарній обробці. Деякі з них видобуваються безпосередньо з продуктів, як-от казеїн, лактоза, сироватка та глютен.
    - ***Поглиблена обробка:*** Багато компонентів отримують шляхом подальшої обробки харчових складових, наприклад гідрогенізовані або переетерифіковані олії, гідролізовані білки, ізолят соєвого білка, мальтодекстрин, інвертний цукор та кукурудзяний сироп із високим вмістом фруктози.
    - ***Харчові добавки:*** Добавки в ультраоброблених продуктах включають деякі з тих, що також використовуються в оброблених продуктах, наприклад консерванти, антиоксиданти та стабілізатори. Класи добавок, які зустрічаються лише в ультраоброблених продуктах, включають ті, що використовуються для імітації або покращення сенсорних якостей їжі, або для маскування неприємних аспектів кінцевого продукту. Ці добавки включають барвники та інші речовини для кольору, стабілізатори кольору; ароматизатори, підсилювачі смаку, підсолоджувачі (не цукор); а також технологічні допоміжні засоби, такі як засоби для газування, зміцнювачі, наповнювачі, антипінні засоби, засоби проти злежування, глазуруючі агенти, емульгатори, секвестранти та зволожувачі.
    - ***Комплексна обробка:*** Для поєднання зазвичай великої кількості інгредієнтів та створення кінцевого продукту використовується безліч послідовних процесів (звідси й назва «ультраоброблені»). Процеси включають кілька таких, що не мають побутових аналогів, наприклад гідрогенізація та гідроліз, екструзія та формування, а також попередня обробка для смаження.
    - ***Мета:*** Загальна мета ультраобробки полягає у створенні брендованих, зручних (довговічних, готових до вживання), привабливих (гіперпалатабельних) та високоприбуткових (дешеві інгредієнти) харчових продуктів, розроблених для витіснення всіх інших груп харчових продуктів. Ультраоброблені харчові продукти зазвичай привабливо упаковані та інтенсивно рекламуються.
    - ***Додаткова інформація:*** [Класифікація NOVA на Open Food Facts](https://world.openfoodfacts.org/nova)
