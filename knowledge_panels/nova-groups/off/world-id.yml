"en:1-unprocessed-or-minimally-processed-foods":
  content: |-
    - ***Apa itu:*** Makanan mentah (atau alami) adalah bagian yang dapat dimakan dari tumbuhan (biji, buah, daun, batang, akar) atau dari hewan (otot, jeroan, telur, susu), dan juga jamur, ganggang dan air, setelah dipisahkan dari alam.
    - ***Makanan yang diolah minimal:*** Makanan alami yang diubah dengan proses yang termasuk penghapusan bagian yang tidak dapat dimakan atau tidak diinginkan, dan pengeringan, penghancuran, penggilingan, fraksinasi, penyaringan, pemanggangan, perebusan, fermentasi non-alkohol, pasteurisasi, pendinginan, pembekuan, penempatan dalam wadah dan pengemasan vakum. Proses-proses ini dirancang untuk mengawetkan makanan alami, membuatnya cocok untuk penyimpanan, atau membuatnya aman atau dapat dimakan atau lebih menyenangkan untuk dikonsumsi.
    - ***Penggunaan:*** Banyak makanan mentah atau diolah minimal disiapkan dan dimasak di rumah atau di dapur restoran dalam kombinasi dengan bahan masakan yang diolah sebagai hidangan atau makanan.
    - ***Informasi lebih lanjut:*** [Klasifikasi NOVA pada Open Food Facts](https://world.openfoodfacts.org/nova)
"en:2-processed-culinary-ingredients":
  content: |-
    - ***Apa itu:*** Bahan-bahan kuliner olahan, seperti minyak, mentega, gula, dan garam, adalah zat yang berasal dari makanan Kelompok 1 atau dari alam melalui proses yang meliputi pengepresan, pemurnian, penggilingan, penggilingan halus, dan pengeringan.
    - ***Tujuan:*** Tujuan dari proses tersebut adalah untuk membuat produk tahan lama yang cocok untuk digunakan di dapur rumah dan restoran untuk menyiapkan, membumbui, dan memasak makanan Kelompok 1 serta untuk membuat berbagai hidangan dan makanan buatan tangan yang lezat, seperti semur, sup, dan kaldu, salad, roti, selai, minuman, dan makanan penutup.
    - ***Penggunaan:*** Bahan-bahan ini tidak dimaksudkan untuk dikonsumsi sendiri, dan biasanya digunakan bersama dengan makanan Kelompok 1 untuk membuat minuman, hidangan, dan makanan yang baru disiapkan.
    - ***Informasi lebih lanjut:*** [Klasifikasi NOVA pada Fakta Makanan Terbuka](https://world.openfoodfacts.org/nova)
"en:3-processed-foods":
  content: |-
    - ***Apa itu:*** Makanan olahan, seperti sayuran dalam botol, ikan kalengan, buah-buahan dalam sirup, keju, dan roti yang baru dibuat, pada dasarnya dibuat dengan menambahkan garam, minyak, gula, atau zat lain dari Kelompok 2 ke makanan Kelompok 1.
    - ***Metode pengolahan:*** Prosesnya meliputi berbagai metode pengawetan atau memasak, dan, dalam kasus roti dan keju, fermentasi non-alkohol. Sebagian besar makanan olahan memiliki dua atau tiga bahan, dan dapat dikenali sebagai versi modifikasi dari makanan Kelompok 1.
    - ***Tujuan:*** Tujuan pengolahan di sini adalah untuk meningkatkan daya tahan makanan Kelompok 1, atau untuk memodifikasi atau meningkatkan kualitas sensoriknya.
    - ***Penggunaan:*** Makanan olahan dapat dimakan sendiri atau, lebih umum, dikombinasikan dengan makanan lain.
    - ***Informasi lebih lanjut:*** [Klasifikasi NOVA pada Fakta Makanan Terbuka](https://world.openfoodfacts.org/nova)
"en:4-ultra-processed-food-and-drink-products":
  content: |-
    - ***Apa itu:*** Makanan ultra-proses, seperti minuman ringan, camilan manis atau gurih kemasan, produk daging yang direkonstruksi, dan hidangan beku siap saji, bukan makanan yang dimodifikasi tetapi formulasi yang dibuat sebagian besar atau seluruhnya dari zat yang berasal dari makanan dan aditif, dengan sedikit atau tanpa makanan Grup 1 yang utuh.
    - ***Komposisi:*** Bahan-bahan formulasi ini biasanya mencakup bahan yang juga digunakan dalam makanan olahan, seperti gula, minyak, lemak, atau garam. Namun, produk ultra-proses juga mencakup sumber energi dan nutrisi lain yang tidak biasanya digunakan dalam persiapan kuliner. Beberapa di antaranya diekstrak langsung dari makanan, seperti kasein, laktosa, whey, dan gluten.
    - ***Pemrosesan lanjutan:*** Banyak yang berasal dari pemrosesan lebih lanjut dari konstituen makanan, seperti minyak yang dihidrogenasi atau diinteresterifikasi, protein terhidrolisis, isolat protein kedelai, maltodekstrin, gula invert, dan sirup jagung fruktosa tinggi.
    - ***Aditif:*** Aditif dalam makanan ultra-proses termasuk beberapa yang juga digunakan dalam makanan olahan, seperti pengawet, antioksidan, dan stabilisator. Kelas aditif yang hanya ditemukan dalam produk ultra-proses termasuk yang digunakan untuk menirukan atau meningkatkan kualitas sensorik makanan atau untuk menyamarkan aspek yang tidak enak dari produk akhir. Aditif ini termasuk pewarna dan warna lain, stabilisator warna; perisa, penyedap rasa, pemanis non-gula; dan bahan pembantu pemrosesan seperti pengarbonan, pengerasan, penambahan massa dan anti-penambahan massa, anti-busa, anti-gumpalan, dan agen pengilap, emulsifier, sequestran, dan humektan.
    - ***Pemrosesan kompleks:*** Berbagai urutan proses digunakan untuk menggabungkan bahan-bahan yang biasanya banyak dan untuk menciptakan produk akhir (oleh karena itu 'ultra-proses'). Prosesnya termasuk beberapa yang tidak memiliki padanan domestik, seperti hidrogenasi dan hidrolisasi, ekstrusi dan pencetakan, dan pra-pemrosesan untuk penggorengan.
    - ***Tujuan:*** Tujuan keseluruhan dari ultra-proses adalah untuk menciptakan produk makanan bermerek, nyaman (tahan lama, siap dikonsumsi), menarik (sangat lezat) dan sangat menguntungkan (bahan-bahan berbiaya rendah) yang dirancang untuk menggantikan semua kelompok makanan lainnya. Produk makanan ultra-proses biasanya dikemas secara menarik dan dipasarkan secara intensif.
    - ***Informasi lebih lanjut:*** [Klasifikasi NOVA di Open Food Facts](https://world.openfoodfacts.org/nova)
