"en:e202":
  content: |-
    Kaliumsorbat (E202) är ett syntetiskt konserveringsmedel som ofta används
    för att förlänga hållbarheten hos olika livsmedel.

    Det hämmar tillväxten av mögelsvampar, jästsvampar och vissa bakterier och
    motverkar därmed att maten förstörs. I livsmedel bidrar det till att bevara
    färskhet och kvalitet.

    Vissa studier har visat att kaliumsorbat i kombination med nitriter kan
    ha genotoxisk aktivitet in vitro. Tillsynsmyndigheter betraktar dock i
    allmänhet kaliumsorbat som säkert (GRAS).
"en:e322":
  content: |-
    Lecitiner är naturliga föreningar som ofta används i livsmedelsindustrin som
    emulgeringsmedel och stabiliseringsmedel.

    Lecitiner utvinns bland annat ur sojabönor och ägg och består av
    fosfolipider som hjälper olja och vatten att blandas och ger en jämn
    konsistens i exempelvis choklad, dressingar och bakverk.

    **De innebär inga kända hälsorisker**.
"en:e322i":
  content: |-
    Lecitiner är naturliga föreningar som ofta används i livsmedelsindustrin som
    emulgeringsmedel och stabiliseringsmedel.

    Lecitiner utvinns bland annat ur sojabönor och ägg och består av
    fosfolipider som hjälper olja och vatten att blandas och ger en jämn
    konsistens i exempelvis choklad, dressingar och bakverk.

    **De innebär inga kända hälsorisker**.
"en:e330":
  content: |-
    Citronsyra är en naturlig organisk syra som finns i citrusfrukter som
    citroner, apelsiner och lime.

    Den används i stor utsträckning i livsmedelsindustrin som smakförstärkare, surhetsreglerande
    medel och konserveringsmedel på grund av sin syrliga och uppfriskande smak.

    Citronsyra är säker att konsumera i måttliga mängder och
    betraktas av tillsynsmyndigheter världen över som en livsmedelstillsats som
    i allmänhet är säker (GRAS).
"en:e407":
  content: |-
    Karragenan (E407), som utvinns ur rödalger, används i stor utsträckning i
    livsmedelsindustrin som gelbildnings-, förtjocknings- och stabiliseringsmedel, särskilt i
    mejeri- och köttprodukter.

    Det finns i flera former som var och en ger livsmedel olika
    konsistensegenskaper.

    Den nedbrutna formen, som ofta kallas poligeenan, **har väckt
    oro för hälsorisker** på grund av möjliga inflammatoriska effekter och sin
    klassificering som **möjligen cancerframkallande för människor (grupp 2B)** av
    Internationella centret för cancerforskning (IARC).

    Karragenan av livsmedelskvalitet har däremot bedömts som säkert av flera
    tillsynsorgan när det konsumeras i de mängder som normalt finns i livsmedel.
"en:e412":
  content: |-
    Guargummi (E412) är en naturlig livsmedelstillsats som utvinns ur guarbönor.

    Det vita, luktfria pulvret uppskattas för sina goda förtjockande och
    stabiliserande egenskaper och är därför en vanlig ingrediens i många
    livsmedel, bland annat såser, dressingar och glass.

    När guargummi används i måttliga mängder anses det vara säkert att konsumera,
    utan några kända negativa hälsoeffekter.
"en:e415":
  content: |-
    Xantangummi (E415) är en naturlig polysackarid som framställs av fermenterade
    sockerarter. Det används ofta i livsmedelsindustrin som
    förtjocknings- och stabiliseringsmedel.

    Den mångsidiga livsmedelstillsatsen förbättrar konsistensen och förhindrar att ingredienser
    separerar i en mängd produkter, bland annat salladsdressingar,
    såser och glutenfria bakverk.

    Den anses vara säker att konsumera även vid höga intag.
"en:e440":
  content: |-
    Pektiner (E440) är naturliga kolhydrater som främst finns i frukt
    och fungerar som gelbildningsmedel i livsmedelsindustrin genom att skapa den önskade
    geléliknande konsistensen i sylt, gelé och marmelad.

    Pektiner stabiliserar och gör olika livsmedel tjockare, exempelvis desserter,
    konfektyr och drycker, och ger dem en jämn konsistens och
    kvalitet.

    Pektiner betraktas som säkra av flera hälsomyndigheter och har
    använts i stor utsträckning utan märkbara negativa effekter när de konsumeras i
    normala mängder i kosten.
"en:e450":
  content: |-
    Difosfater (E450) är livsmedelstillsatser som ofta används för att ändra
    produkters konsistens, som jäsmedel vid bakning och för att förhindra
    att konserverade livsmedel koagulerar.

    Dessa salter kan stabilisera vispgrädde och förekommer också i pulverformiga
    produkter för att bibehålla deras flytegenskaper. De förekommer ofta i
    bakverk, bearbetade köttprodukter och läsk.

    De framställs av fosforsyra och **ingår i vårt dagliga
    fosfatintag, som ofta överstiger rekommenderade nivåer** på grund av den stora mängden
    fosfater i bearbetade livsmedel och drycker.

    Överdrivet fosfatintag är kopplat till hälsoproblem, såsom
    **nedsatt njurfunktion** och **försämrad benhälsa**. Difosfater
    anses i allmänhet vara säkra så länge konsumtionen ligger inom fastställda
    gränser för acceptabelt dagligt intag, men det är viktigt att följa det totala fosfatintaget
    för att bibehålla en god hälsa.
"en:e471":
  content: |-
    Mono- och diglycerider av fettsyror (E471) är livsmedelstillsatser som
    ofta används som emulgeringsmedel i olika bearbetade livsmedel.

    Föreningarna består av glycerolmolekyler som är bundna till en eller två
    fettsyrekedjor och bidrar till att stabilisera och blanda vatten- och oljebaserade
    ingredienser. E471 förbättrar konsistensen och hållbarheten hos produkter
    som margarin, bakverk och glass och bidrar till en jämn och
    enhetlig konsistens.

    Ämnet anses i allmänhet vara säkert att konsumera inom fastställda
    gränsvärden.
"en:e500":
  content: |-
    Natriumkarbonater (E500) är föreningar som ofta används vid matlagning
    som jäsmedel och får bakverk att jäsa genom att frigöra koldioxid
    när de reagerar med syror.

    De förekommer ofta som bikarbonat och reglerar livsmedlens pH-värde, så att de
    inte blir för sura eller för basiska. I matlagning kan natriumkarbonater också
    förbättra livsmedels, till exempel nudlars, konsistens och struktur
    genom att påverka glutennätverket.

    Natriumkarbonater betraktas generellt som säkra och är inte giftiga när
    de konsumeras i de mängder som normalt förekommer i livsmedel.
"en:e500ii":
  content: |-
    Natriumvätekarbonat, även känt som E500ii, är en livsmedelstillsats som
    ofta används som jäsmedel.

    När det tillsätts i recept frigörs koldioxid vid kontakt med
    värme eller syror. Det får degen att jäsa och ger bakverk en lätt och luftig
    konsistens.

    Tillsynsmyndigheter betraktar det i allmänhet som säkert (GRAS) när
    det används i lämpliga mängder, och det innebär inga betydande hälsorisker när
    det konsumeras i normala livsmedelstillämpningar.
"en:e102":
  content: |-
    Tartrazin (E102) är ett syntetiskt citrongult azofärgämne som används som
    livsmedelsfärgämne.

    Det finns i många olika produkter, såsom läsk, desserter,
    godis och snacks, för att ge dem en intensiv gul färg.

    Trots att tartrazin är godkänt av många tillsynsmyndigheter har det kopplats
    till **allergiska reaktioner**, såsom nässelutslag, hos en liten del av
    befolkningen. Vissa studier har också antytt ett samband med **ökad
    hyperaktivitet hos barn**, särskilt när det intas tillsammans med andra
    tillsatser som bensoater.
"en:e120":
  content: |-
    Koschenillextrakt eller karmin (E120) är ett naturligt rött färgämne som
    framställs av torkade honor av koschenillsköldlusen.

    Det används ofta för att ge en rosa, röd eller lila nyans åt olika livsmedel
    och drycker, bland annat yoghurt, glass, konfektyr och
    fruktjuicer.

    Även om det är en naturlig tillsats är E120 känt för att kunna orsaka **svåra
    allergiska reaktioner**, inklusive anafylaxi, hos vissa personer. Det är
    dessutom **inte lämpligt för vegetarianer eller veganer** eftersom det framställs av
    insekter.
"en:e250":
  content: |-
    Natriumnitrit (E250) är ett salt som används för rimning och konservering av
    köttprodukter.

    Det spelar en avgörande roll för att förhindra tillväxten av Clostridium
    botulinum, bakterien som orsakar botulism, i charkuterier som
    bacon, skinka och korv. Det ger också den karakteristiska rosa färgen
    och smaken.

    Nitriter kan dock reagera med aminer i magsäcken och bilda
    nitrosaminer, som är **potenta cancerframkallande ämnen**. Ett högt intag av bearbetat
    kött som innehåller nitriter är förknippat med en **ökad risk för
    tjock- och ändtarmscancer**. Tillsynsmyndigheter har satt strikta gränser för
    användningen i livsmedel.
"en:e621":
  content: |-
    Mononatriumglutamat (MSG), eller E621, är natriumsaltet av glutaminsyra,
    en aminosyra som finns naturligt i många livsmedel.

    Det används ofta som smakförstärkare för att ge umamismak eller mustig
    smak åt olika bearbetade livsmedel, bland annat soppor, snacks och
    frysta maträtter.

    Livsmedelsmyndigheter betraktar i allmänhet MSG som säkert (GRAS). Vissa
    personer uppger dock att de är känsliga för MSG och får kortvariga symtom
    som huvudvärk och hudrodnad, även om **vetenskapliga studier inte har visat något
    konsekvent samband**.
"en:e951":
  content: |-
    Aspartam (E951) är ett konstgjort sötningsmedel med lågt kaloriinnehåll som består av två
    aminosyror.

    Det används som sockerersättning i tusentals ”sockerfria” produkter eller ”dietprodukter”,
    såsom kolsyrad läsk, tuggummi, yoghurt och
    bordssötningsmedel, för att ge sötma utan sockrets kalorier.

    Trots att aspartam är en av de mest ingående testade livsmedelstillsatserna är
    säkerheten fortfarande omdiskuterad. Medan stora tillsynsmyndigheter som FDA
    och EFSA bedömer det som säkert för allmänheten har IARC klassificerat det
    som **”möjligen cancerframkallande för människor” (grupp 2B)**. Det måste också
    undvikas av personer med den genetiska sjukdomen fenylketonuri (PKU).
