"en:aqua":
  content: |-
    - ***यह क्या है: इसे पानी के नाम से भी जाना जाता है, और यह सौंदर्य प्रसाधनों में सबसे आम घटक है। यह विलायक के रूप में कार्य करता है, अन्य अवयवों को ले जाता है, और उत्पाद की बनावट में योगदान देता है।
    - ***प्रकार: शुद्ध जल, विआयनीकृत जल, आसुत जल। संदूषकों के प्रवेश से बचने के लिए उपयोग किए जाने वाले जल की गुणवत्ता महत्वपूर्ण है।
    - ***चिंताएं:
    - हालांकि आम तौर पर सुरक्षित है, उचित संरक्षण विधियों का उपयोग न करने पर जल उत्पादों में सूक्ष्मजीवों के विकास में योगदान दे सकता है।
    - विनिर्माण में जल के उपयोग का पर्यावरणीय प्रभाव, विशेष रूप से जल संकट वाले क्षेत्रों में, एक बढ़ती हुई चिंता का विषय है।
