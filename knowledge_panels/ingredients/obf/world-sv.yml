"en:aqua":
  content: |-
    - ***Vad det är: Ämnet kallas även vatten och är den vanligaste ingrediensen i kosmetika. Det fungerar som lösningsmedel, bär andra ingredienser och bidrar till produktens konsistens.
    - ***Typer: Renat vatten, avjoniserat vatten och destillerat vatten. Vattnets kvalitet är viktig för att undvika att föroreningar förs in.
    - ***Farhågor:
    - Vatten är i allmänhet säkert men kan bidra till tillväxt av mikroorganismer i produkter om lämpliga konserveringsmetoder inte används.
    - Miljöpåverkan från vattenanvändning vid tillverkning, särskilt i regioner med vattenbrist, är ett allt större problem.
