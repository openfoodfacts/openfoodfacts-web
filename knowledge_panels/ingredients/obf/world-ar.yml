"en:aqua":
  content: |-
    - ***ما هو: معروف أيضًا بالماء، وهو المكون الأكثر شيوعًا في مستحضرات التجميل. يعمل كمذيب، وينقل المكونات الأخرى، ويساهم في قوام المنتج.
    - ***الأنواع: ماء مقطر، ماء منزوع الأيونات، ماء مقطر. جودة الماء المستخدم مهمة لتجنب إدخال الملوثات.
    - ***المخاوف:
    - على الرغم من أنه آمن بشكل عام، يمكن أن يساهم الماء في نمو الميكروبات في المنتجات إذا لم تُستخدم طرق preservation المناسبة.
    -ثر التأثير البيئي لاستخدام الماء في التصنيع، وخاصة في المناطق التي تعاني من ندرة المياه، هو مصدر قلق متزايد.
