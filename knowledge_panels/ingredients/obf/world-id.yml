"en:aqua":
  content: |-
    - ***Apa itu: Dikenal juga sebagai air, ini adalah bahan yang paling umum digunakan dalam kosmetik. Fungsinya adalah sebagai pelarut untuk membawa bahan-bahan lain, sekaligus membentuk tekstur produk.
    - ***Jenis: Air murni, air deionisasi air suling. Kualitas air yang digunakan sangat penting untuk menghindari masuknya kontaminan.
    - ***Kekhawatiran:
    - Meski umumnya aman, air dapat memicu pertumbuhan mikroorganisme dalam produk jika tidak menggunakan metode pengawetan yang tepat.
    - Dampak lingkungan dari penggunaan air dalam proses manufaktur, terutama di wilayah yang krisis air, kini menjadi perhatian yang terus meningkat.
