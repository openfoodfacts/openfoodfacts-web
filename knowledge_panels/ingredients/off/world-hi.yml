"en:corn-syrup":
  content: |-
    - ***यह क्या है:*** कॉर्नस्टार्च से बना एक सिरप, जिसका उपयोग अक्सर प्रसंस्कृत खाद्य पदार्थों को मीठा और गाढ़ा करने के लिए किया जाता है।
    - ***प्रकार:*** हल्का (साफ़ और हल्का मीठा) और गाढ़ा (कैरामल के स्वाद वाला और कम मीठा)।
    - ***चिंताएँ:***
    - इसमें फ्रक्टोज की मात्रा अधिक होती है, विशेष रूप से हाई-फ्रक्टोज कॉर्न सिरप (HFCS) के रूप में।
    - वजन बढ़ना, चयापचय संबंधी विकार और लीवर की समस्याओं जैसी संभावित स्वास्थ्य समस्याओं से जुड़ा हुआ है।
    - इसमें कम पोषण मूल्य वाली "खाली कैलोरी" हो सकती है।
    - मक्का को बहुत अधिक पानी की आवश्यकता होती है, जिससे जल संकट को लेकर चिंताएं बढ़ जाती हैं
    - स्रोत: [WHO](https://www.who.int/news/item/04-03-2015-who-calls-on-countries-to-reduce-sugars-intake-among-adults-and-children), [WWF](https://www.worldwildlife.org/magazine/issues/summer-2024/articles/how-the-us-s-number-one-crop-is-putting-grasslands-at-risk)
"en:glucose-syrup":
  content: |-
    - ***यह क्या है:*** कॉर्नस्टार्च या गेहूं के स्टार्च से बना एक गाढ़ा, मीठा तरल पदार्थ।
    - ***इसका उपयोग क्यों किया जाता है:*** कैंडी में चीनी के क्रिस्टलीकरण को रोकता है, बेक किए गए सामान को नम रखता है और मिठास बढ़ाता है।
    - ***स्वास्थ्य संबंधी चिंताएँ:*** अत्यधिक प्रसंस्कृत, पोषक तत्वों में कम और वजन बढ़ने तथा अन्य स्वास्थ्य समस्याओं का कारण बन सकता है।
    - ***इन शब्दों को देखें:*** सामग्री सूची में "ग्लूकोज सिरप," "कॉर्न सिरप," या "कन्फेक्शनर ग्लूकोज" लिखा होना चाहिए।
    - ***चिंताएँ:***
    - ग्लूकोज सिरप में आमतौर पर फ्रक्टोज की मात्रा अधिक होती है, जो वजन बढ़ना, चयापचय संबंधी विकार और लीवर की समस्याओं जैसी संभावित स्वास्थ्य समस्याओं से जुड़ी होती है।
    - इसमें कम पोषण मूल्य वाली "खाली कैलोरी" हो सकती है।
    - स्रोत: [WHO](https://www.who.int/news/item/04-03-2015-who-calls-on-countries-to-reduce-sugars-intake-among-adults-and-children)
