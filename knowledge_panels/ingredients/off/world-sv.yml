"en:corn-syrup":
  content: |-
    - ***Vad det är:*** En sirap gjord av majsstärkelse som ofta används för att söta och göra bearbetade livsmedel tjockare.
    - ***Typer:*** Ljus (klar och milt söt) och mörk (med karamellsmak och mindre söt).
    - ***Risker:***
    - Hög fruktoshalt, särskilt i form av majssirap med hög fruktoshalt (HFCS).
    - Har kopplats till möjliga hälsoproblem som viktökning, ämnesomsättningsrubbningar och leverproblem.
    - Kan bidra med ”tomma kalorier” med lågt näringsvärde.
    - Majs kräver mycket vatten, vilket väcker oro för vattenstress.
    - Källor: [WHO](https://www.who.int/news/item/04-03-2015-who-calls-on-countries-to-reduce-sugars-intake-among-adults-and-children), [WWF](https://www.worldwildlife.org/magazine/issues/summer-2024/articles/how-the-us-s-number-one-crop-is-putting-grasslands-at-risk)
"en:glucose-syrup":
  content: |-
    - ***Vad det är:*** En tjock, söt vätska gjord av majs- eller vetestärkelse.
    - ***Varför den används:*** Förhindrar att socker kristalliseras i godis, håller bakverk saftiga och tillför sötma.
    - ***Hälsorisker:*** Kraftigt bearbetad, näringsfattig och kan bidra till viktökning och andra hälsoproblem.
    - ***Leta efter:*** ”glukossirap”, ”majssirap” eller ”konditorglukos” i ingrediensförteckningen.
    - ***Risker:***
    - Glukossirap har vanligtvis hög fruktoshalt, vilket har kopplats till möjliga hälsoproblem som viktökning, ämnesomsättningsrubbningar och leverproblem.
    - Kan bidra med ”tomma kalorier” med lågt näringsvärde.
    - Källor: [WHO](https://www.who.int/news/item/04-03-2015-who-calls-on-countries-to-reduce-sugars-intake-among-adults-and-children)
