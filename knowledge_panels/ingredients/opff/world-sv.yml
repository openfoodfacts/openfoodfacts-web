"en:chicken-meal":
  content: |-
    - ***Vad det är: Kycklingmjöl är en koncentrerad proteinkälla som framställs av tillagat kycklingkött och ben. Det är en vanlig ingrediens i djurfoder som ger viktiga aminosyror.
    - ***Typer: Kvaliteten kan variera. Mjöl av högre kvalitet anger råvarans ursprung (t.ex. är "fjäderfämjöl" mindre specifikt). Leta efter mjöl som har bearbetats under sträng kvalitetskontroll.
    - ***Farhågor:
    - Det finns vissa farhågor kring kycklingmjölets smältbarhet, beroende på vilka bearbetningsmetoder som har använts.
    - Kycklingens ursprung kan vara viktigt för vissa djurägare, särskilt dem som efterfrågar särskilda djurskyddsstandarder.
"en:brown-rice":
  content: |-
    - ***Vad det är: Brunt ris är ett fullkorn som ger kolhydrater, fibrer samt vissa vitaminer och mineraler. Det används ofta i djurfoder som energikälla och för att främja matsmältningen.
    - ***Typer: Det finns olika sorters brunt ris, exempelvis långkornigt, medelkornigt och kortkornigt. Näringsprofilen kan variera något mellan sorterna.
    - ***Farhågor:
    - Även om brunt ris i allmänhet anses hälsosamt kan det innehålla arsenik, ett naturligt förekommande grundämne som kan vara skadligt i höga halter. Djurfodertillverkare bör testa arsenikhalterna.
    - Vissa husdjur kan vara känsliga eller allergiska mot ris.
"en:fish-oil":
  content: |-
    - ***Vad det är: Fiskolja är en rik källa till omega-3-fettsyror, som är bra för husdjurs hud, päls, leder och kognitiva funktion. Den tillsätts ofta i djurfoder som ett kosttillskott.
    - ***Typer: Olika fiskarter används för att framställa fiskolja (t.ex. lax, torsk och sardin). Kvaliteten och koncentrationen av omega-3 kan variera. Leta efter fiskolja som har renats från föroreningar som kvicksilver.
    - ***Farhågor:
    - Fiskolja kan härskna om den inte förvaras korrekt, vilket kan minska dess verkan och eventuellt vara skadligt.
    - För stora tillskott av fiskolja kan leda till matsmältningsproblem eller andra hälsoproblem.
