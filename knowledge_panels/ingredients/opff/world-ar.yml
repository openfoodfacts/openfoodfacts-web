"en:chicken-meal":
  content: |-
    - ***ما هو؟: مسحوق الدجاج هو مصدر مركز للبروتين مصنوع من لحم الدجاج المطبوخ وعظامه. وهو مكون شائع في أغذية الحيوانات الأليفة، حيث يوفر الأحماض الأمينية الأساسية.
    - ***الأنواع: تختلف الجودة، حيث تُحدد الوجبات عالية الجودة المصدر (على سبيل المثال، "مسحوق الدواجن" أقل تحديدًا). ابحث عن الوجبات التي تتم معالجتها وفقًا لضوابط جودة صارمة.
    - ***المخاوف:
    - توجد بعض المخاوف بشأن سهولة هضم مسحوق الدجاج، اعتمادًا على طرق المعالجة المستخدمة.
    - قد يكون مصدر الدجاج مصدر قلق لبعض أصحاب الحيوانات الأليفة، وخاصة أولئك الذين يبحثون عن معايير محددة لرعاية الحيوان.
"en:brown-rice":
  content: |-
    - ***ما هو: الأرز البني هو حبوب كاملة غنية بالكربوهيدرات والألياف وبعض الفيتامينات والمعادن. يُستخدم غالبًا في أغذية الحيوانات الأليفة كمصدر للطاقة وللمساعدة على الهضم.
    - ***أنواعه: توجد أنواع مختلفة من الأرز البني، مثل الأرز طويل الحبة، ومتوسط الحبة، وقصير الحبة. قد يختلف المحتوى الغذائي قليلاً بين الأنواع.
    - ***مخاوف:
    - على الرغم من أن الأرز البني يُعتبر صحيًا بشكل عام، إلا أنه قد يحتوي على الزرنيخ، وهو عنصر طبيعي قد يكون ضارًا بكميات كبيرة. يجب على مصنعي أغذية الحيوانات الأليفة فحص مستويات الزرنيخ.
    - قد تعاني بعض الحيوانات الأليفة من حساسية أو تحسس تجاه الأرز.
"en:fish-oil":
  content: |-
    - ***ما هو: زيت السمك مصدر غني بأحماض أوميغا 3 الدهنية، المفيدة لبشرة وفرو ومفاصل ووظائف إدراك الحيوانات الأليفة. يُضاف عادةً إلى طعام الحيوانات الأليفة كمكمل غذائي.
    - ***الأنواع: تُستخدم أنواع مختلفة من الأسماك لإنتاج زيت السمك (مثل السلمون، والقد، والسردين). قد تختلف جودة وتركيز أحماض أوميغا 3. ابحث عن زيت سمك مُنقّى لإزالة الملوثات مثل الزئبق.
    - ***المخاوف:
    - قد يتزنخ زيت السمك إذا لم يُخزّن بشكل صحيح، مما قد يقلل من فعاليته وقد يكون ضارًا.
    - الإفراط في تناول زيت السمك كمكمل غذائي قد يؤدي إلى مشاكل في الجهاز الهضمي أو مشاكل صحية أخرى.
