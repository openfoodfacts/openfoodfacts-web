"en:iron":
  content: |-
    Il ferro è un minerale che contribuisce (tra le altre cose) al trasporto dell'ossigeno in tutto il corpo. La carenza di ferro può causare anemia, affaticamento e limitazione delle funzioni corporee. Carni magre, pollame, pesce, legumi e verdure a foglia verde scuro sono buone fonti di ferro. Abbinarli ad alimenti ricchi di vitamina C può favorire l'assorbimento del ferro da parte dell'organismo.
