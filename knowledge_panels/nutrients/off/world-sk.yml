"en:iron":
  content: |-
    - Železo je minerál, ktorý (okrem iného) pomáha prenášať kyslík v tele. Nedostatok železa môže spôsobiť anémiu, únavu a obmedzené telesné funkcie. Chudé mäso, hydina, ryby, strukoviny a tmavozelená listová zelenina sú dobrým zdrojom železa. Ich kombinácia s potravinami bohatými na vitamín C môže pomôcť vášmu telu vstrebávať železo.
