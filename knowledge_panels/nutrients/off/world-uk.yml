"en:iron":
  content: |-
    Залізо — це мінерал, який (серед іншого) допомагає переносити кисень по всьому тілу. Дефіцит заліза може спричинити анемію, втому та обмеження функцій організму. Пісне м'ясо, птиця, риба, бобові та темно-зелені листові овочі є хорошими джерелами заліза. Поєднання їх із продуктами, багатими на вітамін С, може допомогти вашому організму краще засвоювати залізо.
