"en:iron":
  content: |-
    आयरन एक ऐसा खनिज है जो (अन्य कार्यों के अलावा) पूरे शरीर में ऑक्सीजन पहुंचाने में मदद करता है। आयरन की कमी से एनीमिया, थकान और शरीर के कार्यों में रुकावट आ सकती है। कम वसा वाला मांस, मुर्गी, मछली, दालें और गहरे हरे पत्तेदार सब्जियां आयरन के अच्छे स्रोत हैं। इन्हें विटामिन सी से भरपूर खाद्य पदार्थों के साथ खाने से शरीर को आयरन को अवशोषित करने में मदद मिल सकती है।
