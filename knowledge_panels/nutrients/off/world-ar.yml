"en:iron":
  content: |-
    الحديد معدنٌ يُساعد (من بين أمور أخرى) على نقل الأكسجين في جميع أنحاء الجسم. نقص الحديد قد يُسبب فقر الدم، والتعب، وضعف وظائف الجسم. اللحوم الخالية من الدهون، والدواجن، والأسماك، والبقوليات، والخضراوات الورقية الخضراء الداكنة مصادر جيدة للحديد. تناولها مع أطعمة غنية بفيتامين سي يُساعد الجسم على امتصاص الحديد.
