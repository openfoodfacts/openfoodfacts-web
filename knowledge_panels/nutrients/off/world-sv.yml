"en:iron":
  content: |-
    - Järn är ett mineral som bland annat hjälper till att transportera syre i hela kroppen. Järnbrist kan orsaka blodbrist, trötthet och försämrad kroppsfunktion. Magert kött, fågelkött, fisk, baljväxter och mörkgröna bladgrönsaker är goda järnkällor. Om de kombineras med livsmedel som är rika på C-vitamin kan kroppen lättare ta upp järnet.
