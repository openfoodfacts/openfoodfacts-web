"en:pegi_3":
  content: |-
    - ***Apa itu:*** Konten dianggap cocok untuk semua kelompok usia.
    - ***Ciri Kunci:***
    - **Kekerasan:** Hanya bentuk kekerasan yang sangat ringan yang dapat diterima, biasanya dalam pengaturan yang lucu, kartun, atau seperti anak-anak (misalnya, slapstick, kerusakan yang diimajinasikan, reaksi yang tidak realistis).
    - **Ketakutan:** Tidak ada suara atau gambar yang kemungkinan menakutkan anak kecil.
    - **Bahasa:** Tidak ada bahasa yang buruk yang harus didengar.
    - **Lainnya:** Tidak ada konten seksual, narkoba, atau perjudian.
    - ***Implikasi:*** Peringkat ini berfokus pada memastikan konten aman dan tidak mengganggu untuk penonton termuda.
    - ***Sumber:*** [Situs Web Resmi PEGI](https://pegi.info/what-do-the-labels-mean), [Panduan Orang Tua untuk Peringkat PEGI oleh Uswitch](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_7":
  content: |-
    - ***Apa itu:*** Konten cocok untuk anak-anak berusia 7 tahun dan di atasnya.
    - ***Ciri-ciri Utama:***
    - **Kekerasan:** Bentuk-bentuk kekerasan yang sangat ringan dapat diterima. Ini dapat berupa kekerasan yang tersirat, tidak terperinci, atau tidak realistis, sering kali ditujukan kepada karakter fantasi. Kekerasan yang sangat ringan dan tidak realistis terhadap karakter yang mirip manusia juga dapat muncul.
    - **Ketakutan:** Permainan dengan adegan atau suara yang mungkin menakutkan bagi anak-anak yang lebih muda (misalnya, atmosfer yang mengganggu, beberapa suara atau gambar yang menakutkan) termasuk dalam kategori ini.
    - **Bahasa:** Tidak ada bahasa yang buruk, atau hanya sumpah serapah yang sangat ringan dan non-seksual.
    - **Lainnya:** Masih tidak ada konten seksual eksplisit, narkoba, atau perjudian.
    - ***Implikasi:*** Memperkenalkan elemen yang mungkin terlalu intens bagi anak-anak yang sangat muda, terutama dalam hal ketakutan dan kekerasan fantasi yang sedikit lebih menonjol.
    - ***Sumber:*** [Situs Resmi PEGI](https://pegi.info/what-do-the-labels-mean), [Panduan Orang Tua untuk Peringkat PEGI oleh Uswitch](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_12":
  content: |-
    - ***Apa itu:*** Konten cocok untuk individu berusia 12 tahun ke atas.
    - ***Ciri Khas:***
    - **Kekerasan:** Kekerasan yang lebih grafis atau realistis terhadap karakter fantasi, atau kekerasan non-realistis terhadap karakter mirip manusia. Ini bisa termasuk dampak yang lebih terlihat, tetapi umumnya tanpa darah. Kekerasan tersirat terhadap manusia di mana kekerasan sebenarnya tidak ditampilkan juga dicakup.
    - **Ketakutan/Kengerian:** Ancaman yang lebih kuat, ketakutan, atau detail cedera yang grafis, dan urutan kengerian yang lebih lama atau gambar yang mengganggu.
    - **Bahasa:** Umpatan ringan dan/atau bahasa yang menyinggung (selain kata-kata kasar seksual).
    - **Seks:** Sindiran seksual atau pose seksual dapat hadir. Ketelanjangan erotis atau hubungan seksual non-eksplisit.
    - **Judi:** Dapat mencakup elemen yang mendorong atau mengajarkan perjudian (simulasi permainan kasino, dll.).
    - ***Implikasi:*** Menandai langkah penting dalam kedewasaan, termasuk kekerasan yang lebih realistis, tema yang mengandung saran, dan umpatan ringan.
    - ***Sumber:*** [Situs Resmi PEGI](https://pegi.info/what-do-the-labels-mean), [Panduan Orang Tua untuk Peringkat PEGI oleh Uswitch](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_16":
  content: |-
    - ***Apa itu:*** Konten sesuai untuk individu berusia 16 tahun ke atas.
    - ***Ciri Khas:***
    - **Kekerasan:** Penggambaran kekerasan (atau aktivitas seksual) yang mencapai tahap yang terlihat sama seperti yang diharapkan dalam kehidupan nyata. Ini dapat mencakup kekerasan realistis terhadap karakter manusia, sering dengan penggambaran kematian dan cedera. Kekerasan berdarah atau berdarah mungkin ada jika dalam gaya arcade.
    - **Bahasa:** Bahasa yang lebih ekstrem, termasuk kata-kata kasar seksual atau hujatan.
    - **Obat:** Dapat mencakup dorongan untuk menggunakan tembakau atau alkohol, atau penggambaran penggunaan obat-obatan terlarang.
    - **Seks:** Keganjilan erotis atau hubungan seksual tanpa alat kelamin yang terlihat.
    - **Perjudian:** Dapat mencakup elemen yang mendorong atau mengajarkan perjudian.
    - ***Implikasi:*** Konten di tingkat ini jauh lebih matang dan sering kali mencakup tema realistis dan berpotensi mengganggu.
    - ***Sumber:*** [Situs Resmi PEGI](https://pegi.info/what-do-the-labels-mean), [Panduan Orang Tua tentang Peringkat PEGI oleh Uswitch](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_18":
  content: |-
    - ***Apa itu:*** Konten hanya cocok untuk orang dewasa.
    - ***Ciri-ciri Utama:***
    - **Kekerasan:** Berlaku ketika tingkat kekerasan menjadi "kekerasan yang parah." Ini termasuk metode mengerikan dalam menyebabkan kematian atau cedera parah, penyiksaan, pemenggalan, pemotongan anggota tubuh, pembunuhan tanpa motif, atau kekerasan terhadap karakter yang tidak berdaya. Kekerasan seksual dan ancaman juga diklasifikasikan di sini.
    - **Narkoba:** Penggambaran yang diglamorkan tentang narkoba ilegal atau promosi menonjol zat terlarang.
    - **Seks:** Aktivitas seksual yang terperinci atau eksplisit, termasuk alat kelamin yang terlihat.
    - **Judi:** Simulasi perjudian yang realistis.
    - **Diskriminasi:** Dapat mengandung unsur yang mendorong atau mengajarkan diskriminasi.
    - ***Implikasi:*** Ini adalah peringkat usia tertinggi dan menunjukkan konten yang secara ketat untuk audiens dewasa karena sifatnya yang grafis dan berpotensi mengganggu.
    - ***Sumber:*** [Situs Web Resmi PEGI](https://pegi.info/what-do-the-labels-mean), [Panduan Orang Tua untuk Peringkat PEGI oleh Uswitch](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_violence":
  content: |-
    - ***Apa itu:*** Deskripsi ini menunjukkan bahwa gim tersebut mengandung penggambaran kekerasan.
    - ***Tingkat Keparahan:***
    - **Ringan/Kartun (PEGI 3/7):** Kekerasan yang sangat ringan dan tidak realistis (misalnya, slapstick, kekerasan kartun, atau kekerasan tersirat) yang sering ditujukan pada karakter fantasi.
    - **Sedang (PEGI 12):** Kekerasan yang lebih grafis atau realistis terhadap karakter fantasi, atau kekerasan yang tidak realistis terhadap karakter mirip manusia (misalnya, cedera ringan, tanpa darah).
    - **Berat (PEGI 16):** Kekerasan realistis terhadap karakter manusia, termasuk penggambaran kematian dan cedera. Kekerasan yang mengerikan atau berdarah mungkin ada jika bergaya arcade.
    - **Menjijikkan (PEGI 18):** Metode mengerikan untuk menyebabkan kematian atau cedera parah, termasuk penyiksaan, pemenggalan kepala, pemotongan anggota tubuh, atau kekerasan tanpa motif terhadap karakter yang rentan/tidak bersalah. Kekerasan dan ancaman seksual juga diklasifikasikan di sini.
    - ***Implikasi:*** Semakin tinggi peringkat usia PEGI yang terkait, semakin intens dan realistis kekerasan yang digambarkan.
    - ***Sumber:*** [Situs Web Resmi PEGI](https://pegi.info/what-do-the-labels-mean), [Otoritas Peringkat Game](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_bad_language":
  content: |-
    - ***Apa itu:*** Deskripsi ini menunjukkan bahwa permainan mengandung bahasa kasar atau umpatan.
    - ***Tingkat Kekerasan:***
    - **Ringan (PEGI 12):** Umpatan ringan dan/atau bahasa kasar, selain kata-kata kasar seksual (contoh: "damn," "hell," "crap").
    - **Kuat (PEGI 16/18):** Kata-kata kasar seksual, hujat, atau bahasa yang sangat kasar.
    - ***Implikasi:*** Kehadiran dan intensitas bahasa kasar meningkat dengan rating usia PEGI yang lebih tinggi.
    - ***Sumber:*** [Situs Resmi PEGI](https://pegi.info/what-do-the-labels-mean), [Otoritas Rating Permainan](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_fear":
  content: |-
    - ***What it is:*** This descriptor indicates that the game contains elements that may be frightening or scary.
    - ***Severity Levels:***
    - **Frightening (PEGI 7):** Pictures or sounds likely to be scary or frightening to young children (e.g., haunting music, scary environments, background screams). Does not necessarily include direct violence.
    - **Horror (PEGI 12+):** Stronger threat, dread, or graphic injury details, and more sustained horror sequences or disturbing images.
    - ***Implication:*** Focuses on psychological impact and disturbing content, rather than explicit violence.
    - ***Sources:*** [PEGI Official Website](https://pegi.info/what-do-the-labels-mean), [Games Rating Authority](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_gambling":
  content: |-
    - ***Apa itu:*** Deskriptor ini menunjukkan bahwa permainan mengandung unsur yang mendorong atau mengajarkan perjudian.
    - ***Lingkup:*** Merujuk pada simulasi permainan tradisional yang biasanya ditemukan di kasino atau ruang perjudian (misalnya, permainan kartu yang dimainkan untuk uang, taruhan pada balapan).
    - ***Rating Minimum:*** Deskriptor ini hanya muncul pada permainan dengan rating **PEGI 12, 16, atau 18**. Mulai tahun 2020, permainan baru dengan simulasi perjudian yang realistis selalu mendapat rating PEGI 18.
    - ***Catatan tentang Loot Boxes:*** Keberadaan "Barang Acak Berbayar" (sering disebut sebagai loot boxes) adalah deskriptor konten terpisah ("Pembelian dalam Permainan") dan dapat ditemukan dalam permainan dengan rating usia yang lebih rendah (misalnya, PEGI 7).
    - ***Sumber:*** [Situs Web Resmi PEGI](https://pegi.info/what-do-the-labels-mean), [Otoritas Rating Permainan](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_sex":
  content: |-
    - ***What it is:*** This descriptor indicates the presence of sexual content in the game.
    - ***Severity Levels:***
    - **Innuendo/Posturing (PEGI 12):** Sexual posturing or innuendo.
    - **Erotic Nudity/Non-Explicit Intercourse (PEGI 16):** Depictions of erotic nudity or sexual intercourse without visible genitals.
    - **Explicit Sexual Activity (PEGI 18):** Detailed or explicit sexual activity, including visible genitalia. Sexual violence and threat also fall into this category.
    - ***Implication:*** The level of explicitness and detail in sexual content increases with higher PEGI age ratings.
    - ***Sources:*** [PEGI Official Website](https://pegi.info/what-do-the-labels-mean), [Games Rating Authority](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_drugs":
  content: |-
    - ***Apa itu:*** Deskriptor ini menunjukkan bahwa permainan merujuk atau menggambarkan penggunaan obat-obatan terlarang, alkohol, atau tembakau.
    - ***Tingkat Keparahan:***
    - **Pendorongan/Gambaran Penggunaan (PEGI 16):** Pendorongan penggunaan tembakau atau alkohol (mis., karakter mendapatkan keuntungan) atau gambaran penggunaan obat-obatan terlarang.
    - **Pemuliaan/Promosi (PEGI 18):** Penggambaran yang dimuliakan tentang obat-obatan terlarang atau promosi yang menonjol tentang zat yang dikendalikan.
    - ***Rating Minimum:*** Deskriptor ini hanya ditemukan pada permainan dengan rating **PEGI 16 atau PEGI 18**.
    - ***Sumber:*** [Situs Resmi PEGI](https://pegi.info/what-do-the-labels-mean), [Otoritas Rating Permainan](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_discrimination":
  content: |-
    - ***Apa itu:*** Deskripsi ini menunjukkan bahwa permainan mengandung gambaran stereotip etnis, agama, nasionalisme, atau lainnya yang kemungkinan mendorong kebencian.
    - ***Konteks:*** Peringkat ini diterapkan ketika permainan mempromosikan atau memuliakan diskriminasi terhadap kelompok berdasarkan asal usul, agama, kewarganegaraan, gender, seksualitas, atau karakteristik lainnya.
    - ***Peringkat Minimum:*** Deskripsi ini biasanya muncul pada permainan dengan peringkat **PEGI 18**, karena sifat konten yang parah.
    - ***Sumber:*** [Situs Resmi PEGI](https://pegi.info/what-do-the-labels-mean), [Otoritas Penilaian Permainan](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_in_game_purchases":
  content: |-
    - ***Apa itu:*** Deskripsi ini menunjukkan bahwa game menawarkan pembelian digital opsional dengan uang sungguhan.
    - ***Cakupan:*** Mencakup berbagai bentuk pembelian dalam game:
    - **Item kosmetik:** Skin, emote, peningkatan visual.
    - **Keuntungan gameplay:** Power-up, mata uang, booster.
    - **Ekspansi/DLC:** Konten atau cerita tambahan.
    - **Item Acak Berbayar (Loot Box):** Di mana pemain tidak tahu persis apa yang mereka dapatkan sebelum pembelian (misalnya, paket kartu, peti item).
    - ***Catatan:*** Deskripsi ini **bukan** peringkat usia tetapi ikon informasi. Ini dapat muncul pada game dengan peringkat usia PEGI apa pun, termasuk PEGI 3.
    - ***Perhatian (khususnya untuk anak-anak):*** Potensi pengeluaran berlebihan, dorongan perilaku seperti judi dengan item acak, dan tekanan untuk membeli agar bisa maju.
    - ***Sumber:*** [Situs Web Resmi PEGI](https://pegi.info/what-do-the-labels-mean), [Zona Orang Tua - Memahami peringkat PEGI](https://parentzone.org.uk/article/pegi-games-ratings)
