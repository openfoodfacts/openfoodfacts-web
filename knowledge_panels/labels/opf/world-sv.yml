"en:pegi_3":
  content: |-
    - ***Vad det är:*** Innehållet anses lämpligt för alla åldersgrupper.
    - ***Viktiga egenskaper:***
    - **Våld:** Endast mycket milda former av våld är tillåtna, vanligtvis i en komisk, tecknad eller barnliknande miljö (t.ex. slapstick, antydda skador och orealistiska reaktioner).
    - **Rädsla:** Inga ljud eller bilder som sannolikt skrämmer små barn.
    - **Språk:** Inga svordomar får förekomma.
    - **Övrigt:** Inget sexuellt innehåll, inga droger och inget hasardspel.
    - ***Innebörd:*** Klassificeringen ska säkerställa att innehållet är tryggt och inte obehagligt för den yngsta publiken.
    - ***Källor:*** [PEGI:s officiella webbplats](https://pegi.info/what-do-the-labels-mean), [Uswitch – föräldraguide till PEGI-klassificeringar](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_7":
  content: |-
    - ***Vad det är:*** Innehållet är lämpligt för barn från 7 års ålder.
    - ***Viktiga egenskaper:***
    - **Våld:** Mycket milda former av våld är tillåtna. Våldet kan vara antytt, odetaljerat eller orealistiskt och är ofta riktat mot fantasifigurer. Även mycket milt orealistiskt våld mot människoliknande figurer kan förekomma.
    - **Rädsla:** Spel med scener eller ljud som kan skrämma yngre barn (t.ex. en obehaglig stämning eller vissa skrämmande ljud eller bilder) tillhör denna kategori.
    - **Språk:** Inga svordomar, eller endast mycket milda svordomar utan sexuell innebörd.
    - **Övrigt:** Fortfarande inget uttryckligt sexuellt innehåll, inga droger och inget hasardspel.
    - ***Innebörd:*** Innehållet kan innehålla inslag som är för intensiva för mycket små barn, särskilt i fråga om rädsla och något tydligare fantasivåld.
    - ***Källor:*** [PEGI:s officiella webbplats](https://pegi.info/what-do-the-labels-mean), [Uswitch – föräldraguide till PEGI-klassificeringar](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_12":
  content: |-
    - ***Vad det är:*** Innehållet är lämpligt för personer från 12 års ålder.
    - ***Viktiga egenskaper:***
    - **Våld:** Mer grafiskt eller realistiskt våld mot fantasifigurer, eller orealistiskt våld mot människoliknande figurer. Konsekvenserna kan visas tydligare, men i allmänhet utan blod och lemlästning. Även antytt våld mot människor där själva våldet inte visas omfattas.
    - **Rädsla/skräck:** Starkare hot eller fasa, grafiska detaljer av skador samt längre skräcksekvenser eller obehagliga bilder.
    - **Språk:** Milda svordomar och/eller kränkande språk (men inte sexuella kraftuttryck).
    - **Sex:** Sexuella antydningar eller sexuella poser kan förekomma, liksom erotisk nakenhet eller samlag som inte skildras uttryckligt.
    - **Hasardspel:** Kan innehålla inslag som uppmuntrar till eller lär ut hasardspel (t.ex. simuleringar av kasinospel).
    - ***Innebörd:*** Klassificeringen innebär ett tydligt steg upp i mognadsnivå, med bland annat mer realistiskt våld, anspelningar och milda svordomar.
    - ***Källor:*** [PEGI:s officiella webbplats](https://pegi.info/what-do-the-labels-mean), [Uswitch – föräldraguide till PEGI-klassificeringar](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_16":
  content: |-
    - ***Vad det är:*** Innehållet är lämpligt för personer från 16 års ålder.
    - ***Viktiga egenskaper:***
    - **Våld:** Skildringar av våld (eller sexuell aktivitet) som ser ut som de skulle göra i verkligheten. Det kan handla om realistiskt våld mot människor, ofta med skildringar av dödsfall och skador. Mycket blodigt våld kan förekomma om det är i arkadstil.
    - **Språk:** Grövre språk, inklusive sexuella kraftuttryck eller hädelser.
    - **Droger:** Kan uppmuntra till bruk av tobak eller alkohol eller skildra bruk av olagliga droger.
    - **Sex:** Erotiska nakenscener eller samlag utan synliga könsorgan.
    - **Hasardspel:** Kan innehålla inslag som uppmuntrar till eller lär ut hasardspel.
    - ***Innebörd:*** Innehåll på denna nivå är betydligt mer vuxet och innehåller ofta realistiska och potentiellt obehagliga teman.
    - ***Källor:*** [PEGI:s officiella webbplats](https://pegi.info/what-do-the-labels-mean), [Uswitch – föräldraguide till PEGI-klassificeringar](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_18":
  content: |-
    - ***Vad det är:*** Innehållet är endast lämpligt för vuxna.
    - ***Viktiga egenskaper:***
    - **Våld:** Används när våldsnivån når det som kallas "grovt våld". Det omfattar ohyggliga sätt att döda eller orsaka svåra skador, tortyr, halshuggning, lemlästning, oprovocerat dödande eller våld mot försvarslösa personer. Även sexuellt våld och hot hör till denna kategori.
    - **Droger:** Förskönande skildringar av olagliga droger eller tydligt främjande av narkotikaklassade ämnen.
    - **Sex:** Detaljerad eller uttrycklig sexuell aktivitet, inklusive synliga könsorgan.
    - **Hasardspel:** Realistiska simuleringar av hasardspel.
    - **Diskriminering:** Kan innehålla inslag som uppmuntrar till eller lär ut diskriminering.
    - ***Innebörd:*** Detta är den högsta åldersklassificeringen och anger att innehållet uteslutande är avsett för vuxna på grund av sina grafiska och potentiellt obehagliga skildringar.
    - ***Källor:*** [PEGI:s officiella webbplats](https://pegi.info/what-do-the-labels-mean), [Uswitch – föräldraguide till PEGI-klassificeringar](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_violence":
  content: |-
    - ***Vad det är:*** Den här innehållsmärkningen anger att spelet innehåller våldsskildringar.
    - ***Intensitetsnivåer:***
    - **Milt/tecknat (PEGI 3/7):** Mycket milt, orealistiskt våld (t.ex. slapstick, tecknade skador eller antytt våld), ofta riktat mot fantasifigurer.
    - **Måttligt (PEGI 12):** Mer grafiskt eller realistiskt våld mot fantasifigurer eller orealistiskt våld mot människoliknande figurer (t.ex. lindriga skador utan blod).
    - **Kraftigt (PEGI 16):** Realistiskt våld mot människor, inklusive skildringar av dödsfall och skador. Brutalt eller blodigt våld kan förekomma om det är i arkadstil.
    - **Grovt (PEGI 18):** Ohyggliga sätt att döda eller orsaka svåra skador, inklusive tortyr, halshuggning, lemlästning eller oprovocerat våld mot utsatta eller oskyldiga personer. Även sexuellt våld och hot hör till denna kategori.
    - ***Innebörd:*** Ju högre PEGI-åldersklassificering, desto intensivare och mer realistiskt är det skildrade våldet.
    - ***Källor:*** [PEGI:s officiella webbplats](https://pegi.info/what-do-the-labels-mean), [Games Rating Authority](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_bad_language":
  content: |-
    - ***Vad det är:*** Den här innehållsmärkningen anger att spelet innehåller kränkande språk eller svordomar.
    - ***Intensitetsnivåer:***
    - **Milt (PEGI 12):** Milda svordomar och/eller kränkande språk, men inte sexuella kraftuttryck (t.ex. "fan", "helvete" eller "skit").
    - **Kraftigt (PEGI 16/18):** Sexuella kraftuttryck, hädelser eller mycket kränkande språk.
    - ***Innebörd:*** Förekomsten och grovheten av svordomar ökar med PEGI-åldersklassificeringen.
    - ***Källor:*** [PEGI:s officiella webbplats](https://pegi.info/what-do-the-labels-mean), [Games Rating Authority](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_fear":
  content: |-
    - ***Vad det är:*** Den här innehållsmärkningen anger att spelet innehåller inslag som kan vara skrämmande.
    - ***Intensitetsnivåer:***
    - **Skrämmande (PEGI 7):** Bilder eller ljud som sannolikt skrämmer små barn (t.ex. kuslig musik, skrämmande miljöer eller skrik i bakgrunden). Behöver inte innehålla direkt våld.
    - **Skräck (PEGI 12+):** Starkare hot eller fasa, grafiska detaljer av skador samt längre skräcksekvenser eller obehagliga bilder.
    - ***Innebörd:*** Fokuserar på den psykologiska effekten och obehagligt innehåll snarare än på uttryckligt våld.
    - ***Källor:*** [PEGI:s officiella webbplats](https://pegi.info/what-do-the-labels-mean), [Games Rating Authority](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_gambling":
  content: |-
    - ***Vad det är:*** Den här innehållsmärkningen anger att spelet innehåller inslag som uppmuntrar till eller lär ut hasardspel.
    - ***Omfattning:*** Avser simuleringar av traditionella hasardspel som vanligtvis finns på kasinon eller i spelhallar (t.ex. kortspel om pengar eller vadslagning på lopp).
    - ***Lägsta klassificering:*** Märkningen förekommer endast på spel med klassificeringen **PEGI 12, 16 eller 18**. Sedan 2020 får nyklassificerade spel med realistiska simuleringar av hasardspel alltid PEGI 18.
    - ***Om lootlådor:*** "Betalda slumpmässiga föremål" (ofta kallade lootlådor) är en separat innehållsmärkning ("Köp i spelet") och kan förekomma i spel med lägre åldersklassificeringar (t.ex. PEGI 7).
    - ***Källor:*** [PEGI:s officiella webbplats](https://pegi.info/what-do-the-labels-mean), [Games Rating Authority](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_sex":
  content: |-
    - ***Vad det är:*** Den här innehållsmärkningen anger att spelet innehåller sexuellt innehåll.
    - ***Intensitetsnivåer:***
    - **Antydningar/poser (PEGI 12):** Sexuella poser eller antydningar.
    - **Erotisk nakenhet/samlag utan uttryckliga detaljer (PEGI 16):** Skildringar av erotisk nakenhet eller samlag utan synliga könsorgan.
    - **Uttrycklig sexuell aktivitet (PEGI 18):** Detaljerad eller uttrycklig sexuell aktivitet, inklusive synliga könsorgan. Även sexuellt våld och hot hör till denna kategori.
    - ***Innebörd:*** Det sexuella innehållet blir mer uttryckligt och detaljerat med PEGI-åldersklassificeringen.
    - ***Källor:*** [PEGI:s officiella webbplats](https://pegi.info/what-do-the-labels-mean), [Games Rating Authority](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_drugs":
  content: |-
    - ***Vad det är:*** Den här innehållsmärkningen anger att spelet hänvisar till eller skildrar bruk av olagliga droger, alkohol eller tobak.
    - ***Intensitetsnivåer:***
    - **Uppmuntran/skildring av bruk (PEGI 16):** Uppmuntran till bruk av tobak eller alkohol (t.ex. att en figur får en fördel) eller skildringar av bruk av olagliga droger.
    - **Förskönande skildring/främjande (PEGI 18):** Förskönande skildringar av olagliga droger eller tydligt främjande av narkotikaklassade ämnen.
    - ***Lägsta klassificering:*** Märkningen förekommer endast på spel med klassificeringen **PEGI 16 eller PEGI 18**.
    - ***Källor:*** [PEGI:s officiella webbplats](https://pegi.info/what-do-the-labels-mean), [Games Rating Authority](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_discrimination":
  content: |-
    - ***Vad det är:*** Den här innehållsmärkningen anger att spelet innehåller skildringar av etniska, religiösa, nationalistiska eller andra stereotyper som sannolikt uppmuntrar till hat.
    - ***Sammanhang:*** Klassificeringen används när spelet främjar eller förhärligar diskriminering av grupper på grund av ursprung, religion, nationalitet, kön, sexualitet eller andra egenskaper.
    - ***Lägsta klassificering:*** Märkningen förekommer vanligtvis på spel med klassificeringen **PEGI 18** eftersom innehållet är så allvarligt.
    - ***Källor:*** [PEGI:s officiella webbplats](https://pegi.info/what-do-the-labels-mean), [Games Rating Authority](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_in_game_purchases":
  content: |-
    - ***Vad det är:*** Den här innehållsmärkningen anger att spelet erbjuder valfria digitala köp med riktiga pengar.
    - ***Omfattning:*** Omfattar olika former av köp i spelet:
    - **Kosmetiska föremål:** Utseenden, emotes och visuella förbättringar.
    - **Spelfördelar:** Power-ups, valuta och förstärkningar.
    - **Expansioner/DLC:** Ytterligare innehåll eller berättelser.
    - **Betalda slumpmässiga föremål (lootlådor):** Spelarna vet inte exakt vad de får före köpet (t.ex. kortpaket eller föremålslådor).
    - ***Observera:*** Märkningen är **inte** en åldersklassificering utan en informationsikon. Den kan förekomma på spel med vilken PEGI-åldersklassificering som helst, inklusive PEGI 3.
    - ***Risker (särskilt för barn):*** Risk för överdrivna utgifter, uppmuntran till hasardspelsliknande beteenden med slumpmässiga föremål och press att köpa för att komma vidare.
    - ***Källor:*** [PEGI:s officiella webbplats](https://pegi.info/what-do-the-labels-mean), [Parent Zone – förklaring av PEGI-klassificeringar](https://parentzone.org.uk/article/pegi-games-ratings)
