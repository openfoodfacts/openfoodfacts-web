"en:pegi_3":
  content: |-
    - ***ما هو:*** يُعتبر المحتوى مناسبًا لجميع الفئات العمرية.
    - ***الخصائص الرئيسية:***
    - **العنف:** يُسمح فقط بأشكال العنف الخفيفة جدًا، وعادةً ما تكون في سياق كوميدي أو كرتوني أو طفولي (مثل: الكوميديا الجسدية، أو الإيحاء بالأذى، أو ردود الفعل غير الواقعية).
    - **الخوف:** لا يُسمح بأصوات أو صور من شأنها إخافة الأطفال الصغار.
    - **اللغة:** لا يُسمح بسماع أي لغة بذيئة.
    - **أخرى:** لا يُسمح بأي محتوى جنسي أو مخدرات أو قمار.
    - ***الدلالة:*** يركز هذا التصنيف على ضمان أن يكون المحتوى آمنًا وغير مزعج لأصغر المشاهدين.
    - ***المصادر:*** [الموقع الرسمي لتصنيف PEGI](https://pegi.info/what-do-the-labels-mean)، [Uswitch - دليل الآباء لتصنيفات PEGI](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_7":
  content: |-
    - ***ما هو:*** المحتوى مناسب للأطفال من عمر 7 سنوات فما فوق.
    - ***الخصائص الرئيسية:***
    - **العنف:** يُسمح بأشكال خفيفة جدًا من العنف. قد يكون هذا العنف ضمنيًا، أو غير مفصل، أو غير واقعي، وغالبًا ما يكون موجهًا ضد شخصيات خيالية. قد يتضمن أيضًا عنفًا خفيفًا جدًا وغير واقعي ضد شخصيات شبيهة بالبشر.
    - **الخوف:** تندرج الألعاب التي تحتوي على مشاهد أو أصوات قد تكون مخيفة للأطفال الصغار (مثل الأجواء المقلقة، أو بعض الأصوات أو الصور المخيفة) ضمن هذه الفئة.
    - **اللغة:** لا توجد لغة بذيئة، أو فقط ألفاظ نابية خفيفة جدًا وغير جنسية.
    - **أخرى:** لا يزال المحتوى الجنسي الصريح، والمخدرات، والمقامرة غير موجودة.
    - ***الدلالة:*** يُقدّم الفيلم عناصر قد تكون شديدة على الأطفال الصغار جدًا، لا سيما فيما يتعلق بالخوف والعنف الخيالي الأكثر وضوحًا.
    - ***المصادر:*** [الموقع الرسمي لتصنيفات PEGI](https://pegi.info/what-do-the-labels-mean)، [Uswitch - دليل الآباء لتصنيفات PEGI](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_12":
  content: |-
    - ***ما هو:*** المحتوى مناسب للأفراد الذين تبلغ أعمارهم 12 عامًا فأكثر.
    - ***الخصائص الرئيسية:***
    - **العنف:** عنف أكثر وضوحًا أو واقعية تجاه شخصيات خيالية، أو عنف غير واقعي تجاه شخصيات شبيهة بالبشر. قد يشمل ذلك تأثيرات مرئية أكثر، ولكن بشكل عام بدون مشاهد دموية. كما يشمل العنف الضمني ضد البشر حيث لا يتم عرض العنف الفعلي.
    - **الخوف/الرعب:** تهديد أقوى، أو رعب، أو تفاصيل إصابات واضحة، ومشاهد رعب متواصلة أو صور مزعجة.
    - **اللغة:** ألفاظ نابية خفيفة و/أو لغة مسيئة (باستثناء الألفاظ الجنسية البذيئة).
    - **الجنس:** قد يتضمن تلميحات جنسية أو وضعيات جنسية. عُريًا مثيرًا أو جماعًا غير صريح.
    - **المقامرة:** قد يتضمن عناصر تشجع على المقامرة أو تعلمها (محاكاة لألعاب الكازينو، إلخ).
    - ***الدلالة:*** يمثل هذا العمل نقلة نوعية في النضج، حيث يتضمن عنفًا أكثر واقعية، ومواضيع موحية، وبعض الألفاظ النابية الخفيفة.
    - ***المصادر:*** [الموقع الرسمي لتصنيف PEGI](https://pegi.info/what-do-the-labels-mean)، [Uswitch - دليل الآباء لتصنيفات PEGI](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_16":
  content: |-
    - ***ما هو:*** المحتوى مناسب للأفراد الذين تبلغ أعمارهم 16 عامًا فأكثر.
    - ***الخصائص الرئيسية:***
    - **العنف:** مشاهد عنف (أو نشاط جنسي) تصل إلى مرحلة تبدو مماثلة لما هو متوقع في الحياة الواقعية. قد يشمل ذلك عنفًا واقعيًا ضد الشخصيات البشرية، وغالبًا ما يتضمن مشاهد موت وإصابة. قد يكون العنف دمويًا أو بشعًا إذا كان بأسلوب ألعاب الأركيد.
    - **اللغة:** لغة بذيئة أكثر حدة، بما في ذلك ألفاظ جنسية نابية أو تجديف.
    - **المخدرات:** قد يشمل تشجيعًا على استخدام التبغ أو الكحول، أو مشاهد لتعاطي المخدرات غير المشروعة.
    - **الجنس:** عُريٌّ إباحي أو جماعٌ جنسيٌّ دون ظهور الأعضاء التناسلية.
    - **المقامرة:** قد تتضمن عناصر تُشجع على المقامرة أو تُعلّمها.
    - ***الدلالة:*** المحتوى في هذا المستوى أكثر نضجًا، وغالبًا ما يتضمن مواضيع واقعية قد تكون مُقلقة.
    - ***المصادر:*** [الموقع الرسمي لتصنيف PEGI](https://pegi.info/what-do-the-labels-mean)، [Uswitch - دليل الآباء لتصنيفات PEGI](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_18":
  content: |-
    - ***ما هو:*** المحتوى مناسب للبالغين فقط.
    - ***الخصائص الرئيسية:***
    - **العنف:** يُطبق هذا التصنيف عندما يصل مستوى العنف إلى "العنف الجسيم". ويشمل ذلك أساليب مروعة للتسبب في الموت أو الإصابة البليغة، والتعذيب، وقطع الرؤوس، وتقطيع الأوصال، والقتل بلا دافع، أو العنف ضد الشخصيات العاجزة عن الدفاع عن نفسها. كما يُصنف العنف الجنسي والتهديد ضمن هذا التصنيف.
    - **المخدرات:** تصويرات جذابة للمخدرات غير المشروعة أو ترويج بارز للمواد الخاضعة للرقابة.
    - **الجنس:** نشاط جنسي مفصل أو صريح، بما في ذلك الأعضاء التناسلية الظاهرة.
    - **المقامرة:** محاكاة واقعية للمقامرة.
    - **التمييز:** قد يحتوي على عناصر تشجع على التمييز أو تعلمه.
    - ***الدلالة:*** هذا هو أعلى تصنيف عمري، ويشير إلى محتوى مخصص للبالغين فقط نظرًا لطبيعته الصريحة والمزعجة المحتملة.
    - ***المصادر:*** [الموقع الرسمي لـ PEGI](https://pegi.info/what-do-the-labels-mean)، [Uswitch - دليل الآباء لتصنيفات PEGI](https://www.uswitch.com/broadband/studies/parents-guide-to-gaming/)
"en:pegi_violence":
  content: |-
    - ***ما هو:*** يشير هذا الوصف إلى أن اللعبة تحتوي على مشاهد عنف.
    - ***مستويات الشدة:***
    - **خفيف/كرتوني (PEGI 3/7):** عنف خفيف جدًا وغير واقعي (مثل: حركات كوميدية، أو أذى كرتوني، أو عنف ضمني) غالبًا ما يكون موجهًا لشخصيات خيالية.
    - **متوسط (PEGI 12):** عنف أكثر وضوحًا أو واقعية تجاه شخصيات خيالية، أو عنف غير واقعي تجاه شخصيات شبيهة بالبشر (مثل: إصابات طفيفة، بدون دماء).
    - **قوي (PEGI 16):** عنف واقعي تجاه شخصيات بشرية، بما في ذلك مشاهد الموت والإصابة. قد يكون هناك عنف دموي أو دموي مفرط إذا كانت اللعبة بأسلوب ألعاب الأركيد.
    - **عنف مفرط (PEGI 18):** أساليب مروعة للتسبب في الموت أو الإصابة البليغة، بما في ذلك التعذيب، وقطع الرؤوس، وتقطيع الأوصال، أو العنف غير المبرر ضد الشخصيات الضعيفة/البريئة. كما يُصنف العنف الجنسي والتهديد ضمن هذه الفئة.
    - ***الدلالة:*** كلما ارتفع تصنيف PEGI العمري، زادت حدة العنف المصوّر وواقعيته.
    - ***المصادر:*** [الموقع الرسمي لـ PEGI](https://pegi.info/what-do-the-labels-mean)، [هيئة تصنيف الألعاب](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_bad_language":
  content: |-
    - ***ما هو:*** يشير هذا الوصف إلى أن اللعبة تحتوي على لغة مسيئة أو ألفاظ نابية.
    - ***مستويات الشدة:***
    - **خفيف (PEGI 12):** ألفاظ نابية خفيفة و/أو لغة مسيئة، باستثناء الألفاظ الجنسية البذيئة (مثل: "اللعنة"، "الجحيم"، "هراء").
    - **قوي (PEGI 16/18):** ألفاظ جنسية بذيئة، أو تجديف، أو لغة مسيئة للغاية.
    - ***الدلالة:*** يزداد وجود اللغة البذيئة وشدتها مع ارتفاع تصنيف PEGI العمري.
    - ***المصادر:*** [الموقع الرسمي لهيئة PEGI](https://pegi.info/what-do-the-labels-mean), [هيئة تصنيف الألعاب](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_fear":
  content: |-
    - ***ما هو:*** يشير هذا الوصف إلى أن اللعبة تحتوي على عناصر قد تكون مخيفة أو مرعبة.
    - ***مستويات الخطورة:***
    - **مخيف (PEGI 7):** صور أو أصوات من المحتمل أن تكون مخيفة أو مرعبة للأطفال الصغار (مثل الموسيقى المرعبة، والبيئات المخيفة، والصراخ في الخلفية). لا يتضمن بالضرورة عنفًا مباشرًا.
    - **رعب (PEGI 12+):** تهديد أقوى، أو رعب، أو تفاصيل إصابات بشعة، ومشاهد رعب متواصلة أو صور مزعجة.
    - ***التأثير:*** يركز على التأثير النفسي والمحتوى المزعج، بدلاً من العنف الصريح.
    - ***المصادر:*** [الموقع الرسمي لهيئة PEGI](https://pegi.info/what-do-the-labels-mean), [هيئة تصنيف الألعاب](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_gambling":
  content: |-
    - ***ما هو:*** يشير هذا الوصف إلى أن اللعبة تحتوي على عناصر تشجع على المقامرة أو تعلمها.
    - ***النطاق:*** يشير إلى محاكاة ألعاب الحظ التقليدية الموجودة عادةً في الكازينوهات أو صالات القمار (مثل ألعاب الورق التي تُلعب مقابل المال، والمراهنة على السباقات).
    - ***الحد الأدنى للتصنيف:*** يظهر هذا الوصف فقط على الألعاب المصنفة **PEGI 12 أو 16 أو 18**. اعتبارًا من عام 2020، تُصنّف الألعاب الجديدة التي تتضمن محاكاة واقعية للمقامرة دائمًا ضمن فئة PEGI 18.
    - ***ملاحظة حول صناديق الغنائم:*** يُعدّ وجود "عناصر عشوائية مدفوعة" (يُشار إليها غالبًا بصناديق الغنائم) وصفًا منفصلاً للمحتوى ("عمليات شراء داخل اللعبة")، ويمكن العثور عليه في الألعاب ذات التصنيفات العمرية الأقل (مثل PEGI 7).
    - ***المصادر:*** [الموقع الرسمي لـ PEGI](https://pegi.info/what-do-the-labels-mean)، [هيئة تصنيف الألعاب](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_sex":
  content: |-
    - ***ما هو:*** يشير هذا الوصف إلى وجود محتوى جنسي في اللعبة.
    - ***مستويات الخطورة:***
    - **التلميح/الإيحاء (PEGI 12):** إيحاءات أو وضعيات جنسية.
    - **العري الإيروتيكي/الجماع غير الصريح (PEGI 16):** مشاهد للعري الإيروتيكي أو الجماع دون ظهور الأعضاء التناسلية.
    - **النشاط الجنسي الصريح (PEGI 18):** نشاط جنسي مفصل أو صريح، بما في ذلك ظهور الأعضاء التناسلية. يندرج العنف الجنسي والتهديد الجنسي أيضًا ضمن هذه الفئة.
    - ***الدلالة:*** يزداد مستوى الصراحة والتفاصيل في المحتوى الجنسي مع ارتفاع تصنيفات PEGI العمرية.
    - ***المصادر:*** [الموقع الرسمي لـ PEGI](https://pegi.info/what-do-the-labels-mean)، [هيئة تصنيف الألعاب](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_drugs":
  content: |-
    - ***ما هو:*** يشير هذا الوصف إلى أن اللعبة تتضمن أو تصور استخدام المخدرات غير المشروعة أو الكحول أو التبغ.
    - ***مستويات الخطورة:***
    - **التشجيع على الاستخدام/تصويره (PEGI 16):** تشجيع استخدام التبغ أو الكحول (مثل حصول الشخصية على ميزة) أو تصوير استخدام المخدرات غير المشروعة.
    - **الترويج/التجميل (PEGI 18):** تصوير المخدرات غير المشروعة بصورة جذابة أو الترويج البارز للمواد الخاضعة للرقابة.
    - ***الحد الأدنى للتصنيف:*** يوجد هذا الوصف فقط في الألعاب المصنفة **PEGI 16 أو PEGI 18**.
    - ***المصادر:*** [الموقع الرسمي لهيئة PEGI](https://pegi.info/what-do-the-labels-mean), [هيئة تصنيف الألعاب](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_discrimination":
  content: |-
    - ***ما هو:*** يشير هذا الوصف إلى أن اللعبة تحتوي على صور نمطية عرقية أو دينية أو قومية أو غيرها من الصور النمطية التي من شأنها التحريض على الكراهية.
    - ***السياق:*** يُطبق هذا التصنيف عندما تُشجع اللعبة على التمييز ضد مجموعات أو تمجده بناءً على الأصل أو الدين أو الجنسية أو الجنس أو الميول الجنسية أو غيرها من الخصائص.
    - ***الحد الأدنى للتصنيف:*** يظهر هذا الوصف عادةً على الألعاب المصنفة **PEGI 18**، نظرًا لطبيعة هذا المحتوى الخطيرة.
    - ***المصادر:*** [الموقع الرسمي لـ PEGI](https://pegi.info/what-do-the-labels-mean)، [هيئة تصنيف الألعاب](https://gamesratingauthority.org.uk/RatingBoard/ratings)
"en:pegi_in_game_purchases":
  content: |-
    - ***ما هو:*** يشير هذا الوصف إلى أن اللعبة توفر عمليات شراء رقمية اختيارية بأموال حقيقية.
    - ***النطاق:*** يشمل أشكالًا مختلفة من عمليات الشراء داخل اللعبة:
    - **العناصر التجميلية:** أزياء، وحركات تعبيرية، وتحسينات بصرية.
    - **مزايا اللعب:** تعزيزات القوة، والعملات، والمعززات.
    - **التوسعات/المحتوى القابل للتنزيل:** محتوى أو قصة إضافية.
    - **العناصر العشوائية المدفوعة (صناديق الغنائم):** حيث لا يعرف اللاعبون بالضبط ما سيحصلون عليه قبل الشراء (مثل حزم البطاقات، وصناديق العناصر).
    - ***ملاحظة:*** هذا الوصف ليس تصنيفًا عمريًا، بل هو رمز معلوماتي. يمكن أن يظهر على الألعاب المصنفة بأي تصنيف عمري من قِبل PEGI، بما في ذلك PEGI 3.
    - ***مخاوف (خاصةً للأطفال):*** احتمال الإنفاق المفرط، وتشجيع سلوكيات شبيهة بالمقامرة من خلال عناصر عشوائية، والضغط على الشراء للتقدم في اللعبة.
    - ***المصادر:*** [الموقع الرسمي لـ PEGI](https://pegi.info/what-do-the-labels-mean)، [منطقة الوالدين - فهم تصنيفات PEGI](https://parentzone.org.uk/article/pegi-games-ratings)
