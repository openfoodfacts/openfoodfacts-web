"en:nutriscore":
  content: |-
    - ***यह क्या है: न्यूट्री-स्कोर एक फ्रंट-ऑफ-पैक (FOP) पोषण लेबलिंग प्रणाली है जिसे खाद्य उत्पादों की समग्र पोषण गुणवत्ता का आसानी से समझने योग्य आकलन प्रदान करने के लिए डिज़ाइन किया गया है। इसमें पांच रंगों और पांच अक्षरों का पैमाना इस्तेमाल किया गया है, जिसमें A (गहरा हरा) सबसे अधिक पोषण से भरपूर उत्पादों के लिए और E (लाल) सबसे कम पोषण से भरपूर उत्पादों के लिए है। फ्रांसीसी वैज्ञानिक टीम EREN द्वारा विकसित, इसका प्राथमिक उद्देश्य उपभोक्ताओं को एक ही श्रेणी के खाद्य पदार्थों के पोषण मूल्य की तुलना करने में मदद करना और स्वस्थ भोजन विकल्पों को प्रोत्साहित करना है। फ्रांस में उत्पन्न, इसे कई अन्य यूरोपीय देशों द्वारा आधिकारिक तौर पर (अक्सर स्वैच्छिक आधार पर) अपनाया गया है और इसका उपयोग कई खाद्य निर्माताओं द्वारा किया जाता है। यह लेबल वही न्यूट्री-स्कोर है जो हमें पैक पर मिला। अधिक जानकारी के लिए https://world.openfoodfacts.org/nutriscore देखें।
