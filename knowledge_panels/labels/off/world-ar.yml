"en:nutriscore":
  content: |-
    ***ما هو؟ نظام Nutri-Score هو نظام لتصنيف القيمة الغذائية يُوضع على واجهة عبوة المنتج، مصمم لتقديم تقييم سهل الفهم للجودة الغذائية الإجمالية للمنتجات الغذائية بنظرة سريعة. يستخدم النظام مقياسًا من خمسة ألوان وخمسة أحرف، يتراوح من A (أخضر داكن) للمنتجات ذات القيمة الغذائية الأعلى إلى E (أحمر) للمنتجات ذات القيمة الغذائية الأقل. طُوّر هذا النظام من قِبل الفريق العلمي الفرنسي EREN، وهدفه الأساسي مساعدة المستهلكين على مقارنة القيمة الغذائية للأطعمة ضمن الفئة نفسها، وتشجيعهم على اختيار أغذية صحية. نشأ النظام في فرنسا، واعتمدته رسميًا (غالبًا على أساس طوعي) العديد من الدول الأوروبية الأخرى، ويستخدمه العديد من مصنعي الأغذية. هذا الملصق هو Nutri-Score الذي رصدناه على العبوة. للمزيد، تفضل بزيارة https://world.openfoodfacts.org/nutriscore
