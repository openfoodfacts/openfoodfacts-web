"en:nutriscore":
  content: |-
    - ***Vad det är: Nutri-Score är ett näringsmärkningssystem för förpackningens framsida (FOP) som är utformat för att ge en lättbegriplig överblick över livsmedelsprodukters samlade näringskvalitet. Det använder en skala med fem färger och fem bokstäver, från A (mörkgrön) för de näringsmässigt mest fördelaktiga produkterna till E (röd) för de minst fördelaktiga. Systemet utvecklades av den franska forskargruppen EREN och ska främst hjälpa konsumenter att jämföra näringsvärdet hos livsmedel inom samma kategori och göra hälsosammare matval. Det har sitt ursprung i Frankrike men har officiellt införts (ofta frivilligt) i flera andra europeiska länder och används av många livsmedelstillverkare. Detta är Nutri-Score-märkningen som vi upptäckte på förpackningen. Läs mer på https://world.openfoodfacts.org/nutriscore
