"en:washing-machines":
  content: |-
    - ***Apa itu: Mesin cuci adalah peralatan yang dirancang untuk mencuci laundry, seperti pakaian, handuk, dan sprei. Mesin cuci mengotomatiskan proses pembersihan tekstil menggunakan air, deterjen, dan aksi mekanis, sering diikuti dengan siklus putar untuk menghilangkan kelebihan air.

    - ***Jenis: Mesin cuci hadir dalam berbagai konfigurasi:
    - **Top-Loader (Agitator):** Desain tradisional di mana laundry dimuat dari atas dan agitator di tengah berputar untuk membersihkan pakaian. Umumnya lebih murah dan memiliki siklus cuci yang lebih cepat.
    - **Top-Loader (Impeller):** Desain pemuatan atas yang serupa tetapi menggunakan impeller profil rendah di bagian bawah drum daripada agitator sentral, memungkinkan kapasitas lebih besar dan pembersihan yang lebih lembut.
    - **Front-Loader:** Laundry dimuat dari depan, dan drum menggelindingkan pakaian untuk membersihkannya. Biasanya lebih efisien dalam penggunaan energi dan air, menawarkan lebih banyak siklus cuci, dan lebih lembut pada pakaian. Mesin cuci jenis ini sering memiliki kecepatan putar yang lebih tinggi, mengurangi waktu pengeringan.
    - **Compact/Portable:** Versi yang lebih kecil yang cocok untuk apartemen atau ruang kecil, beberapa di antaranya portabel dan dapat dihubungkan ke wastafel.
    - **Washer-Dryer Combo:** Satu peralatan yang melakukan fungsi mencuci dan mengeringkan. Menghemat ruang tetapi dapat memiliki siklus gabungan yang lebih lama.

    Fitur dan teknologi utama bervariasi:
    - **Kapasitas:** Diukur dalam kilogram atau kaki kubik, menunjukkan berapa banyak laundry yang dapat dicuci per siklus.
    - **Efisiensi Energi:** Ditunjukkan oleh peringkat energi (misalnya, A+++ di Eropa), menunjukkan berapa banyak listrik dan air yang dikonsumsi mesin.
    - **Kecepatan Putar:** Diukur dalam putaran per menit (RPM), mempengaruhi berapa banyak air yang dihilangkan dari pakaian selama siklus putar.
    - **Program Cuci:** Siklus khusus untuk berbagai jenis kain (misalnya, kain halus, katun, sintetis) dan tingkat kotoran.
    - **Fitur Cerdas:** Konektivitas ke aplikasi untuk kontrol jarak jauh, penyesuaian siklus, dan pemecahan masalah.

    - ***Keprihatinan:
    - **Konsumsi Energi dan Air:** Model lama atau model baru yang kurang efisien dapat mengonsumsi jumlah air dan listrik yang signifikan, mempengaruhi tagihan utilitas dan lingkungan. Memilih model yang efisien dalam penggunaan energi adalah keprihatinan umum.
    - **Tingkat Kebisingan:** Beberapa mesin cuci, terutama selama siklus putar, dapat sangat berisik, yang dapat menjadi masalah bagi penghuni apartemen atau mereka yang memiliki ruang hidup terbuka.
    - **Getaran:** Kecepatan putar yang tinggi dapat menyebabkan getaran yang signifikan, terutama dengan beban yang tidak seimbang, berpotensi mempengaruhi umur panjang mesin dan menyebabkan gangguan.
    - **Pemeliharaan dan Umur Panjang:** Seperti semua peralatan, mesin cuci memerlukan pemeliharaan (misalnya, membersihkan dispenser deterjen, siklus pembersihan drum) untuk mencegah jamur, bau, dan memastikan umur yang lebih panjang. Perbaikan dapat mahal.
    - **Biaya:** Harga pembelian awal dapat bervariasi secara luas, dari opsi yang ramah anggaran hingga model high-end dengan fitur canggih.
    - **Persyaratan Ruang:** Mesin cuci membutuhkan ruang yang memadai, termasuk koneksi untuk pasokan air dan drainase, dan ventilasi yang tepat. Ini sangat relevan untuk kehidupan perkotaan di mana ruang dapat terbatas.
    - **Penggunaan Deterjen dan Aditif:** Jenis dan jumlah deterjen yang digunakan dapat mempengaruhi kinerja pembersihan dan kesehatan mesin (misalnya, busa berlebihan). Keprihatinan tentang dampak lingkungan dari deterjen juga ada.
    - **Pelepasan Mikroplastik:** Mencuci pakaian sintetis dapat melepaskan serat mikroplastik ke dalam air limbah, berkontribusi pada polusi lingkungan, sebuah keprihatinan yang semakin meningkat dalam industri tekstil.
