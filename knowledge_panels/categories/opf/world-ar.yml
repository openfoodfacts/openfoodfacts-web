"en:washing-machines":
  content: |-
    - ***ما هي الغسالة؟*** الغسالة جهاز مصمم لغسل الملابس والمناشف وأغطية الأسرة. تعمل على أتمتة عملية تنظيف المنسوجات باستخدام الماء والمنظف والحركة الميكانيكية، وغالبًا ما تتبعها دورة عصر لإزالة الماء الزائد.

    ***أنواع الغسالات:*** تتوفر الغسالات بأنواع مختلفة:
    **التحميل العلوي (بمحرك تقليب):** تصميم تقليدي حيث يتم وضع الملابس من الأعلى، ويقوم محرك التقليب المركزي بتدويرها لتنظيفها. عادةً ما تكون أقل تكلفة وتتميز بدورات غسيل أسرع.
    **التحميل العلوي (بمحرك دافع):** تصميم مشابه للتحميل العلوي، ولكنه يستخدم محركًا دافعًا منخفض الارتفاع في أسفل الحوض بدلًا من محرك التقليب المركزي، مما يسمح بسعة أكبر وتنظيف ألطف.
    **التحميل الأمامي:** يتم وضع الملابس من الأمام، ويقوم الحوض بتدويرها لتنظيفها. عادةً ما تكون أكثر كفاءة في استهلاك الطاقة والماء، وتوفر دورات غسيل أكثر، وهي ألطف على الملابس. غالبًا ما تتميز بسرعات دوران أعلى، مما يؤدي إلى تقليل وقت التجفيف.
    - **صغير الحجم/محمول:** إصدارات أصغر حجمًا مناسبة للشقق أو المساحات الصغيرة، بعضها محمول ويمكن توصيله بحوض الغسيل.
    - **غسالة ومجفف ملابس مدمجان:** جهاز واحد يقوم بوظيفتي الغسيل والتجفيف. موفر للمساحة، ولكن قد تستغرق دورات الغسيل المدمجة وقتًا أطول.
    تختلف الميزات والتقنيات الرئيسية:
    - **السعة:** تُقاس بالكيلوغرام أو القدم المكعب، وتشير إلى كمية الغسيل التي يمكن غسلها في كل دورة.
    - **كفاءة الطاقة:** تُقاس بتصنيفات الطاقة (مثل A+++ في أوروبا)، وتُظهر كمية الكهرباء والماء التي يستهلكها الجهاز.
    - **سرعة الدوران:** تُقاس بالدورات في الدقيقة (RPM)، وتؤثر على كمية الماء المُستخرجة من الملابس أثناء دورة الدوران.
    - **برامج الغسيل:** برامج مُخصصة لأنواع الأقمشة المختلفة (مثل الأقمشة الرقيقة، والقطن، والألياف الصناعية) ومستويات الاتساخ.
    - **الميزات الذكية:** إمكانية الاتصال بتطبيقات للتحكم عن بُعد، وتخصيص دورات الغسيل، واستكشاف الأعطال وإصلاحها.
    **ملاحظات هامة:**
    **استهلاك الطاقة والمياه:** قد تستهلك الموديلات القديمة أو الموديلات الجديدة الأقل كفاءة كميات كبيرة من المياه والكهرباء، مما يؤثر على فواتير الخدمات العامة والبيئة. لذا، يُعد اختيار موديل موفر للطاقة من الأمور المهمة.
    **مستوى الضوضاء:** قد تُصدر بعض الغسالات، خاصةً أثناء دورة العصر، ضوضاءً عالية، مما قد يُسبب إزعاجًا لسكان الشقق أو أصحاب المساحات المفتوحة.
    **الاهتزاز:** قد تُسبب سرعات العصر العالية اهتزازًا ملحوظًا، خاصةً مع الأحمال غير المتوازنة، مما قد يؤثر على عمر الغسالة ويُسبب إزعاجًا.
    **الصيانة والعمر الافتراضي:** كجميع الأجهزة المنزلية، تحتاج الغسالات إلى صيانة دورية (مثل تنظيف موزعات المنظفات، وتنظيف حوض الغسيل) لمنع العفن والروائح الكريهة، وضمان عمر أطول. وقد تكون تكاليف الإصلاح باهظة.
    الصيانة والعمر الافتراضي:
    مثل جميع الأجهزة المنزلية، تحتاج الغسالات إلى صيانة دورية (مثل تنظيف موزعات المنظفات، وتنظيف حوض الغسيل) لمنع تكون العفن والروائح الكريهة، وضمان عمر أطول. - **التكلفة:** قد يختلف سعر الشراء الأولي اختلافًا كبيرًا، بدءًا من الخيارات الاقتصادية وصولًا إلى الطرازات الفاخرة ذات الميزات المتقدمة.
    - **متطلبات المساحة:** تحتاج الغسالات إلى مساحة كافية، بما في ذلك توصيلات إمدادات المياه والصرف الصحي، وتهوية مناسبة. وهذا الأمر بالغ الأهمية في المناطق الحضرية حيث قد تكون المساحة محدودة.
    - **استخدام المنظفات والإضافات:** يؤثر نوع وكمية المنظف المستخدم على كفاءة التنظيف وصحة الغسالة (مثلًا، الرغوة الزائدة). كما توجد مخاوف بشأن الأثر البيئي للمنظفات.
    - **انبعاث الجزيئات البلاستيكية الدقيقة:** قد يؤدي غسل الملابس المصنوعة من الألياف الصناعية إلى إطلاق ألياف بلاستيكية دقيقة في مياه الصرف الصحي، مما يساهم في التلوث البيئي، وهو مصدر قلق متزايد في صناعة النسيج.
