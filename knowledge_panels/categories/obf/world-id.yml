"en:sunscreen":
  content: |-
    - ***Apa itu: Krim matahari, yang juga dikenal sebagai tabir surya, adalah produk topikal yang dirancang untuk melindungi kulit dari efek berbahaya radiasi ultraviolet (UV) matahari.  Produk ini mengandung bahan-bahan khusus yang menyerap atau memantulkan sinar UV, mencegah sinar tersebut menembus kulit dan menyebabkan kerusakan.
    - ***Jenis: Krim tabir surya tersedia dalam berbagai bentuk, termasuk losion, semprotan, stik, dan gel.  Mereka juga diklasifikasikan berdasarkan Faktor Perlindungan Matahari (SPF), yang menunjukkan berapa lama sinar UVB akan membuat kulit memerah saat menggunakan produk dibandingkan dengan tanpa perlindungan.  Tabir surya spektrum luas melindungi dari sinar UVA dan UVB.  Tabir surya fisik (tabir surya mineral) mengandung bahan mineral seperti oksida seng dan dioksida titanium yang berada di permukaan kulit dan memantulkan sinar UV. Tabir surya kimia mengandung bahan kimia yang menyerap sinar UV dan mengubahnya menjadi panas, yang kemudian dilepaskan dari kulit.
    - ***Kekhawatiran:
    - **Filter Kimia:** Beberapa filter tabir surya kimia telah menimbulkan kekhawatiran terkait potensi gangguan hormon dan iritasi kulit. Penelitian masih berlangsung untuk memahami sepenuhnya efek jangka panjang dari bahan kimia ini. Beberapa bahan kimia tertentu juga telah dilarang di beberapa lokasi karena dampaknya terhadap terumbu karang.
    - **Nanopartikel:** Ada kekhawatiran terkait penggunaan nanopartikel dalam tabir surya mineral. Meskipun umumnya dianggap aman, beberapa studi menyarankan potensi risiko terkait penetrasi nanopartikel ke dalam kulit. Regulasi mengenai penggunaan nanopartikel dalam tabir surya bervariasi.
    - **Dampak Lingkungan:** Bahan-bahan dalam beberapa tabir surya, terutama filter kimia, dapat merusak ekosistem air, terutama terumbu karang. Hal ini telah mendorong pengembangan tabir surya “reef-safe” atau “reef-friendly” yang menghindari bahan kimia berbahaya tersebut.
    - **Efektivitas:**  Efektivitas tabir surya bergantung pada penggunaan yang tepat.  Penggunaan tabir surya yang terlalu sedikit atau tidak mengaplikasikannya kembali secara teratur, terutama setelah berenang atau berkeringat, dapat secara signifikan mengurangi efek pelindungnya.
    - **Reaksi Alergi:**  Beberapa orang mungkin mengalami reaksi alergi atau iritasi kulit akibat bahan-bahan tertentu dalam tabir surya.  Uji tempel sebelum penggunaan luas disarankan, terutama untuk kulit sensitif.
    - **Rasa Aman Palsu:**  Tabir surya tidak boleh diandalkan sebagai satu-satunya metode perlindungan dari sinar matahari.  Penting untuk juga mencari naungan, mengenakan pakaian pelindung, dan membatasi paparan sinar matahari pada jam-jam puncak.
    - ***Pelajari lebih lanjut: https://en.wikipedia.org/wiki/Sunscreen
