"en:sunscreen":
  content: |-
    -***Что это такое: Солнцезащитные кремы, также известные как санскрины, – это средства для нанесения на кожу, которые защищают ее от вредного воздействия ультрафиолетового (УФ) излучения. Они содержат специальные компоненты, которые поглощают или отражают ультрафиолетовые лучи, не позволяя им проникать в кожу и вызывать повреждения.
    -***Типы: солнцезащитные средства выпускаются в разных формах, включая кремы, спреи, стики и гели. Также они различаются по фактору защиты от солнца (SPF), который показывает, насколько дольше кожа может находиться под воздействием UVB-лучей без покраснения при использовании средства по сравнению с отсутствием защиты. Средства с широким спектром защиты защищают от UVA- и UVB-лучей. Физические (минеральные) солнцезащитные средства содержат такие минералы, как оксид цинка и диоксид титана, которые остаются на поверхности кожи и отражают солнечные лучи. Химические солнцезащитные средства содержат вещества, поглощающие ультрафиолетовые лучи и преобразующие их в тепло, которое затем выделяется с поверхности кожи.
    -***Проблемы и опасения:
    -**Химические фильтры**: Некоторые химические фильтры вызывают опасения из-за возможного влияния на гормональную систему и способности вызывать раздражение кожи. Их долгосрочное воздействие всё ещё изучается. Некоторые вещества также запрещены в отдельных регионах из-за их негативного влияния на коралловые рифы.
    -**Наночастицы:** Использование наночастиц в минеральных солнцезащитных средствах также вызывает вопросы. Хотя в целом они считаются безопасными, некоторые исследования указывают на возможные риски, связанные с их проникновением в кожу. Правила их использования в разных странах отличаются.
    -**Влияние на окружающую среду:** Некоторые компоненты солнцезащитных средств, особенно химические фильтры, могут наносить вред водным экосистемам и коралловым рифам. Поэтому появились средства с пометкой «reef-safe» или «reef-friendly», в составе которых нет некоторых веществ, вредных для морской среды.
    Эффективность: Эффективность солнцезащитного средства зависит от правильного использования. Если наносить слишком мало крема или недостаточно часто обновлять его, особенно после купания или потоотделения, уровень защиты может значительно снизиться.
    -**Аллергические реакции:** У некоторых людей определённые компоненты солнцезащитных средств могут вызывать аллергические реакции или раздражение кожи. Особенно людям с чувствительной кожей рекомендуется сначала проверить средство на небольшом участке кожи.
    -**Ложное чувство безопасности:** Не стоит полагаться только на солнцезащитный крем. Также важно находиться в тени, носить защитную одежду и стараться избегать длительного пребывания на солнце в часы его наибольшей активности.
    Дополнительная информация:

    https://en.wikipedia.org/wiki/Sunscreen
