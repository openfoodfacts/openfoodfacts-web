"en:sunscreen":
  content: |-
    - ***ما هو؟*** كريمات الوقاية من الشمس، والمعروفة أيضًا باسم واقيات الشمس، هي منتجات موضعية مصممة لحماية البشرة من الآثار الضارة للأشعة فوق البنفسجية (UV) الصادرة من الشمس. تحتوي هذه الكريمات على مكونات محددة تمتص أو تعكس الأشعة فوق البنفسجية، مما يمنعها من اختراق الجلد والتسبب في تلفه.
    - ***أنواعها***** تتوفر كريمات الوقاية من الشمس بأشكال مختلفة، بما في ذلك المستحضرات، والبخاخات، والعصي، والجل. كما تُصنف حسب عامل الحماية من الشمس (SPF)، الذي يُشير إلى المدة التي تستغرقها أشعة UVB لإحداث احمرار في الجلد عند استخدام المنتج مقارنةً بالمدة التي تستغرقها بدون أي حماية. توفر واقيات الشمس واسعة الطيف حماية من أشعة UVA وUVB. تحتوي واقيات الشمس الفيزيائية (المعدنية) على مكونات معدنية مثل أكسيد الزنك وثاني أكسيد التيتانيوم التي تبقى على سطح الجلد وتعكس الأشعة فوق البنفسجية. أما واقيات الشمس الكيميائية فتحتوي على مواد كيميائية تمتص الأشعة فوق البنفسجية وتحولها إلى حرارة، والتي تُطلقها البشرة بعد ذلك.
    أنواعها***** - ***المخاوف:
    - **المرشحات الكيميائية:** أثارت بعض مرشحات واقي الشمس الكيميائية مخاوف بشأن احتمالية حدوث اضطرابات هرمونية وتهيج الجلد. ولا تزال الأبحاث جارية لفهم الآثار طويلة المدى لهذه المواد الكيميائية بشكل كامل. كما تم حظر بعض المواد الكيميائية المحددة في بعض المناطق بسبب تأثيرها البيئي على الشعاب المرجانية.
    - **الجسيمات النانوية:** هناك مخاوف بشأن استخدام الجسيمات النانوية في واقيات الشمس المعدنية. ورغم أنها تُعتبر آمنة بشكل عام، إلا أن بعض الدراسات تشير إلى مخاطر محتملة مرتبطة باختراقها للجلد. وتختلف اللوائح المتعلقة باستخدام الجسيمات النانوية في واقيات الشمس.
    - **الأثر البيئي:** يمكن أن تُلحق مكونات بعض واقيات الشمس، وخاصة المرشحات الكيميائية، الضرر بالنظم البيئية المائية، ولا سيما الشعاب المرجانية. وقد أدى ذلك إلى تطوير واقيات شمس "آمنة للشعاب المرجانية" أو "صديقة للشعاب المرجانية" خالية من هذه المواد الكيميائية الضارة.
    - **الفعالية:** تعتمد فعالية واقي الشمس على الاستخدام الصحيح. فاستخدام كمية قليلة جدًا من واقي الشمس أو عدم إعادة وضعه بشكل متكرر، خاصة بعد السباحة أو التعرق، يمكن أن يقلل بشكل كبير من فعاليته الوقائية.
    - **ردود الفعل التحسسية:** قد يُعاني بعض الأشخاص من ردود فعل تحسسية أو تهيج في الجلد نتيجة استخدام بعض مكونات واقي الشمس. يُنصح بإجراء اختبار حساسية على منطقة صغيرة من الجلد قبل الاستخدام الواسع، خاصةً لأصحاب البشرة الحساسة.
    - **شعور زائف بالأمان:** لا ينبغي الاعتماد على واقي الشمس كوسيلة وحيدة للحماية من الشمس. من المهم أيضًا البحث عن الظل، وارتداء ملابس واقية، والحد من التعرض لأشعة الشمس خلال ساعات الذروة.
    - ***للمزيد من المعلومات: https://en.wikipedia.org/wiki/Sunscreen
