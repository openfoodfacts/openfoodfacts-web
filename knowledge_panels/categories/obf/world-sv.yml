"en:sunscreen":
  content: |-
    - ***Vad det är: Solskyddsmedel, även kallade solkrämer, är produkter som appliceras på huden för att skydda den mot de skadliga effekterna av solens ultravioletta strålning (UV-strålning). De innehåller särskilda ingredienser som absorberar eller reflekterar UV-strålar och hindrar dem från att tränga in i och skada huden.
    - ***Typer: Solskyddsmedel finns bland annat som krämer, sprejer, stift och geler. De klassificeras också efter solskyddsfaktor (SPF), som anger hur mycket längre tid det tar för UVB-strålning att göra huden röd med produkten än utan skydd. Bredspektrumskydd skyddar mot både UVA- och UVB-strålning. Fysiska solskyddsmedel (mineralsolskydd) innehåller mineraler som zinkoxid och titandioxid, som ligger ovanpå huden och reflekterar UV-strålar. Kemiska solskyddsmedel innehåller ämnen som absorberar UV-strålar och omvandlar dem till värme som sedan avges från huden.
    - ***Risker och nackdelar:
    - **Kemiska filter:** Vissa kemiska UV-filter har väckt oro för möjliga hormonstörande effekter och hudirritation. Forskning pågår för att klarlägga ämnenas långsiktiga effekter. Vissa ämnen har också förbjudits på vissa platser på grund av sin miljöpåverkan på korallrev.
    - **Nanopartiklar:** Det finns farhågor kring nanopartiklar i mineralsolskydd. De betraktas i allmänhet som säkra, men vissa studier pekar på möjliga risker om de tränger in i huden. Reglerna för nanopartiklar i solskyddsmedel varierar.
    - **Miljöpåverkan:** Ingredienser i vissa solskyddsmedel, särskilt kemiska filter, kan skada vattenlevande ekosystem och framför allt korallrev. Det har lett till utveckling av ”revsäkra” eller ”revvänliga” solskyddsmedel utan dessa skadliga ämnen.
    - **Effektivitet:** Effekten beror på att solskyddsmedlet appliceras korrekt. För liten mängd eller alltför sällan upprepad applicering, särskilt efter bad eller svettning, kan avsevärt försämra skyddet.
    - **Allergiska reaktioner:** Vissa personer kan få allergiska reaktioner eller hudirritation av enskilda ingredienser. Ett test på ett litet hudområde rekommenderas före mer omfattande användning, särskilt vid känslig hud.
    - **Falsk trygghet:** Solskyddsmedel bör inte vara det enda skyddet mot solen. Sök också skugga, använd skyddande kläder och begränsa solexponeringen under de timmar då solen är som starkast.
    - ***Läs mer: https://en.wikipedia.org/wiki/Sunscreen
