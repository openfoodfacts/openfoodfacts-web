"en:easter-eggs":
  content: |-
    - ***Vad det är: Påskchoklad är en konfektyrkategori som tillverkas och marknadsförs särskilt inför påsken. Chokladen formas vanligtvis till symboler som förknippas med påsken, till exempel ägg, harar, klockor, kycklingar och lamm. Den görs främst av mjölkchoklad, mörk choklad eller vit choklad och är i många kulturer en traditionell del av påskfirandet och av att ge gåvor. Den förknippas ofta med vår, återfödelse och festligheter.
