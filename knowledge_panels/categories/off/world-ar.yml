"en:easter-eggs":
  content: |-
    ***ما هي؟*** شوكولاتة عيد الفصح هي نوع من الحلويات يُصنع ويُسوّق خصيصًا لموسم عيد الفصح. تتميز عادةً بتشكيل الشوكولاتة على هيئة رموز مرتبطة بعيد الفصح، مثل البيض والأرانب والأجراس والكتاكيت والحملان. تُصنع في الغالب من الشوكولاتة بالحليب أو الداكنة أو البيضاء، وهي جزء تقليدي من احتفالات عيد الفصح وتبادل الهدايا في العديد من الثقافات، وغالبًا ما ترتبط بمواضيع الربيع والولادة الجديدة والاحتفالات.
