name: "Useful Queries: Create PR from Issue"

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: graph-query-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  process-query-issue:
    # Run only if the issue has the 'queries' label
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'queries') ||
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'queries'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Process query issue and add YAML
        id: add_query
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 scripts/add_query.py --from-env --compile --json --output-json result.json
          cat result.json
          SUCCESS=$(python3 -c "import json; print(json.load(open('result.json')).get('success', False))")
          if [ "$SUCCESS" != "True" ]; then
            echo "Failed to parse or add graph query"
            exit 1
          fi
          echo "query_title=$(python3 -c "import json; print(json.load(open('result.json')).get('title', ''))")" >> $GITHUB_OUTPUT
          echo "query_topic=$(python3 -c "import json; print(json.load(open('result.json')).get('topic', ''))")" >> $GITHUB_OUTPUT
          echo "query_type=$(python3 -c "import json; print(json.load(open('result.json')).get('query_type', ''))")" >> $GITHUB_OUTPUT
          echo "target_file=$(python3 -c "import json; print(json.load(open('result.json')).get('file', ''))")" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(queries): add query from issue #${{ github.event.issue.number }}"
          branch: "queries/issue-${{ github.event.issue.number }}"
          delete-branch: true
          title: "[Query] Add: ${{ steps.add_query.outputs.query_title }}"
          body: |
            ### 📊 Useful Query / Graph Proposal

            This Pull Request was automatically generated from issue #${{ github.event.issue.number }}.

            - **Title**: ${{ steps.add_query.outputs.query_title }}
            - **Topic**: `${{ steps.add_query.outputs.query_topic }}`
            - **Format**: `${{ steps.add_query.outputs.query_type }}`
            - **Target file**: `${{ steps.add_query.outputs.target_file }}`

            Closes #${{ github.event.issue.number }}
          labels: |
            queries
            documentation
            automated-pr

      - name: Comment on Issue
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Thank you @${context.payload.issue.user.login} for proposing this useful query/graph! 🎉\n\nA Pull Request has been automatically opened to validate and merge this query into the Open Food Facts Useful Queries & Graphs directory. You can follow along with the automated checks and review in the PR!`
            });
