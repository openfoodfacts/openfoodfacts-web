name: "FAQ: CI Validation"

on:
  push:
    paths:
      - 'data/faq/**'
      - 'scripts/compile_faq.py'
      - 'scripts/add_faq_question.py'
  pull_request:
    paths:
      - 'data/faq/**'
      - 'scripts/compile_faq.py'
      - 'scripts/add_faq_question.py'

permissions:
  contents: read

concurrency:
  group: faq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-faq:
    name: Validate FAQ Markdown & Schemas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Validate FAQ files
        run: |
          python3 scripts/compile_faq.py --check
