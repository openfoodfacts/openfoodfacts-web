 name: Run release-please
 on:
   push:
     branches:
       - main
 jobs:
   release-please:
     runs-on: ubuntu-slim
     steps:
       - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
         with:
           token: ${{ secrets.GITHUB_TOKEN }}
           release-type: simple
