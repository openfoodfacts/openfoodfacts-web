name: Check Includes in HTML Templates
permissions:
  contents: read

on:
  push:
    paths:
      - 'impossiblecondition**.html'
  pull_request:
    paths:
      - 'impossiblecondition**.html'

jobs:
  check-includes:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: pip install beautifulsoup4

    - name: Check for Translated Includes
      run: python .github/scripts/check_includes.py
