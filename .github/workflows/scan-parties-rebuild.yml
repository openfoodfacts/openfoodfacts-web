name: "Scan Parties: Rebuild Catalog & Pages"

on:
  push:
    branches:
      - main
    paths:
      - 'data/scan_parties/**'
      - 'scripts/compile_scan_parties.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-parties-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-scan-parties:
    name: Rebuild Scan Parties JSON and HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Recompile scan parties dataset and HTML pages
        run: |
          python3 scripts/compile_scan_parties.py

      - name: Commit and push changes if any
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(scan-parties): recompile scan_parties.json and static HTML"
          file_pattern: "data/scan_parties.json lang/en/texts/scan-parties.html lang/fr/texts/scan-parties.html"
