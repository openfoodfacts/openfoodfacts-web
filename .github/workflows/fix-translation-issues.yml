name: Fix Translation Issues

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'lang/**'
  workflow_dispatch:
    inputs:
      fix_utm:
        description: 'Fix UTM campaign parameters'
        required: false
        type: boolean
        default: true
      fix_urls:
        description: 'Fix Apple App Store and Google Play URLs with language codes'
        required: false
        type: boolean
        default: true
      fix_badges:
        description: 'Fix Play Store and App Store button image badges'
        required: false
        type: boolean
        default: true
      fix_brands:
        description: 'Protect brand names according to No-Translate list'
        required: false
        type: boolean
        default: true
      fix_typography:
        description: 'Fix French typography (non-breaking spaces)'
        required: false
        type: boolean
        default: true
      fix_repetitions:
        description: 'Fix text repetitions'
        required: false
        type: boolean
        default: true
      create_pr:
        description: 'Create a PR with fixes (instead of committing directly)'
        required: false
        type: boolean
        default: true

jobs:
  fix-translations:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (startsWith(github.head_ref, 'l10n_') || contains(github.event.pull_request.title, 'Crowdin') || contains(github.event.pull_request.title, 'translations')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
      
      - name: Run translation fix script
        id: fix
        run: |
          # Build command arguments
          ARGS="--base-dir lang -v"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.fix_utm }}" != "true" ]; then
              ARGS="$ARGS --no-utm"
            fi
            if [ "${{ inputs.fix_urls }}" != "true" ]; then
              ARGS="$ARGS --no-urls"
            fi
            if [ "${{ inputs.fix_badges }}" != "true" ]; then
              ARGS="$ARGS --no-badges"
            fi
            if [ "${{ inputs.fix_brands }}" != "true" ]; then
              ARGS="$ARGS --no-brands"
            fi
            if [ "${{ inputs.fix_typography }}" != "true" ]; then
              ARGS="$ARGS --no-typography"
            fi
            if [ "${{ inputs.fix_repetitions }}" != "true" ]; then
              ARGS="$ARGS --no-repetitions"
            fi
          fi
          
          echo "Running: python scripts/fix_translation_issues.py $ARGS"
          python scripts/fix_translation_issues.py $ARGS | tee output.txt
          
          # Check if any changes were made
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected!"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes needed."
          fi
      
      - name: Create Pull Request
        if: steps.fix.outputs.changes == 'true' && github.event_name == 'workflow_dispatch' && inputs.create_pr == true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix: Auto-fix translation issues (UTM params, App Store URLs, brand names)'
          title: '🔧 Auto-fix translation issues'
          body: |
            ## Automated Translation Fixes
            
            This PR was automatically generated by the translation fix workflow.
            
            ### Changes
            - Fixed UTM campaign parameters to use correct language codes
            - Fixed Apple App Store and Google Play URLs to use proper language codes
            - Reverted accidental brand name translations per No-Translate list
            - Repaired broken `[[...]]` template includes and Material Icons ligatures
            - Removed sister-project contaminations and leaked MT/API error strings
            - Fixed text repetition issues from Crowdin translations
            
            ### How to review
            1. Review the changed files to ensure fixes are appropriate
            2. Test any affected pages if needed
            3. Merge when ready
            
            ---
            *Generated by GitHub Actions*
          branch: fix/translation-issues-${{ github.run_number }}
          delete-branch: true
          labels: |
            automated
            translations
      
      - name: Commit directly
        if: steps.fix.outputs.changes == 'true' && (github.event_name == 'pull_request' || inputs.create_pr == false)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "fix: Auto-fix translation issues (UTM params, App Store URLs, brand names)"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      
      - name: Summary
        run: |
          echo "## Translation Fix Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.fix.outputs.changes }}" == "true" ]; then
            echo "✅ Fixes were applied!" >> $GITHUB_STEP_SUMMARY
            if [ "${{ inputs.create_pr }}" == "true" ]; then
              echo "A Pull Request has been created with the changes." >> $GITHUB_STEP_SUMMARY
            else
              echo "Changes were committed directly to the branch." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "✨ No issues found - all translations are clean!" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Script Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No output captured"
          echo '```' >> $GITHUB_STEP_SUMMARY
