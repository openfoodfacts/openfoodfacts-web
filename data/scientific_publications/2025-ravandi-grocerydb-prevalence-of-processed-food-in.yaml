excerpt: 'Comparison with USDA FoodData Central and Open Food Facts Databases

  GroceryDB is matched with the USDA FoodData Central Global Branded Food Products
  Database (BFPD) according to the product name and the ingredient lists. We find
  that BFPD only covered 44% of the products in GroceryDB with a Similarity Score
  ≥ 0.95 (Figure S4A). We performed that same analysis with OpenFoodFacts (OFF), finding
  OFF only covers 38% of GroceryDB (Figure S4B).'
