excerpt: 'Utilizes machine learning models (LightGBM, Random Forest, CatBoost) to classify food processing levels (NOVA, including ultra-processed foods) based on nutrient concentration data from over 900,000 Open Food Facts products. Performs exploratory data analysis linking NOVA classes with Nutri-Score, Eco-Score, and allergens.'
