excerpt: 'The study trained machine learning models (including LightGBM, Random Forest, and CatBoost) on over 900,000 food products from Open Food Facts to predict NOVA food processing levels based on nutrient profiles. The authors analyzed correlations between ultra-processed status (NOVA 4), poorer Nutri-Score grades, higher additive counts, and lower Eco-Scores, and deployed a public web-based predictive tool.'
