excerpt: 'Food Products Selection

  Food product selection was conducted via assessment of the most frequently consumed
  food groups in The Netherlands [30], Italy [31], and Brazil [32], according to national
  consumption data. For each food product, the NOVA category and the Nutri-Score were
  determined via Open Food Facts (https://world.openfoodfacts.org/ assessed on 20
  October 2022)'
