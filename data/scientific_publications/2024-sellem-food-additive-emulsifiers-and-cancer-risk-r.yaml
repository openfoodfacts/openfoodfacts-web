excerpt: 'Briefly, each food item consumed and reported in a specific dietary record
  was matched against 3 databases to assess the presence of any food additive: Observatoire
  de la qualité de l’alimentation (OQALI) [40], a national database whose management
  has been entrusted to the National Institute of Agricultural and Environment Research
  (INRAE) and the French food safety authority (Agence Nationale Sécurité Sanitaire
  de l’Alimentation, de l’environnement et du travail—ANSES) to characterise the quality
  of the food supply, Open Food Facts, an open collaborative database of food products
  marketed worldwide [16], and Mintel Global New Products Database (GNPD) [41], an
  online database of innovative food products in the world.'
