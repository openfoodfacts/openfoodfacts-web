excerpt: The NutriNet-Santé study is the first to precisely evaluate both qualitative
  and quantitative exposures to food additives, using detailed and repeated 24 h dietary
  records, links to multiple food composition databases (the French Observatory of
  Food Quality [OQALI], Open Food Facts, the Global New Products Database [GNPD],
  EFSA, and General Standard For Food Additives [GSFA]), ad-hoc laboratory assays,
  and dynamic matching to account for reformulations of industrial food items over
  time.27
