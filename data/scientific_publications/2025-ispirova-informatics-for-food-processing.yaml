excerpt: 'Presents a novel case study utilizing the Open Food Facts database to demonstrate how multimodal AI models can classify foods at scale for assessing food processing in public health research. Demonstrates that distinct regions emerge between unprocessed foods (NOVA 1) and ultra-processed foods (NOVA 4) when plotting the global embedding landscape of the Open Food Facts database.'
