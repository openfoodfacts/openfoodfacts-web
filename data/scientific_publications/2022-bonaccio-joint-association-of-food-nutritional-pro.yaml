excerpt: 'Food items were matched with nutritional composition and NOVA processing categories using the Open Food Facts database. The authors demonstrated that ultra-processed foods are found across all Nutri-Score categories (including Nutri-Score A and B), showing that nutritional composition and food processing represent distinct, complementary dimensions of mortality risk.'
