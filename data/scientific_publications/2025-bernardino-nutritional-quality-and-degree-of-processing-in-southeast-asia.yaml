excerpt: 'Analyzes 4,668 commonly consumed food products in Southeast Asia using data from the Open Food Facts database to assess nutritional quality via Nutri-Score and processing level via NOVA classification, which includes Ultra-Processed Foods (UPFs). Finds that most food products with lower Nutri-Score ratings (D and E) were classified as ultra-processed (NOVA 4), with sweet products, beverages, and snacks being major contributors.'
