excerpt: 'Open Food Facts provides a database of food products such as product names,
  compositions, and additives, where everyone can contribute to add the data or reuse
  the existing data. The open food facts data are dirty and needs to be processed
  before storing the data to our system. To reduce redundancy in food ingredients
  data, we measure the similarity of ingredient food using two similarities: the conceptual
  similarity and textual similarity.'
