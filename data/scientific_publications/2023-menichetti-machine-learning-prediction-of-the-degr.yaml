excerpt: 'Utilizes Open Food Facts to compile an extensive list of food additives, including artificial colors, artificial flavors, and emulsifiers, to test the predictive power of the FoodPro machine learning algorithm regarding the degree of processing. Collected 233,831 nutritional records from Open Food Facts annotated with NOVA labels to improve the prediction of ultra-processed foods (UPF).'
