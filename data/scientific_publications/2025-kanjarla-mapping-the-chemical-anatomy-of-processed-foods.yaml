excerpt: 'Provides a large-scale characterization of food additive prevalence and co-occurrence in over 18,850 ultra-processed foods (UPFs) available in the United States by leveraging data from the Open Food Facts crowdsourced database to standardize additives, classify UPFs, and generate co-occurrence networks revealing regulatory gaps in GRAS additives.'
