excerpt: 'The Open Food Facts dataset provided a rich source of food composition data across multiple countries globally to examine hyper-palatable foods (HPF) and their nutrient characteristics. The study analyzed crowdsourced nutritional data, highlighting the value of global open food databases for investigating ultra-processed and hyper-palatable food environments.'
