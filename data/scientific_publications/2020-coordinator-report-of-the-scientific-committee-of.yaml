excerpt: 'Using the Open Food Facts database on the composition of foods, which includes
  food regularly consumed by the French general public, the classification of food
  and drinks was consistent with nutritional recommendations: 95.4 % of fruit and
  vegetables were classified into the first quintile of distribution (letter A), while
  86 % of “sugary snacks” were classified in the fourth and fifth quintiles (letters
  D and E). [...] These findings are complementary to studies conducted in other food
  databases such as Open Food Facts providing data on multiple industrial foods of
  different brands.'
