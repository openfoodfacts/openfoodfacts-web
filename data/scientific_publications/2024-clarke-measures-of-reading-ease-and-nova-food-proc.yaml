excerpt: 'Utilizes the Open Food Facts Database to identify food products sold in the United States that were scored using the NOVA system, which categorizes foods including ultra-processed foods (UPF) as NOVA 4. Explores the relationship between NOVA classification groups and metrics of reading ease using ingredient lists, noting that NOVA 4 foods (UPF) have longer ingredients lists with more complex words.'
