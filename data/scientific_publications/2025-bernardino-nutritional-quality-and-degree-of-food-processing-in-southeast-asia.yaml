excerpt: 'Analyzes 4,668 pre-packaged food products in Southeast Asia using data from the Open Food Facts database to assess nutritional quality via Nutri-Score and processing level using NOVA classification. The study applies the NOVA classification to products obtained from the Open Food Facts database, finding that 71% of the analyzed food products in Southeast Asia were categorized as ultra-processed (NOVA 4).'
