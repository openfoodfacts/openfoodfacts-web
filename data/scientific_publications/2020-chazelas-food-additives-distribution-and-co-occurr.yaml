excerpt: 'The 690,499 foods referenced in the French Open Food Facts database make it possible to determine an initial approximation of the frequency of main ingredients/additives in ultra-processed foods (UPFs). This database is the most comprehensive one about packaged foods, providing the list of ingredients for most registered foods, and was used for retrieving lists of additives from approximately 126,000 foods.'
