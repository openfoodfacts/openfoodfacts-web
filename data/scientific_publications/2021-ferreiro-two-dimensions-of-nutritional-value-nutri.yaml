excerpt: 'Compares the nutritional quality, assessed by Nutri-Score, and the ultra-processing level, assessed by the NOVA classification, of foods listed in the Open Food Facts database. Reports that ultra-processed foods (NOVA 4) constitute the group with the highest frequency, at 56.45%, within the analyzed segment of the Open Food Facts database.'
