excerpt: 'Utilizes the OpenFoodFacts database, containing 129,950 food products, to compare the Nutri-Score (a front-of-pack label for nutritional content) with the NOVA classification (for degree of food processing), which includes ultra-processed foods (UPF). Assesses the complementarity between the Nutri-Score and the NOVA classification across all NOVA categories.'
