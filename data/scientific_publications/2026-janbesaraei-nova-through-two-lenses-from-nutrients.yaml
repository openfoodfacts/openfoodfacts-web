excerpt: "The researchers extracted data from the Open Food Facts database to use\
  \ for training a machine learning classifier. More specifically, \nWe used a subset\
  \  (downloaded 15 May 2026) with 227,930 products with a NOVA group label (1–4)\
  \ and complete values for our target model nutrients. In Figure S1, we present the\
  \ distribution by geographic market presence, illustrating the dataset's predominantly\
  \ European focus, with the six most frequently listed countries of sale and NOVA\
  \ class distribution. \n\nSupplementary material: [media-1.pdf](https://github.com/user-attachments/files/35401000/media-1.pdf)"
