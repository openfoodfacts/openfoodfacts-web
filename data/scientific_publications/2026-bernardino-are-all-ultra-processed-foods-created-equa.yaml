excerpt: 'The researchers retrieved energy, nutrient composition (carbohydrates, protein, total fat, saturated fat, salt, and sugars), nutritional quality (Nutri-Score), and degree of processing (NOVA classification) for pre-packaged food items from the Open Food Facts database. After systematic completeness checks, 13,025 ultra-processed food (UPF) products in Italy were analyzed and classified into EFSA FoodEx2 subgroups to assess heterogeneity in nutritional quality and hyperpalatability.'
