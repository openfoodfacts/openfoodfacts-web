id: provianty
name: Provianty
tagline: Track food expiry and reduce kitchen waste
description: "Provianty tracks what's in your fridge, freezer and pantry, shows which\
  \ items to use next, and helps you avoid buying food you already have. Scan barcodes\
  \ or receipts to add groceries, get color-coded warnings for approaching or past\
  \ dates, and set optional date reminders. \n\nEnable the Food Safety Recall feature\
  \ to receive alerts about products you have added that may be affected by a recall.\
  \ Provianty checks your products’ barcodes against official recall data for your\
  \ selected country.\n\nFree version supports up to 3 storage locations; Provianty\
  \ Pro is a one-time purchase that unlocks unlimited locations and receipt scanning."
