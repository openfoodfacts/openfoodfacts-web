id: protzilla
name: Protzilla
tagline: 'Find the protein products that fit you: 2,700+ products ranked by grams
  of protein per 100 g, in 13 languages.'
description: 'Protzilla is a free, independent website that helps people choose high-protein
  foods without marketing noise. It is available in 13 languages (French, English,
  Spanish, Portuguese, German, Italian, Russian, Lithuanian, Polish, Ukrainian, Arabic,
  Chinese, Japanese).


  What it does:

  - Compares 2,700+ high-protein products (protein bars, powders, dairy, drinks, tofu
  and meat alternatives, legumes, snacks) by grams of protein per 100 g.

  - Publishes 47 rankings (e.g. best whey, vegan soy-free protein, protein bars),
  each with a short summary, a "20 g protein / 10 g sugar" rule of thumb for bars,
  and "best-known brands" comparisons.

  - Offers vegan, soy-free and allergen filters, a free protein needs calculator,
  and protein recipes.

  - Publishes an open study with figures such as sugar and Nutri-Score distribution
  by category.


  How it uses Open Food Facts:

  - Product names, brands, quantities, protein values, allergens and traces, vegan
  analysis and front photos come from the Open Food Facts search API.

  - Sugar content, Nutri-Score grades, organic labels and additive counts are also
  taken from Open Food Facts.

  - Every page credits Open Food Facts (ODbL) for data and CC BY-SA for product photos.


  Who it''s for: athletes, people losing weight, vegetarians and vegans, and anyone
  who wants to know how much protein they really get.'
