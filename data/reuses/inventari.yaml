id: inventari
name: Inventari
tagline: 'Self-hosted inventory for your pantry: scan a barcode and Open Food Facts
  fills in the product, from a copy on your own server.'
description: 'Inventari is an open-source inventory app you install on your own server,
  even a small VPS. At home it keeps track of the pantry, the fridge and the freezer:
  what you have, where it is, and when it goes out of date. Recipes know what is on
  the shelf, and there is a weekly meal plan and shopping lists. The same app also
  runs a small business''s warehouse.


  How it uses Open Food Facts: the administrator imports the Open Food Facts product
  database (the Parquet export on Hugging Face) into a local PostgreSQL database.
  When someone scans a barcode Inventari does not know yet, the new product form is
  filled in with the name, brand, photo and nutrition from that copy, and the lookup
  itself runs on the user''s own server. Recipes use the same figures to estimate
  their nutrition. Wherever these values appear, Inventari names Open Food Facts as
  the source, links to it, and notes that they are a community estimate to check against
  the label.


  The interface is in English, Polish, German, French, Spanish and Brazilian Portuguese.'
