id: mealcrew
name: MealCrew
tagline: Shared meal planning, shopping list and pantry for families and flatmates
  – with barcode scanning powered by Open Food Facts
description: 'MealCrew is a meal planning app for households, families and flatmates
  (“crews”). Members plan meals together in a shared calendar, collect recipes, generate
  a shared shopping list and keep track of the pantry. It is available for Android
  and as a web app, in German and English, and is ad-free.


  Open Food Facts is used via the API whenever a user scans a barcode: in the pantry
  and shopping list (product name, brand, category, product image) and for nutrition
  (nutrients per 100 g/ml and package size). These values feed recipe nutrition estimates
  and a private calorie diary, so scanning a chocolate bar fills in its calories and
  macros. Data from Open Food Facts is shown with attribution (“Source: Open Food
  Facts (openfoodfacts.org), ODbL”). Requests go through our server, so Open Food
  Facts never sees end-user data.


  MealCrew also contributes back: users can submit photos (front, ingredients, nutrition
  table) and details such as ingredients and nutrition facts for scanned products.
  After a manual review by our team, approved data and photos are uploaded to Open
  Food Facts (identified with app_name=MealCrew), licensed under ODbL and CC BY-SA.
  Nothing about the submitting user is shared.'
