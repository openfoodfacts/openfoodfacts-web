id: india-label-index
name: India Label Index
tagline: Analyzes Indian food labels using Open Food Facts data
description: India Label Index is an open study of what Indian packaged-food labels
  say, made by Dev Narsinghani, Mumbai. It uses ingredient lists and nutrition tables
  from products tagged India on Open Food Facts. Findings include that 6 in 10 of
  3,798 Indian ingredient lists name an added sugar and that 71% of 665 packaged foods
  with full nutrition tables would be flagged by FSSAI's current front-of-pack warning
  plan. It is for journalists, researchers, students and policy people who need Indian
  label numbers. It uses Open Food Facts to analyze labels at category level without
  naming brands. Code is open under the MIT licence on GitHub and results are available
  as CSV and JSON under the ODbL with credit to Open Food Facts. Open Food Facts lists
  are entered by volunteers, not a random sample.
