id: label-checker-india
name: Label Checker (India)
tagline: A tool to check food labels and nutrition in India
description: Label Checker (India) is a free web tool made by Dev Narsinghani, Mumbai.
  It allows users to paste an ingredient list, type a barcode or an Open Food Facts
  product link, or take a photo of the label. With a barcode or link it loads the
  product's ingredients and nutrition from the Open Food Facts product API. With a
  photo it reads the label text on the device itself using text recognition in the
  browser. It flags added sugar under its many names and turns the sodium figure into
  salt, the unit Indian health advice uses. It is for shoppers in India who want to
  read the back of a pack quickly. It uses the same sugar name list as the India Label
  Index. It is free to use with no sign up required.
