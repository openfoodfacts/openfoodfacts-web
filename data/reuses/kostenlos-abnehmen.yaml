id: kostenlos-abnehmen
name: Kostenlos abnehmen
tagline: Free weight loss web app in German and English with calorie tracking, a protein
  interval and intermittent fasting
description: 'Kostenlos abnehmen is a free weight loss web app in German and English.
  It needs no subscription. Users pick one of three approaches: calorie tracking,
  a protein interval with protein at fixed times, or intermittent fasting with a timer.
  They also decide how much to record, from nothing to a rough estimate to exact values.


  The barcode scanner and the food search use Open Food Facts for packaged food. We
  import the German products from the weekly Open Food Facts data dump into our own
  database and query that copy, so single scans do not reach the Open Food Facts API.
  Barcodes we do not know yet are looked up one by one from our server.


  Every product shows Open Food Facts as its source together with the ODbL. The data
  sources page credits Open Food Facts, and the whole food database, including products
  that users typed in from the package, is a free weekly download under the ODbL:
  https://kostenlos-abnehmen.de/api/foods/download/foods.csv.gz


  We do not send data or photos back to Open Food Facts yet.'
