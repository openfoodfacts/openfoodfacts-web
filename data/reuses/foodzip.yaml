id: foodzip
name: FoodZip
tagline: Free iPhone barcode scanner that shows Nutri-Score, NOVA, additives and a
  FoodZip score for groceries.
description: 'FoodZip is a free iPhone app for shoppers who want to understand packaged
  food quickly. Users scan a product barcode and see its Nutri-Score, NOVA group,
  additives with plain-language explanations, and the FoodZip score, a single number
  to compare products.


  All product data comes from the Open Food Facts API, queried by barcode. The app
  has no account, no ads and no analytics; scan history is stored only on the device.
  Next, I plan to let users add missing products back to Open Food Facts.'
