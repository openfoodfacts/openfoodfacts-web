id: halal-food-scanner
name: Halal Food Scanner
tagline: Scan a barcode or the ingredients list and see Halal, Haram or Uncertain,
  with the reason for each ingredient.
description: 'Scan a barcode or the ingredients list and see Halal, Haram or Uncertain,
  with the reason for each ingredient. Barcodes are looked up in Open Food Facts.
  When a product is missing, the ingredients scan reads the list from the pack. When
  the pack does not say where an ingredient comes from (gelatin, E471), the app says
  Uncertain instead of guessing. In English, French, German, Arabic, Malay and Indonesian.


  Open Food Facts data used: product names, ingredient lists, ingredient taxonomy,
  vegan label.


  Open Food Facts (ODbL) is credited in the app and on the ingredients checker on
  the website.'
