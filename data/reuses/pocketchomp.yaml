id: pocketchomp
name: PocketChomp
tagline: Canadian calorie counter and macro tracker with free barcode scanning
description: PocketChomp is an Android calorie counter made in Canada. A barcode scan
  checks Canadian grocery and Health Canada data first, then falls back to the OpenFoodFacts
  API for products it doesn't have. OpenFoodFacts products also appear in food search.
  A monthly job sends nutrition values back to OpenFoodFacts for products that two
  independent PocketChomp users scanned from the label and agreed on.
