id: eydo
name: Eydo
tagline: Real prices paid in French supermarkets, read from shoppers' receipts, store
  by store.
description: 'Eydo is a free app for France (iOS and Android). Members link their
  supermarket loyalty accounts: their receipts arrive on their own, and every price
  read on a receipt anonymously feeds a public price map at eydo.fr, product by product,
  store by store, month by month.


  When a product on a receipt is identified by its barcode, Eydo completes its page
  with Open Food Facts data: name, brand, quantity, category and front photo, credited
  "Photo: Open Food Facts, CC BY-SA".'
