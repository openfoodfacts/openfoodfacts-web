id: bonstructer
name: Bonstructer
tagline: Grocery receipt notebook that shows allergens, diet labels and price-per-unit
  for everything you bought
description: 'Bonstructer is a receipt notebook for German shoppers (Android, iOS
  and web). People photograph their grocery receipts and each line is matched to a
  product.


  **How it uses Open Food Facts**

  - Reads names, brands, quantity, categories, allergens, traces and labels (vegan
  / vegetarian / gluten-free / lactose-free) via `api/v2/product/{barcode}` and `cgi/search.pl`.

  - Shows allergens and diet marks per bought item, answers questions like "is there
  gluten in what I bought?" in the in-app chat, and normalises pack sizes for price-per-unit.

  - Read calls are cached for 7 days and use an identifying User-Agent (`BonstructerNotes/1.0
  (info@bonstructer.com; https://bonstructer.com)`).


  **Contributions back**

  When a receipt line has no match, users can create the product with the package
  in hand (EAN, name, brand, quantity, category, allergens, traces, ingredients, nutrition,
  labels, photos). Products are sent to Open Food Facts only after explicit per-product
  consent (ODbL / CC BY-SA) and community review (three confirmations from established
  accounts), with automatic photo checks and mapping to existing OFF taxonomy tags
  only. Uploads use a dedicated OFF account (`chrischosoft`), `app_name`/`app_version`
  and a per-contributor `app_uuid`. Live since 18 Oct 2026.


  **Attribution**

  "Product data: Open Food Facts (ODbL)" in the app''s legal section, an "Open Food
  Facts" source badge on every product card that uses OFF data, and the bonstructer.com
  footer.'
