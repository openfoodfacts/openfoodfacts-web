id: parelo
name: parelo
tagline: Compares German groceries and supplements by protein per calorie, with collagen
  counted out and price per 100 g protein.
description: 'parelo is a German comparison site for groceries and supplements. It
  ranks products by how much of their calories come from protein, and it counts collagen
  and gelatine out, because they are incomplete proteins. Where a price is known,
  it shows the price per 100 g of protein, always with the shop and the date.


  Product data comes from the Open Food Facts data dump (not from bulk API calls),
  and prices partly from Open Prices, shown with place and date. Every product page
  credits Open Food Facts. The derived database is published under the ODbL as a download
  on https://parelo.de/daten/.


  It covers the supermarket shelf, including the own brands of Lidl, Aldi, REWE, EDEKA,
  dm and Rossmann, as lists per category and per chain, product pages and a barcode
  scanner.'
