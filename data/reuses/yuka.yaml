description:
  en: Historically one of the earliest and most well-known reusers of Open Food Facts. Yuka now maintains their own independent database and no longer use Open Food Facts ODbL data, they continue to contribute packaging photos (front, nutrition) and select product data (nutrition) back to Open Food Facts.
  fr: Historiquement l'un des premiers et plus célèbres réutilisateurs d'Open Food Facts. Yuka gère désormais sa propre base de données indépendante et n'utilise plus les données ODbL d'Open Food Facts, mais continue de contribuer des photos d'emballages et certaines données nutritionnelles en retour.
  es: Históricamente uno de los primeros y más conocidos reutilizadores de Open Food Facts. Actualmente mantiene su propia base de datos, pero continúa contribuyendo fotos de envases y datos nutricionales a Open Food Facts.
