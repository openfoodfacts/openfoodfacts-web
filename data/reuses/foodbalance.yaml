id: foodbalance
name: FoodBalance
tagline: Calorie counter and food diary for Android that scans barcodes in Open Food
  Facts and sends missing products back with the user's consent
description: 'FoodBalance is a calorie counter and food diary for Android. People
  log what they eat by barcode, by portion or by meal photo and see calories, protein,
  fat and carbs for the day.


  How it uses Open Food Facts:

  - The barcode scanner and product search look products up in Open Food Facts.

  - Country food packs built from the Open Food Facts database come with the app or
  are downloaded to the phone, and are published under the ODbL.

  - When a product is missing, the user can add it from the label. With the user''s
  consent, the product fields and the nutrition label photo are sent to Open Food
  Facts, so the next person finds it.

  - The app credits Open Food Facts and the ODbL in About and under every product
  that comes from Open Food Facts, with a link to its page.


  Other features: cooking methods with the oil the food absorbed, a daily calorie
  target from the Mifflin-St Jeor and NASEM formulas, water and weight tracking, meal
  reminders, charts and Health Connect. 38 languages, kcal or kJ.


  The diary works without a subscription. FoodBalance Pro (subscription or one-time
  purchase) adds the full nutrient panel, charts for any period and more.'
