id: evobody
name: Evobody
tagline: Premium software for coaches, every add-on included, where clients log food
  by barcode or search with data from Open Food Facts.
description: Evobody is premium software for personal trainers and online fitness
  coaches, with every add-on included and AI fully integrated. Clients get a very
  modern, slick mobile app for iPhone and Android, with their coach's own personalized
  branding. When a client logs food in the app, they can scan a product's barcode
  or search for it, and Open Food Facts is one of the databases behind the results.
  Their coach then sees what they ate, with calories and macros, alongside the client's
  training, habits and check-ins. Evobody credits Open Food Facts and links the Open
  Database License in the footer of every page of evobody.app.
