id: diettribe
name: DietTribe
tagline: Verified gluten-free, dairy-free and allergy-friendly products and venues
  for New Zealand and Australia
description: 'DietTribe is a directory of packaged products and places to eat for
  people who have to get their diet right: coeliac disease, serious food allergies,
  and strict religious or medical diets. It runs as diettribe.nz (New Zealand), diettribe.food
  (Australia) and an iOS and Android app with a barcode scanner.


  Products: each listing shows its ingredients, nutrition and a dietary result (coeliac,
  gluten intolerance, lactose), with every value marked as verified or unverified
  and its evidence recorded. Shoppers can scan a product we don''t list and send us
  photos of the pack.


  Venues: cafés, restaurants, takeaways, bakeries, food trucks and market stalls,
  with their gluten-free, dairy-free, vegan and vegetarian options, menus with dietary
  labels per dish, opening hours and coeliac certifications such as Coeliac NZ Dining
  Out. The app shows venues on a map and finds those nearby, so you can see what''s
  safe to eat around you.


  How we use Open Food Facts:

  - Product data for New Zealand and Australia is imported from Open Food Facts and
  attributed on each product page under the ODbL.

  - A monthly snapshot of the OFF CSV export is used to compare our data with OFF''s
  (no live scraping).


  How we contribute back:

  - Ingredients, nutrition per 100 g, allergen statements, brand, pack size and "countries
  where sold", read from photos of the physical pack and checked by a person against
  the photo before sending.

  - Never data copied from websites, and never photos.

  - Each edit is made by our app account with an edit comment, and read back from
  OFF to confirm it saved.'
