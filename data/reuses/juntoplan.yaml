id: juntoplan
name: JuntoPlan
tagline: Family meal planner whose Compare page shows Open Prices prices for the shopping
  list, each with its date
description: JuntoPlan plans a family's lunches and dinners for the week and puts
  every ingredient on one shared shopping list (web, Android, iPhone; free plan).
  It imports Open Prices daily (prices seen in the last 90 days, mostly France, with
  some from the UK), matches them to OpenStreetMap stores, and shows them on the app's
  Compare page for the items on the user's list, store by store, with the date each
  price was seen. The derived database is republished under the ODbL at https://juntoplan.com/open-data
  (prices.csv with each row's `openprices:<id>`, stores.csv with its OSM reference),
  with the attribution "Contains information from Open Prices (Open Food Facts), OpenStreetMap
  contributors and JuntoPlan". No user data is in the files. I'm Dave, and I make
  JuntoPlan.
