id: nutrilog-kalorienz-hler-ios
name: 'NutriLog: Kalorienzähler (iOS)'
tagline: 'Calorie counter for iPhone that measures your real daily burn: no account,
  no ads, free barcode scanner powered by Open Food Facts'
description: 'NutriLog is an iPhone calorie counter by a small independent team in
  France (iFreX SARL). It works without an account and without ads, keeps the food
  diary on the device and in the user''s own iCloud, and sets the daily target from
  the user''s real energy expenditure.


  Barcode scanning and product search use the Open Food Facts API: millions of packaged
  products, alongside more than 7,000 built-in unpackaged foods for offline use. Scanning
  and searching are free and unlimited, and stay free, which is only possible because
  Open Food Facts is open. The app credits Open Food Facts (ODbL) in its settings.


  Users can correct a product''s figures locally. With the next update (1.1), they
  can also send corrected label figures back to Open Food Facts from the product page,
  without an OFF account: only fields that differ from the database are sent, and
  nothing is sent if the calories don''t add up to protein, carbs and fat.'
