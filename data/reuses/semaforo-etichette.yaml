id: semaforo-etichette
name: Semaforo Etichette
tagline: App gratuita e open source che dà un semaforo ai valori nutrizionali.
description: 'Semaforo Etichette – app Android gratuita e open source che dà un semaforo
  ai valori nutrizionali.

  Scansioni il codice a barre (dati da Open Food Facts) o fotografi la tabella: grassi,
  saturi, zuccheri e sale diventano verdi, arancioni o rossi, e il prodotto prende
  un voto da 0 a 10. La lettura della foto funziona anche senza internet. Puoi correggere
  i valori e, con un account Open Food Facts, inviare le correzioni al database per
  tutti.

  Niente pubblicità, niente tracciamento, nessuna registrazione.'
