verbatim: '"Parmi les plus populaires et qui ont fait leurs preuves, OPEN FOOD FACTS est un projet collaboratif et citoyen
  à but non lucratif auquel tout le monde peut contribuer en ajoutant des produits et en participant à son forum dédié. Née
  en France en 2012, l’app permet de déchiffrer la composition des produits alimentaires en scannant leur code-barre. Elle
  ne se contente pas de donner le Nutri-Score et la liste des ingrédients des produits, elle renseigne également sur leur
  impact écologique, sur leurs allergènes, leurs additifs, etc.

  A ce jour, plus de 9 000 contributeurs ont ajouté 600 000 produits de 200 pays."'
