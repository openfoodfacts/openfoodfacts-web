verbatim: "Open Food Facts mentionné vers 39min\n\nPourquoi le Nutri-Score n'est-il toujours pas obligatoire sur l'ensemble\
  \ des emballages ? Quels sont les effets concrets et scientifiquement prouvés des aliments ultra-transformés et des additifs\
  \ sur notre santé ? De quelles manières les lobbies industriels influencent-ils la recherche scientifique et les décisions\
  \ politiques en France et en Europe ?\n\nFace à la précarité alimentaire et au marketing ciblant massivement les plus jeunes,\
  \ cette discussion apporte un éclairage indispensable pour comprendre les rapports de force économiques et donne des clés\
  \ d'action citoyennes pour réclamer une alimentation saine, transparente et accessible à tous.\n\nAvec :  \nMathilde Touvier,\
  \ épidémiologiste et co-créatrice du Nutri-Score,\nCamille Dorioz, directeur de campagne chez Foodwatch France.\n\nAnimé\
