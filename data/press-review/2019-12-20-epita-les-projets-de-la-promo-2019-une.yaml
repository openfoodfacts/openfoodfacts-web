verbatim: '"Pour notre projet, nous avions utilisé une base de données open source s’appelant Open Food Facts, qui est assez
  connue pour ses données de produits alimentaires. Par contre, en commençant à développer le projet, nous nous sommes aperçus
  que certaines données pouvaient être erronées et qu’il y avait parfois du « déchet » dans cette base. D’où l’idée de créer
  un dashboard pour apposer un filtre sur ces données et ainsi gérer les entrées et les modifications des produits. En plus
  d’améliorer notre concept, ce dashboard peut très bien servir à Open Food Facts afin de mieux gérer les données de leur
  base."'
