verbatim: '"Enfin, la fiabilité de ces applications mérite d''être intérrogée. Comme le relate une étude de l''ObsSoCo, l''application
  Yuka puise dans les données de la plateforme collaborative Open Food Facts, qui classifie les valeurs nutritionnelles des
  produits alimentaires et établit une note en fonction de leur degré de transformation. Les contributeurs de ce "Wikipédia"
  de l''alimentation ? Les consommateurs et... les marques. Depuis 2 ans, Yuka a créé sa propre base de données, alimentée
  cette fois par ses utilisateurs et par les industriels."'
