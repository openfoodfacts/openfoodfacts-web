key_questions:
  - id: latin_inci
    question_fr: "Pourquoi la liste des ingrédients des shampooings est-elle incompréhensible ?"
    question_en: "Why is the ingredient list on shampoo bottles so difficult to understand?"
    finding_fr: "Contrairement à l'alimentation, les cosmétiques utilisent la nomenclature internationale INCI (mélange de latin et de termes chimiques). Le projet vise à traduire « Aqua » en « eau », etc."
    finding_en: "Unlike food, personal care items mandate INCI nomenclature (Latin botanical names and complex chemicals). The mission translates obscure codes into plain language."
  - id: ingredient_count
    question_fr: "Combien d'ingrédients trouve-t-on en moyenne dans un flacon de shampooing ?"
    question_en: "How many ingredients does an average bottle of shampoo contain?"
    finding_fr: "Quelques formules bio comptent moins de 10 composants. La majorité des shampooings de grande surface en comptent entre 20 et 35, et certains dépassent les 40 substances !"
    finding_en: "Minimalist organic formulas count fewer than 10 ingredients, while mainstream retail shampoos typically average 20 to 35, with some exceeding 40 distinct chemicals!"
  - id: preservatives_allergens
    question_fr: "Quels conservateurs et allergènes se cachent dans les soins capillaires ?"
    question_en: "What preservatives and allergens are hidden in hair care products?"
    finding_fr: "Repérage des parabènes, du phénoxyéthanol, des sulfates irritants (SLS/SLES) et des 26 allergènes parfumants obligatoires à déclaration."
    finding_en: "Spotting parabens, phenoxyethanol, stripping sulfates (SLS/SLES), and the mandatory 26 EU fragrance contact allergens."
  - id: trojan_horse_bathroom
    question_fr: "Pourquoi commencer par le shampooing pour lancer Open Beauty Facts ?"
    question_en: "Why start with shampoos to launch Open Beauty Facts?"
    finding_fr: "Tout le monde en possède dans sa douche : c'est la porte d'entrée idéale pour ensuite ouvrir les données des savons, dentifrices, crèmes et maquillage."
    finding_en: "Every household shower has shampoo: it served as the ideal Trojan Horse before expanding to soaps, toothpastes, moisturizers, and cosmetics."

global_goals:
  - goal_fr: "Ouvrir au moins 1 shampooing dans 250 pays et territoires du monde"
    goal_en: "Open at least 1 shampoo barcode across 250 global countries and territories"
  - goal_fr: "Améliorer l'OCR sur les bouteilles et flacons incurvés"
    goal_en: "Enhance OCR algorithms for curved bottles and cylindrical packaging"
  - goal_fr: "Associer étudiants en chimie et associations de consommateurs"
    goal_en: "Partner with chemistry students, toxicology researchers, and consumer groups"

