key_questions:
  - id: portion_sizes
    question_fr: "Les portions de yaourts sont-elles identiques d'un pays à l'autre ?"
    question_en: "Are yogurt portion sizes identical across different countries?"
    finding_fr: "Grosse surprise culturelle : le pot individuel standard fait 125g en France, contre 180g en Suisse et jusqu'à 200-250g aux États-Unis !"
    finding_en: "Surprising cultural gap: standard individual yogurt pots are 125g in France, 180g in Switzerland, and up to 200-250g in the US!"
  - id: real_fruit_content
    question_fr: "Quelle est la part réelle de fruits dans les « yaourts aux fruits » ?"
    question_en: "What percentage of real fruit is actually present in fruit yogurts?"
    finding_fr: "Beaucoup de yaourts industriels contiennent moins de 5% de pulpe de fruits, compensée par du sucre, des gélifiants et des colorants."
    finding_en: "Many commercial yogurts contain under 5% actual fruit preparation, compensated with thickeners, sugar, and natural color extracts."
  - id: fat_vs_sugar
    question_fr: "Les yaourts allégés en matière grasse (0%) contiennent-ils plus de sucre ou d'additifs ?"
    question_en: "Do low-fat (0%) yogurts compensate texture with extra sugar or additives?"
    finding_fr: "Les analyses révèlent que de nombreuses versions allégées compensent le manque d'onctuosité par des épaississants, amidons modifiés et édulcorants intenses."
    finding_en: "Data reveals that fat-free variants frequently replace creaminess with modified starches, pectin, and synthetic intense sweeteners."
  - id: global_sugars
    question_fr: "Les yaourts sont-ils plus sucrés dans certaines régions du globe ou outre-mer ?"
    question_en: "Are yogurts sweeter in certain regions or overseas territories?"
    finding_fr: "Des écarts marqués de teneur en sucre ont été identifiés selon les marchés locaux, relançant la demande de formulations harmonisées."
    finding_en: "Noticeable disparities in added sugars were mapped across local markets, fueling community campaigns for honest formulations."

country_teams:
  - country: "France"
    notes: "Base initiale de 172 yaourts enrichie à plus de 1 000 références en quelques semaines."
  - country: "Belgium"
    notes: "Différenciation des circuits de distribution transfrontaliers avec la France et les Pays-Bas."
  - country: "Switzerland"
    notes: "Découverte des pots grand format 180g et forte proportion de yaourts brassés alpins."
  - country: "Morocco"
    notes: "Lancement de la dynamique avec les acteurs open data marocains."
  - country: "Singapore & French Caribbean"
    notes: "Enquête sur les produits importés et taux de sucre sous les tropiques."

