key_questions:
  - id: brands_vs_discount
    question_fr: "Y a-t-il une différence entre sodas de grande marque et marques de distributeurs ou discount ?"
    question_en: "Is there a difference between major brands and private labels or discount sodas?"
    finding_fr: "Les compositions nutritionnelles sont très proches, mais les produits discount recourent parfois à davantage d'arômes artificiels ou d'édulcorants."
    finding_en: "Nutrition figures are very similar, but budget brands sometimes substitute natural extracts with artificial flavorings or sweeteners."
  - id: sugar_levels
    question_fr: "Quelle est l'équivalence en morceaux de sucre et en caféine d'une canette ?"
    question_en: "What is the sugar cube and caffeine equivalent in a standard can?"
    finding_fr: "Une canette de 33cl de cola classique concentre l'équivalent de 7 morceaux de sucre (environ 35g) !"
    finding_en: "A standard 330ml can of classic cola packs the equivalent of 7 sugar cubes (around 35g)!"
  - id: dom_tom_differences
    question_fr: "Les boissons sont-elles plus sucrées dans les DOM-TOM qu'en métropole ?"
    question_en: "Are sodas sweeter in French Overseas Territories than in mainland France?"
    finding_fr: "Cette question pionnière posée lors de l'opération a directement anticipé les débats publics et la loi Lurel de 2013 interdisant les écarts de sucre outre-mer."
    finding_en: "This pioneering question anticipated national public health debates and the 2013 Lurel law banning excess sugar formulas in overseas territories."
  - id: energy_drinks
    question_fr: "Quels sont les ingrédients spécifiques aux boissons gazeuses énergisantes ?"
    question_en: "What ingredients are unique to energy drinks like Red Bull?"
    finding_fr: "Forte concentration en taurine, caféine, glucuronolactone et vitamines du groupe B couplées à des doses massives de sucre ou d'édulcorants."
    finding_en: "Heavy loads of taurine, caffeine, glucuronolactone, and B-vitamins coupled with massive sugar doses or synthetic sweeteners."
  - id: bio_and_vegan
    question_fr: "Les sodas bios sont-ils nutritionnellement intéressants et quels sodas conviennent aux véganes ?"
    question_en: "Are organic sodas nutritionally advantageous, and which ones suit vegans?"
    finding_fr: "Le sucre bio reste du sucre d'un point de vue métabolique. Côté véganisme, attention au colorant carmin (E120) dérivé d'insectes présent dans certains sodas rouges."
    finding_en: "Organic sugar remains sugar metabolically. For vegans, vigilance is required regarding cochineal carmine (E120) insect-derived coloring in red sodas."

