<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-discover-decipher" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .score-pill-1 { animation: pillSlide 4.2s ease-in-out infinite; }
                        .score-pill-2 { animation: pillSlide 4.2s ease-in-out infinite 0.5s; }
                        .score-pill-3 { animation: pillSlide 4.2s ease-in-out infinite 1s; }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes pillSlide {
                            0%, 100% { transform: translateX(0px); }
                            50% { transform: translateX(8px); }
                        }
                    </style>

                    <!-- Left: Hand Holding Smartphone (From Hand_With_Smartphone_01_2.svg) -->
                    <g transform="translate(20, 20) scale(0.92)">
                        <g fill="#955830">
                            <rect x="44" y="88" width="55" height="28" rx="14" transform="rotate(37 70 102)"></rect>
                            <rect x="20" y="114" width="76" height="29" rx="14.5" transform="rotate(37 58 128)"></rect>
                            <rect x="0" y="142" width="88" height="29" rx="14.5" transform="rotate(37 44 156)"></rect>
                        </g>
                        <path fill="#955830" d="M 165,168 L 228,175 C 268,210 305,232 355,245 L 355,355 C 285,342 228,312 175,274 Z"></path>
                        <g transform="rotate(6.2 125 155)">
                            <rect x="46" y="18" width="158" height="274" rx="16" fill="#606362"></rect>
                            <rect x="52" y="26" width="146" height="258" rx="14" fill="#e1f3fe"></rect>
                            <!-- Mini Bottle inside Phone Screen -->
                            <g transform="translate(95, 68) scale(0.55)">
                                <rect x="28" y="0" width="32" height="14" rx="4" fill="#aeaeae"></rect>
                                <path fill="#009a49" d="M 32,14 L 56,14 L 56,46 C 76,54 86,74 86,98 L 86,182 A 12,12 0 0,1 74,194 L 14,194 A 12,12 0 0,1 2,182 L 2,98 C 2,74 12,54 32,46 Z"></path>
                                <rect x="16" y="86" width="56" height="72" rx="6" fill="#ffffff"></rect>
                            </g>
                            <circle cx="155" cy="225" r="22" fill="#0b7a3e"></circle>
                            <path d="M 145,225 L 152,232 L 166,218" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path>
                            <path fill="#606362" d="M 93,24 L 157,24 L 153,35 A 6,6 0 0,1 147,39 L 103,39 A 6,6 0 0,1 97,35 Z"></path>
                        </g>
                        <path fill="#955830" d="M 188,248 L 196,112 A 15.5,15.5 0 0,1 227,110 L 236,184 L 222,255 Z"></path>
                    </g>

                    <!-- Right: 3 Deciphered Score Cards (Nutri-Score, NOVA, Green-Score) -->
                    <!-- Card 1: Nutri-Score -->
                    <g class="score-pill-1" transform="translate(278, 56)">
                        <rect x="0" y="0" width="244" height="84" rx="18" fill="#ffffff"></rect>
                        <text x="20" y="26" fill="#64748b" font-size="11" font-weight="800">NUTRI-SCORE</text>
                        <rect x="20" y="36" width="38" height="34" rx="8" fill="#009a49"></rect>
                        <text x="39" y="59" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">A</text>
                        <rect x="64" y="40" width="32" height="26" rx="5" fill="#7fbc2b"></rect>
                        <rect x="100" y="40" width="32" height="26" rx="5" fill="#f8c100"></rect>
                        <rect x="136" y="40" width="32" height="26" rx="5" fill="#f38218"></rect>
                        <rect x="172" y="40" width="32" height="26" rx="5" fill="#dc3522"></rect>
                    </g>

                    <!-- Card 2: NOVA Food Processing -->
                    <g class="score-pill-2" transform="translate(278, 162)">
                        <rect x="0" y="0" width="244" height="84" rx="18" fill="#ffffff"></rect>
                        <text x="20" y="26" fill="#64748b" font-size="11" font-weight="800">NOVA PROCESSING</text>
                        <rect x="20" y="36" width="36" height="36" rx="8" fill="#009a49"></rect>
                        <text x="38" y="61" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">1</text>
                        <text x="72" y="52" fill="#181818" font-size="14" font-weight="800">Unprocessed</text>
                        <text x="72" y="68" fill="#64748b" font-size="12" font-weight="600">No additives</text>
                    </g>

                    <!-- Card 3: Green-Score / Eco-Score -->
                    <g class="score-pill-3" transform="translate(278, 268)">
                        <rect x="0" y="0" width="244" height="84" rx="18" fill="#ffffff"></rect>
                        <text x="20" y="26" fill="#64748b" font-size="11" font-weight="800">GREEN-SCORE</text>
                        <path fill="#009a49" d="M 20,56 C 20,38 42,34 62,38 C 62,58 46,72 28,70 Z"></path>
                        <text x="41" y="59" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">A</text>
                        <text x="76" y="52" fill="#181818" font-size="14" font-weight="800">Low CO₂ Impact</text>
                        <text x="76" y="68" fill="#009a49" font-size="12" font-weight="700">Recyclable glass</text>
                    </g>
                </svg>