                        <ellipse cx="32" cy="164" rx="8" ry="4" transform="rotate(-45 32 164)" fill="#f8c100"></ellipse>
                    </g>

                    <!-- Attached Green check.svg Quality Seal -->
                    <g class="dq-badge">
                        <circle cx="430" cy="118" r="44" fill="#000000" opacity="0.1"></circle>
