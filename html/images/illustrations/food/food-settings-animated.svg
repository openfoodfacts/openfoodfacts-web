<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-food-settings" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="360" height="270" class="max-w-[420px]">
                    <style>
                        .knob-sugar {
                            animation: slideSugar 4.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
                        }
                        .knob-salt {
                            animation: slideSalt 4.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
                        }
                        .knob-fat {
                            animation: slideFat 4.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
                        }
                        .salt-grains {
                            animation: grainsSprinkle 1.4s ease-in-out infinite;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes slideSugar {
                            0%, 100% { transform: translateX(0px); }
                            50% { transform: translateX(135px); }
                        }
                        @keyframes slideSalt {
                            0%, 100% { transform: translateX(0px); }
                            50% { transform: translateX(-145px); }
                        }
                        @keyframes slideFat {
                            0%, 100% { transform: translateX(0px); }
                            50% { transform: translateX(105px); }
                        }
                        @keyframes grainsSprinkle {
                            0%, 100% { transform: translate(0px, 0px); opacity: 0.95; }
                            50% { transform: translate(3px, 4px); opacity: 0.35; }
                        }
                    </style>

                    <!-- 3 Horizontal Slider Tracks (Hidden in Dark Mode variant) -->
                    <g id="foodSettingsTracks" fill="#d9d9d9">
                        <rect x="2" y="43" width="356" height="10" rx="5"></rect>
                        <rect x="2" y="130" width="356" height="10" rx="5"></rect>
                        <rect x="2" y="216" width="356" height="10" rx="5"></rect>
                    </g>

                    <!-- SLIDER 1: 3 ISOMETRIC SUGAR CUBES -->
                    <g class="knob-sugar">
                        <circle cx="84" cy="48" r="48" fill="#575756"></circle>
                        <!-- Top-Left Cube -->
                        <g transform="translate(54, 16)">
                            <polygon points="14,0 34,5 22,16 0,11" fill="#e2e2e2"></polygon>
                            <polygon points="0,11 22,16 24,36 2,30" fill="#ffffff"></polygon>
                            <polygon points="22,16 34,5 36,24 24,36" fill="#c6c6c6"></polygon>
                        </g>
                        <!-- Right Cube -->
                        <g transform="translate(83, 29)">
                            <polygon points="15,0 35,9 21,19 0,9" fill="#e2e2e2"></polygon>
                            <polygon points="0,9 21,19 18,39 0,30" fill="#ffffff"></polygon>
                            <polygon points="21,19 35,9 33,29 18,39" fill="#c6c6c6"></polygon>
                        </g>
                        <!-- Bottom-Front Cube -->
                        <g transform="translate(57, 41)">
                            <polygon points="14,0 34,5 22,16 0,11" fill="#e2e2e2"></polygon>
                            <polygon points="0,11 22,16 24,36 2,31" fill="#ffffff"></polygon>
                            <polygon points="22,16 34,5 36,24 24,36" fill="#c6c6c6"></polygon>
                        </g>
                    </g>

                    <!-- SLIDER 2: TILTED CYAN SALT SHAKER -->
                    <g class="knob-salt">
                        <circle cx="274" cy="135" r="48" fill="#575756"></circle>
                        <!-- Cyan Glass Body (#a2ffff) -->
                        <path fill="#a2ffff" d="M 256,102 C 259,99 264,99 267,103 L 289,132 L 270,150 L 241,126 C 238,123 238,118 241,115 Z"></path>
                        <!-- Grey Metal Cap (#9d9d9c) -->
                        <line x1="270" y1="152" x2="290" y2="131" stroke="#878787" stroke-width="3" stroke-linecap="round"></line>
                        <path fill="#9d9d9c" d="M 289,133 C 302,143 298,158 286,160 C 278,161 274,156 271,150 Z"></path>
                        <!-- Cap Perforation Dots -->
                        <g fill="#575756">
                            <circle cx="285" cy="144" r="1"></circle><circle cx="289" cy="146" r="1"></circle>
                            <circle cx="282" cy="148" r="1"></circle><circle cx="286" cy="150" r="1"></circle>
                            <circle cx="290" cy="151" r="1"></circle><circle cx="280" cy="152" r="1"></circle>
                        </g>
                        <!-- Falling White Salt Grains -->
                        <g class="salt-grains" fill="#ffffff">
                            <circle cx="288" cy="161" r="1.2"></circle>
                            <circle cx="294" cy="156" r="1.2"></circle>
                            <circle cx="297" cy="160" r="1.2"></circle>
                            <circle cx="292" cy="164" r="1.2"></circle>
                            <circle cx="289" cy="167" r="1.2"></circle>
                            <circle cx="297" cy="167" r="1.2"></circle>
                            <circle cx="294" cy="171" r="1.2"></circle>
                        </g>
                    </g>

                    <!-- SLIDER 3: YELLOW OIL / FAT DROPLET -->
                    <g class="knob-fat">
                        <circle cx="138" cy="221" r="48" fill="#575756"></circle>
                        <path fill="#ffd543" d="M 138,191 C 142,191 160,211 160,226 A 22,22 0 1,1 116,226 C 116,211 134,191 138,191 Z"></path>
                        <path d="M 146,209 C 150,213 153,218 154,222" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"></path>
                        <path d="M 154,229 C 154,232 152,235 151,236" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"></path>
                    </g>
                </svg>