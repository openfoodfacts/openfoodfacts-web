<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-made-near-me" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280" class="max-w-[400px]">
                    <style>
                        .cube-drop-1 { animation: cubePop 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.1s; transform-origin: 164px 215px; }
                        .cube-drop-2 { animation: cubePop 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.22s; transform-origin: 222px 215px; }
                        .cube-drop-3 { animation: cubePop 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.34s; transform-origin: 279px 215px; }
                        .cube-drop-4 { animation: cubePop 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.48s; transform-origin: 193px 159px; }
                        .cube-drop-5 { animation: cubePop 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.60s; transform-origin: 250px 159px; }
                        .cube-drop-6 { animation: cubePop 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.76s; transform-origin: 222px 103px; }
                        .screen-sheen { animation: sheenPulse 4s ease-in-out infinite; }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes cubePop {
                            0%, 12%, 92%, 100% { transform: translateY(-14px) scale(0.82); opacity: 0; }
                            28%, 80% { transform: translateY(0px) scale(1); opacity: 1; }
                        }
                        @keyframes sheenPulse {
                            0%, 100% { opacity: 0.22; }
                            50% { opacity: 0.32; }
                        }
                    </style>

                    <!-- Outer Dark Bezel (#191919) & Blue Screen (#0066ff) -->
                    <rect x="0" y="0" width="360" height="280" rx="26" fill="#191919"></rect>
                    <rect x="23" y="21" width="314" height="238" rx="22" fill="#0066ff"></rect>

                    <!-- Left Soda Bottle -->
                    <path fill="#ff0000" d="M 64,46 A 14,14 0 0,1 78,32 L 90,32 A 14,14 0 0,1 104,46 L 104,63 L 64,63 Z"></path>
                    <path fill="#2b0904" d="M 42,92 C 42,74 55,63 72,63 L 96,63 C 113,63 126,74 126,92 L 126,214 C 126,230 113,242 96,242 L 72,242 C 55,242 42,230 42,214 Z"></path>
                    <rect x="42" y="108" width="84" height="88" fill="#ff3b30"></rect>

                    <!-- Right 6-Cube Pyramid (#fafafa) -->
                    <g fill="#fafafa">
                        <!-- Row 1 (Bottom 3 Cubes) -->
                        <rect class="cube-drop-1" x="138" y="190" width="52" height="51"></rect>
                        <rect class="cube-drop-2" x="196" y="190" width="52" height="51"></rect>
                        <rect class="cube-drop-3" x="253" y="190" width="52" height="51"></rect>
                        <!-- Row 2 (Middle 2 Cubes) -->
                        <rect class="cube-drop-4" x="167" y="134" width="52" height="51"></rect>
                        <rect class="cube-drop-5" x="224" y="134" width="52" height="51"></rect>
                        <!-- Row 3 (Top 1 Cube) -->
                        <rect class="cube-drop-6" x="196" y="77" width="52" height="51"></rect>
                    </g>

                    <!-- Diagonal Translucent White Screen Glare Overlay -->
                    <path class="screen-sheen" fill="#ffffff" opacity="0.24" d="
                        M 23,43 C 23,31 33,21 45,21 L 34,21 L 330,256 C 324,258 318,259 312,259 L 45,259 C 33,259 23,249 23,237 Z"></path>
                </svg>