<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-discover-history" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .hist-clock-hand {
                            animation: sweepClock 5s linear infinite;
                            transform-origin: 155px 195px;
                        }
                        .pref- float {
                            animation: prefBob 4s ease-in-out infinite;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes sweepClock {
                            0% { transform: rotate(0deg); }
                            100% { transform: rotate(360deg); }
                        }
                        @keyframes prefBob {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(-8px); }
                        }
                    </style>

                    <!-- Left: Attached History.svg Clock -->
                    <g>
                        <circle cx="155" cy="195" r="108" fill="#ffffff"></circle>
                        <circle cx="155" cy="195" r="95" fill="none" stroke="#7ce0ff" stroke-width="26"></circle>
                        <line x1="155" y1="195" x2="198" y2="238" stroke="#7a7a7a" stroke-width="16" stroke-linecap="round"></line>
                        <g class="hist-clock-hand">
                            <line x1="155" y1="195" x2="155" y2="128" stroke="#7a7a7a" stroke-width="16" stroke-linecap="round"></line>
                        </g>
                    </g>

                    <!-- Right: Attached Checklist.svg as Allergen & Diet Preferences -->
                    <g class="pref-float" transform="translate(285, 52) rotate(3)">
                        <rect x="0" y="16" width="218" height="292" rx="26" fill="#00bdf2"></rect>
                        <rect x="18" y="40" width="182" height="248" rx="16" fill="#ffffff"></rect>
                        <rect x="72" y="0" width="74" height="50" rx="12" fill="#aeaeae"></rect>

                        <!-- Preference 1: Gluten Free -->
                        <circle cx="52" cy="96" r="14" fill="#0b7a3e"></circle>
                        <path d="M 45,96 L 50,101 L 60,91" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
                        <text x="80" y="101" fill="#181818" font-size="15" font-weight="800">No Gluten</text>

                        <!-- Preference 2: Palm Oil Free -->
                        <circle cx="52" cy="148" r="14" fill="#0b7a3e"></circle>
                        <path d="M 45,148 L 50,153 L 60,143" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
                        <text x="80" y="153" fill="#181818" font-size="15" font-weight="800">No Palm Oil</text>

                        <!-- Preference 3: Vegan -->
                        <circle cx="52" cy="200" r="14" fill="#0b7a3e"></circle>
                        <path d="M 45,200 L 50,205 L 60,195" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"></path>
                        <text x="80" y="205" fill="#181818" font-size="15" font-weight="800">Vegan / Bio</text>

                        <!-- Preference 4: Low Salt -->
                        <circle cx="52" cy="252" r="12" fill="none" stroke="#0077c8" stroke-width="4.5"></circle>
                        <line x1="80" y1="252" x2="172" y2="252" stroke="#181818" stroke-width="5.5" stroke-linecap="round"></line>
                    </g>
                </svg>