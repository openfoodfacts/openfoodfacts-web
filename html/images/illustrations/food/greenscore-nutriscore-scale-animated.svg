<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-greenscore-nutriscore-scale" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290" width="380" height="290" class="max-w-[430px]">
                    <style>
                        .balance-beam {
                            animation: beamRock 4.8s ease-in-out infinite;
                            transform-origin: 190px 21px;
                        }
                        .left-smiley-hang {
                            animation: counterLeft 4.8s ease-in-out infinite;
                        }
                        .right-earth-hang {
                            animation: counterRight 4.8s ease-in-out infinite;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes beamRock {
                            0%, 100% { transform: rotate(-6.5deg); }
                            50% { transform: rotate(6.5deg); }
                        }
                        @keyframes counterLeft {
                            0%, 100% { transform: translateY(15px); }
                            50% { transform: translateY(-15px); }
                        }
                        @keyframes counterRight {
                            0%, 100% { transform: translateY(-15px); }
                            50% { transform: translateY(15px); }
                        }
                    </style>

                    <!-- Central Brown Stand & Dome Base (#784400) -->
                    <rect x="185" y="34" width="9" height="232" fill="#784400"></rect>
                    <path fill="#784400" d="M 139,289 C 139,270 154,260 172,260 L 208,260 C 226,260 241,270 241,289 Z"></path>

                    <!-- Rocking Top Beam & Fulcrum Ring -->
                    <g class="balance-beam">
                        <line x1="55" y1="21" x2="325" y2="21" stroke="#784400" stroke-width="8.5" stroke-linecap="round"></line>
                        <circle cx="190" cy="21" r="14" fill="#ffffff" stroke="#784400" stroke-width="7.5"></circle>
                    </g>

                    <!-- Left Hanging Smiley Face (#ffc712) -->
                    <g class="left-smiley-hang">
                        <line x1="56" y1="24" x2="56" y2="105" stroke="#784400" stroke-width="3"></line>
                        <circle cx="56" cy="153" r="56" fill="#ffc712"></circle>
                        <!-- Happy Closed Arc Eyes & Smile -->
                        <path d="M 26,142 C 31,135 42,135 47,142" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round"></path>
                        <path d="M 65,142 C 70,135 81,135 86,142" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round"></path>
                        <path d="M 27,167 C 41,182 71,182 85,167" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"></path>
                    </g>

                    <!-- Right Hanging Earth Globe (#6ae3ff & #009a49) -->
                    <g class="right-earth-hang">
                        <line x1="324" y1="16" x2="324" y2="95" stroke="#784400" stroke-width="3"></line>
                        <circle cx="324" cy="121" r="56" fill="#6ae3ff"></circle>
                        <path fill="#009a49" d="M 304,68 C 312,86 296,95 282,102 C 276,112 288,128 282,135 C 276,140 269,138 269,138 A 56,56 0 0,1 304,68 Z"></path>
                        <path fill="#009a49" d="M 334,66 C 326,86 346,104 358,96 C 366,102 374,108 379,111 A 56,56 0 0,0 334,66 Z"></path>
                        <path fill="#009a49" d="M 314,103 C 330,94 338,110 328,132 C 322,150 310,156 306,136 C 302,120 292,112 314,103 Z"></path>
                        <path fill="#009a49" d="M 344,132 C 352,118 372,118 380,126 A 56,56 0 0,1 328,177 C 322,162 342,156 344,132 Z"></path>
                        <path fill="#009a49" d="M 278,154 C 292,148 304,162 308,175 A 56,56 0 0,1 278,154 Z"></path>
                    </g>

                    <!-- Bottom-Left Official Nutri-Score A Badge -->
                    <g transform="translate(6, 238)">
                        <text x="4" y="9" fill="#777777" font-family="Inter, sans-serif" font-size="10.5" font-weight="800">NUTRI-SCORE</text>
                        <rect x="23" y="14" width="19" height="30" fill="#85bb2f"></rect>
                        <rect x="42" y="14" width="19" height="30" fill="#fecb02"></rect>
                        <rect x="61" y="14" width="19" height="30" fill="#ee8100"></rect>
                        <path fill="#e63e11" d="M 80,14 L 91,14 A 7,7 0 0,1 98,21 L 98,37 A 7,7 0 0,1 91,44 L 80,44 Z"></path>
                        <rect x="0" y="10" width="23" height="38" rx="11.5" fill="#038141" stroke="#ffffff" stroke-width="1.5"></rect>
                        <text x="11.5" y="36" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">A</text>
                        <text x="32.5" y="34" text-anchor="middle" fill="#ffffff" opacity="0.65" font-size="16" font-weight="800">B</text>
                        <text x="51.5" y="34" text-anchor="middle" fill="#ffffff" opacity="0.65" font-size="16" font-weight="800">C</text>
                        <text x="70.5" y="34" text-anchor="middle" fill="#ffffff" opacity="0.65" font-size="16" font-weight="800">D</text>
                        <text x="89" y="34" text-anchor="middle" fill="#ffffff" opacity="0.65" font-size="16" font-weight="800">E</text>
                    </g>

                    <!-- Bottom-Right Official Green-Score A Badge -->
                    <g transform="translate(296, 199)">
                        <rect x="0" y="0" width="54" height="90" rx="8" fill="#ffffff" stroke="#168843" stroke-width="2"></rect>
                        <path fill="#168843" d="M 12,35 C 8,20 22,8 45,7 C 45,28 36,42 20,40 L 14,44 C 11,46 8,42 10,39 Z"></path>
                        <text x="27" y="32" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="800">A</text>
                        <text x="27" y="59" text-anchor="middle" fill="#181818" font-size="16" font-weight="700">green</text>
                        <rect x="6" y="64" width="10" height="4.5" rx="2.2" fill="#168843"></rect>
                        <circle cx="20" cy="66.2" r="2.2" fill="#85bb2f"></circle>
                        <circle cx="26" cy="66.2" r="2.2" fill="#fecb02"></circle>
                        <circle cx="32" cy="66.2" r="2.2" fill="#ee8100"></circle>
                        <circle cx="38" cy="66.2" r="2.2" fill="#e63e11"></circle>
                        <circle cx="44" cy="66.2" r="2.2" fill="#b31b1b"></circle>
                        <text x="27" y="82" text-anchor="middle" fill="#181818" font-size="16" font-weight="700">score</text>
                    </g>
                </svg>