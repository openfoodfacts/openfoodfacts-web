<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-add-products-cosmetics" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .cos-lipstick-float {
                            animation: cosLipBob 4.2s ease-in-out infinite;
                            transform-origin: 105px 240px;
                        }
                        .cos-sunscreen-float {
                            animation: cosSunBob 4.2s ease-in-out infinite 0.3s;
                            transform-origin: 235px 215px;
                        }
                        .cos-sun-spin {
                            animation: sunStarPulse 4.2s ease-in-out infinite;
                            transform-origin: 235px 235px;
                        }
                        .cos-scanner-hand {
                            animation: cosPhoneScanMove 4.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
                            transform-origin: 520px 360px;
                        }
                        .cos-laser-line {
                            animation: cosLaserSweep 2.1s ease-in-out infinite;
                        }
                        .cos-scan-badge {
                            animation: cosBadgePop 4.2s ease-out infinite;
                            transform-origin: 355px 245px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes cosLipBob {
                            0%, 100% { transform: translateY(0px) rotate(-14deg); }
                            50% { transform: translateY(-9px) rotate(-10deg); }
                        }
                        @keyframes cosSunBob {
                            0%, 100% { transform: translateY(0px) rotate(6deg); }
                            50% { transform: translateY(-10px) rotate(9deg); }
                        }
                        @keyframes sunStarPulse {
                            0%, 100% { transform: scale(1) rotate(0deg); }
                            50% { transform: scale(1.08) rotate(12deg); }
                        }
                        @keyframes cosPhoneScanMove {
                            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
                            45%, 60% { transform: translate(-18px, -10px) rotate(-3deg); }
                        }
                        @keyframes cosLaserSweep {
                            0%, 100% { transform: translateY(-38px); opacity: 0.35; }
                            50% { transform: translateY(42px); opacity: 1; }
                        }
                        @keyframes cosBadgePop {
                            0%, 38%, 90%, 100% { transform: scale(0); opacity: 0; }
                            48%, 78% { transform: scale(1); opacity: 1; }
                        }
                    </style>

                    <!-- 1. LIPSTICK (From Open Beauty Facts / hero-openprices.svg) -->
                    <g class="cos-lipstick-float">
                        <!-- Red Slanted Bullet Tip (#f53618) -->
                        <path fill="#f53618" d="M 82,126 L 122,144 L 122,198 L 82,198 Z"></path>
                        <!-- Gold Collar (#ffc412) -->
                        <rect x="74" y="194" width="56" height="54" rx="3" fill="#ffc412"></rect>
                        <!-- Dark Grey Case (#606362) -->
                        <rect x="64" y="244" width="76" height="118" rx="8" fill="#606362"></rect>
                    </g>

                    <!-- 2. ATTACHED SUNSCREEN.SVG (Orange Bottle + Yellow Cap + 8-Pointed Sun) -->
                    <g class="cos-sunscreen-float">
                        <!-- Yellow Cap (#ffc40c) -->
                        <rect x="195" y="54" width="80" height="48" rx="8" fill="#ffc40c"></rect>
                        <!-- Curved Orange Bottle Body (#ff6d3b) -->
                        <path fill="#ff6d3b" d="
                            M 195,98
                            C 215,92 255,92 275,98
                            C 284,101 288,108 290,118
                            C 298,162 320,218 320,275
                            C 320,334 304,358 275,362
                            C 250,366 220,366 195,362
                            C 166,358 150,334 150,275
                            C 150,218 172,162 180,118
                            C 182,108 186,101 195,98 Z"></path>
                        <!-- 8-Pointed Yellow Sunburst Star (#ffc40c) -->
                        <g class="cos-sun-spin">
                            <path fill="#ffc40c" stroke="#ffc40c" stroke-width="6" stroke-linejoin="round" d="
                                M 235,186
                                L 247,204 L 269,200 L 265,222 L 284,235
                                L 265,248 L 269,270 L 247,266 L 235,284
                                L 223,266 L 201,270 L 205,248 L 186,235
                                L 205,222 L 201,200 L 223,204 Z"></path>
                        </g>
                    </g>

                    <!-- 3. HAND WITH SMARTPHONE SCANNING COSMETICS -->
                    <g class="cos-scanner-hand">
                        <g fill="#955830">
                            <rect x="292" y="142" width="45" height="22" rx="11" transform="rotate(35 314 153)"></rect>
                            <rect x="275" y="164" width="58" height="22" rx="11" transform="rotate(35 304 175)"></rect>
                            <rect x="260" y="186" width="66" height="22" rx="11" transform="rotate(35 293 197)"></rect>
                        </g>
                        <path fill="#955830" d="M 380,210 L 432,216 C 470,252 508,270 555,280 L 555,375 C 488,365 436,336 385,292 Z"></path>
                        <g transform="rotate(5 355 200)">
                            <rect x="294" y="88" width="122" height="214" rx="14" fill="#606362"></rect>
                            <rect x="300" y="95" width="110" height="200" rx="11" fill="#e1f3fe"></rect>
                            <rect x="314" y="122" width="82" height="90" rx="8" fill="#ffffff"></rect>
                            <g fill="#222222">
                                <rect x="325" y="140" width="4" height="44"></rect>
                                <rect x="333" y="140" width="8" height="44"></rect>
                                <rect x="345" y="140" width="3" height="44"></rect>
                                <rect x="352" y="140" width="6" height="44"></rect>
                                <rect x="362" y="140" width="10" height="44"></rect>
                                <rect x="376" y="140" width="3" height="44"></rect>
                                <rect x="383" y="140" width="5" height="44"></rect>
                            </g>
                            <rect class="cos-laser-line" x="304" y="162" width="102" height="3.5" rx="1.5" fill="#dc3522"></rect>
                            <g class="cos-scan-badge">
                                <rect x="320" y="232" width="70" height="26" rx="13" fill="#009a49"></rect>
                                <path d="M 346,245 L 352,251 L 365,239" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
                            </g>
                            <path fill="#606362" d="M 332,93 L 378,93 L 375,102 L 335,102 Z"></path>
                        </g>
                        <path fill="#955830" d="M 404,268 L 410,162 A 12,12 0 0,1 434,162 L 440,220 L 430,274 Z"></path>
                    </g>
                </svg>