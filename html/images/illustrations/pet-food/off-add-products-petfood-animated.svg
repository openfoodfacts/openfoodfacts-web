<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-add-products-petfood" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .pf-kibble-float {
                            animation: pfKibbleBob 4.2s ease-in-out infinite;
                            transform-origin: 128px 225px;
                        }
                        .pf-pate-float {
                            animation: pfPateBob 4.2s ease-in-out infinite 0.35s;
                            transform-origin: 255px 285px;
                        }
                        .pf-scanner-hand {
                            animation: pfPhoneScanMove 4.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
                            transform-origin: 520px 360px;
                        }
                        .pf-laser-line {
                            animation: pfLaserSweep 2.1s ease-in-out infinite;
                        }
                        .pf-scan-badge {
                            animation: pfBadgePop 4.2s ease-out infinite;
                            transform-origin: 355px 245px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes pfKibbleBob {
                            0%, 100% { transform: translateY(0px) rotate(-4deg); }
                            50% { transform: translateY(-9px) rotate(-1deg); }
                        }
                        @keyframes pfPateBob {
                            0%, 100% { transform: translateY(0px) rotate(6deg); }
                            50% { transform: translateY(-10px) rotate(9deg); }
                        }
                        @keyframes pfPhoneScanMove {
                            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
                            45%, 60% { transform: translate(-18px, -10px) rotate(-3deg); }
                        }
                        @keyframes pfLaserSweep {
                            0%, 100% { transform: translateY(-38px); opacity: 0.35; }
                            50% { transform: translateY(42px); opacity: 1; }
                        }
                        @keyframes pfBadgePop {
                            0%, 38%, 90%, 100% { transform: scale(0); opacity: 0; }
                            48%, 78% { transform: scale(1); opacity: 1; }
                        }
                    </style>

                    <!-- 1. ATTACHED PET-FOOD-KIBBLE-BAG.SVG -->
                    <g class="pf-kibble-float">
                        <!-- Top Brown Seal Strip (#d68b28) -->
                        <rect x="66" y="78" width="124" height="22" rx="5" fill="#d68b28"></rect>
                        <!-- Main Golden-Orange Bag Body (#f5b041) -->
                        <path fill="#f5b041" d="
                            M 66,100
                            L 190,100
                            L 216,148
                            L 216,342
                            A 14,14 0 0,1 202,356
                            L 54,356
                            A 14,14 0 0,1 40,342
                            L 40,148
                            Z"></path>
                        <!-- White Center Circle -->
                        <circle cx="128" cy="224" r="68" fill="#ffffff"></circle>
                        <!-- Dark Brown Paw Print (#595048) -->
                        <path fill="#595048" d="
                            M 102,246
                            C 96,246 92,238 96,230
                            C 100,224 108,224 112,216
                            C 116,206 140,206 144,216
                            C 148,224 156,224 160,230
                            C 164,238 160,246 154,246
                            C 142,252 114,252 102,246 Z"></path>
                        <ellipse cx="90" cy="210" rx="9.5" ry="13" transform="rotate(-28 90 210)" fill="#595048"></ellipse>
                        <ellipse cx="114" cy="192" rx="9.5" ry="14" transform="rotate(-10 114 192)" fill="#595048"></ellipse>
                        <ellipse cx="142" cy="192" rx="9.5" ry="14" transform="rotate(10 142 192)" fill="#595048"></ellipse>
                        <ellipse cx="166" cy="210" rx="9.5" ry="13" transform="rotate(28 166 210)" fill="#595048"></ellipse>
                        <!-- Bottom 2 White Lines -->
                        <line x1="76" y1="318" x2="180" y2="318" stroke="#ffffff" stroke-width="6" stroke-linecap="round"></line>
                        <line x1="76" y1="332" x2="180" y2="332" stroke="#ffffff" stroke-width="6" stroke-linecap="round"></line>
                    </g>

                    <!-- 2. ATTACHED PET-FOOD-PATE.SVG (Blue Fish Can) -->
                    <g class="pf-pate-float">
                        <!-- Blue Tin Body (#009dff) -->
                        <rect x="176" y="232" width="154" height="106" fill="#009dff"></rect>
                        <!-- Top & Bottom Grey Metallic Rims (#999999) -->
                        <rect x="168" y="220" width="170" height="14" rx="7" fill="#999999"></rect>
                        <rect x="168" y="336" width="170" height="14" rx="7" fill="#999999"></rect>
                        <!-- White Fish Silhouette Facing Right -->
                        <path fill="#ffffff" d="
                            M 206,264
                            C 206,259 211,257 216,259
                            L 232,268
                            C 256,252 296,250 306,272
                            C 312,282 312,292 306,302
                            C 296,324 256,322 232,306
                            L 216,315
                            C 211,317 206,315 206,310
                            Z"></path>
                        <!-- Blue Fish Eye (#009dff) -->
                        <circle cx="288" cy="286" r="7" fill="#009dff"></circle>
                    </g>

                    <!-- 3. HAND WITH SMARTPHONE SCANNING THE PET FOOD PRODUCTS -->
                    <g class="pf-scanner-hand">
                        <g fill="#955830">
                            <rect x="292" y="142" width="45" height="22" rx="11" transform="rotate(35 314 153)"></rect>
                            <rect x="275" y="164" width="58" height="22" rx="11" transform="rotate(35 304 175)"></rect>
                            <rect x="260" y="186" width="66" height="22" rx="11" transform="rotate(35 293 197)"></rect>
                        </g>
                        <path fill="#955830" d="M 380,210 L 432,216 C 470,252 508,270 555,280 L 555,375 C 488,365 436,336 385,292 Z"></path>
                        <g transform="rotate(5 355 200)">
                            <rect x="294" y="88" width="122" height="214" rx="14" fill="#606362"></rect>
                            <rect x="300" y="95" width="110" height="200" rx="11" fill="#e1f3fe"></rect>
                            <rect x="314" y="122" width="82" height="90" rx="8" fill="#ffffff"></rect>
                            <g fill="#222222">
                                <rect x="325" y="140" width="4" height="44"></rect>
                                <rect x="333" y="140" width="8" height="44"></rect>
                                <rect x="345" y="140" width="3" height="44"></rect>
                                <rect x="352" y="140" width="6" height="44"></rect>
                                <rect x="362" y="140" width="10" height="44"></rect>
                                <rect x="376" y="140" width="3" height="44"></rect>
                                <rect x="383" y="140" width="5" height="44"></rect>
                            </g>
                            <rect class="pf-laser-line" x="304" y="162" width="102" height="3.5" rx="1.5" fill="#dc3522"></rect>
                            <g class="pf-scan-badge">
                                <rect x="320" y="232" width="70" height="26" rx="13" fill="#009a49"></rect>
                                <path d="M 346,245 L 352,251 L 365,239" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
                            </g>
                            <path fill="#606362" d="M 332,93 L 378,93 L 375,102 L 335,102 Z"></path>
                        </g>
                        <path fill="#955830" d="M 404,268 L 410,162 A 12,12 0 0,1 434,162 L 440,220 L 430,274 Z"></path>
                    </g>
                </svg>