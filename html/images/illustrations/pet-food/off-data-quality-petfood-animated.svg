<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-data-quality-petfood" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .dq-pf-lens {
                            animation: dqPfSweep 4.5s ease-in-out infinite;
                            transform-origin: 310px 210px;
                        }
                        .dq-pf-badge {
                            animation: dqPfPop 4.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
                            transform-origin: 432px 115px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes dqPfSweep {
                            0%, 100% { transform: translate(-45px, -25px) rotate(-6deg); }
                            50% { transform: translate(35px, 20px) rotate(6deg); }
                        }
                        @keyframes dqPfPop {
                            0%, 30%, 90%, 100% { transform: scale(0.85); }
                            50%, 75% { transform: scale(1.08); }
                        }
                    </style>

                    <!-- Left: Attached Checklist.svg Data Sheet -->
                    <g transform="translate(55, 58) rotate(-4)">
                        <rect x="0" y="14" width="185" height="250" rx="22" fill="#00bdf2"></rect>
                        <rect x="16" y="34" width="153" height="214" rx="14" fill="#ffffff"></rect>
                        <rect x="60" y="0" width="65" height="42" rx="10" fill="#aeaeae"></rect>
                        <circle cx="46" cy="78" r="10" fill="none" stroke="#0077c8" stroke-width="4"></circle>
                        <line x1="72" y1="78" x2="146" y2="78" stroke="#181818" stroke-width="5" stroke-linecap="round"></line>
                        <circle cx="46" cy="116" r="10" fill="none" stroke="#0077c8" stroke-width="4"></circle>
                        <line x1="72" y1="116" x2="146" y2="116" stroke="#181818" stroke-width="5" stroke-linecap="round"></line>
                        <circle cx="46" cy="154" r="10" fill="none" stroke="#0077c8" stroke-width="4"></circle>
                        <line x1="72" y1="154" x2="146" y2="154" stroke="#009a49" stroke-width="5" stroke-linecap="round"></line>
                        <circle cx="46" cy="192" r="10" fill="none" stroke="#0077c8" stroke-width="4"></circle>
                        <line x1="72" y1="192" x2="146" y2="192" stroke="#181818" stroke-width="5" stroke-linecap="round"></line>
                    </g>

                    <!-- Center-Right: Attached pet-food-kibble-bag.svg + pet-food-pate.svg -->
                    <g transform="translate(222, 96) rotate(4)">
                        <!-- Kibble Bag -->
                        <rect x="20" y="0" width="106" height="18" rx="4" fill="#d68b28"></rect>
                        <path fill="#f5b041" d="
                            M 20,18 L 126,18 L 148,58 L 148,216 A 12,12 0 0,1 136,228
                            L 10,228 A 12,12 0 0,1 -2,216 L -2,58 Z"></path>
                        <circle cx="73" cy="118" r="56" fill="#ffffff"></circle>
                        <!-- Paw Print -->
                        <path fill="#595048" d="
                            M 52,136 C 47,136 44,130 47,123 C 50,118 57,118 60,111
                            C 63,103 83,103 86,111 C 89,118 96,118 99,123
                            C 102,130 99,136 94,136 C 84,141 62,141 52,136 Z"></path>
                        <ellipse cx="42" cy="106" rx="8" ry="11" transform="rotate(-28 42 106)" fill="#595048"></ellipse>
                        <ellipse cx="62" cy="92" rx="8" ry="11.5" transform="rotate(-10 62 92)" fill="#595048"></ellipse>
                        <ellipse cx="84" cy="92" rx="8" ry="11.5" transform="rotate(10 84 92)" fill="#595048"></ellipse>
                        <ellipse cx="104" cy="106" rx="8" ry="11" transform="rotate(28 104 106)" fill="#595048"></ellipse>
                        <line x1="30" y1="195" x2="116" y2="195" stroke="#ffffff" stroke-width="5" stroke-linecap="round"></line>
                        <line x1="30" y1="207" x2="116" y2="207" stroke="#ffffff" stroke-width="5" stroke-linecap="round"></line>

                        <!-- Mini Pate Tin Can Overlapping Bottom-Right -->
                        <g transform="translate(88, 158) rotate(-8)">
                            <rect x="6" y="8" width="96" height="66" fill="#009dff"></rect>
                            <rect x="0" y="0" width="108" height="9" rx="4.5" fill="#999999"></rect>
                            <rect x="0" y="72" width="108" height="9" rx="4.5" fill="#999999"></rect>
                            <path fill="#ffffff" d="M 24,28 C 24,25 27,24 30,25 L 40,31 C 55,21 80,20 86,33 C 90,40 90,46 86,53 C 80,66 55,65 40,55 L 30,61 C 27,62 24,61 24,58 Z"></path>
                            <circle cx="75" cy="42" r="4.5" fill="#009dff"></circle>
                        </g>
                    </g>

                    <!-- Attached Green check.svg Quality Seal -->
                    <g class="dq-pf-badge">
                        <circle cx="430" cy="118" r="44" fill="#000000" opacity="0.1"></circle>
                        <circle cx="432" cy="115" r="42" fill="#0b7a3e"></circle>
                        <path d="M 412,116 L 426,130 L 454,102" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path>
                    </g>

                    <!-- Animated Magnifying Glass Inspecting Pet Food -->
                    <g class="dq-pf-lens">
                        <rect x="336" y="255" width="24" height="95" rx="12" transform="rotate(-38 348 302)" fill="#181818"></rect>
                        <circle cx="290" cy="215" r="64" fill="#ffffff" fill-opacity="0.35" stroke="#181818" stroke-width="16"></circle>
                        <path d="M 252,182 A 44,44 0 0,1 295,168" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"></path>
                    </g>
                </svg>