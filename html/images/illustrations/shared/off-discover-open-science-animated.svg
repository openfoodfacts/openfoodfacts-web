<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-discover-science" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .bar-grow-1 { animation: barPulse1 3.8s ease-in-out infinite; transform-origin: 250px 260px; }
                        .bar-grow-2 { animation: barPulse2 3.8s ease-in-out infinite 0.4s; transform-origin: 290px 260px; }
                        .bar-grow-3 { animation: barPulse1 3.8s ease-in-out infinite 0.8s; transform-origin: 330px 260px; }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes barPulse1 {
                            0%, 100% { transform: scaleY(1); }
                            50% { transform: scaleY(0.72); }
                        }
                        @keyframes barPulse2 {
                            0%, 100% { transform: scaleY(0.8); }
                            50% { transform: scaleY(1.1); }
                        }
                    </style>

                    <!-- Dashed Network Connection Lines -->
                    <line x1="120" y1="125" x2="280" y2="210" stroke="#00bdf2" stroke-width="5" stroke-dasharray="10 8"></line>
                    <line x1="120" y1="310" x2="280" y2="210" stroke="#009a49" stroke-width="5" stroke-dasharray="10 8"></line>
                    <line x1="445" y1="125" x2="280" y2="210" stroke="#ff6b35" stroke-width="5" stroke-dasharray="10 8"></line>
                    <line x1="445" y1="310" x2="280" y2="210" stroke="#f8c100" stroke-width="5" stroke-dasharray="10 8"></line>

                    <!-- Central Open Science Dashboard Card -->
                    <rect x="195" y="110" width="170" height="195" rx="22" fill="#181818"></rect>
                    <text x="280" y="142" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800" letter-spacing="1">OPEN DATA</text>
                    <rect class="bar-grow-1" x="225" y="175" width="24" height="85" rx="6" fill="#009a49"></rect>
                    <rect class="bar-grow-2" x="268" y="160" width="24" height="100" rx="6" fill="#00bdf2"></rect>
                    <rect class="bar-grow-3" x="311" y="190" width="24" height="70" rx="6" fill="#f8c100"></rect>
                    <rect x="215" y="268" width="130" height="8" rx="4" fill="#606362"></rect>

                    <!-- Node 1 (Top-Left): Mini Cereal Pack -->
                    <circle cx="105" cy="115" r="52" fill="#fff3ed"></circle>
                    <rect x="82" y="82" width="46" height="64" rx="6" fill="#ff6b35"></rect>
                    <path fill="#00bdf2" d="M 94,118 L 128,118 C 124,134 98,134 94,118 Z"></path>

                    <!-- Node 2 (Bottom-Left): Mini Green Bottle -->
                    <circle cx="105" cy="310" r="52" fill="#e8f8ef"></circle>
                    <path fill="#009a49" d="M 98,270 L 112,270 L 112,286 C 122,292 126,302 126,315 L 126,346 A 6,6 0 0,1 120,352 L 90,352 A 6,6 0 0,1 84,346 L 84,315 C 84,302 88,292 98,286 Z"></path>
                    <rect x="92" y="308" width="26" height="32" rx="4" fill="#ffffff"></rect>

                    <!-- Node 3 (Top-Right): Earth Globe -->
                    <circle cx="455" cy="115" r="48" fill="#6ae3ff"></circle>
                    <path fill="#009a49" d="M 435,78 C 455,88 442,115 425,118 A 48,48 0 0,1 435,78 Z"></path>
                    <path fill="#009a49" d="M 455,102 C 472,100 482,122 468,145 C 455,160 442,142 455,102 Z"></path>

                    <!-- Node 4 (Bottom-Right): Green Check Verified Research -->
                    <circle cx="455" cy="310" r="46" fill="#0b7a3e"></circle>
                    <path d="M 435,310 L 449,324 L 477,296" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>