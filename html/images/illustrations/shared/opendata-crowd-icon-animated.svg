<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-opendata-crowd-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" class="">
                    <style>
                        .crowd-sil {
                            animation: silBob 4.4s ease-in-out infinite;
                        }
                        .char-left-bob {
                            animation: charBob 4.4s ease-in-out infinite 0.2s;
                        }
                        .wave-left-arm {
                            animation: waveHello 2.8s ease-in-out infinite;
                            /* Circular shoulder socket hidden inside the red sleeve */
                            transform-origin: 44px 194px;
                        }
                        .char-center-bob {
                            animation: charBob 4.4s ease-in-out infinite 0.6s;
                        }
                        .char-right-bob {
                            animation: charBob 4.4s ease-in-out infinite 1.0s;
                        }
                        .od-heart {
                            animation: odHeartPulse 2.2s ease-in-out infinite;
                            transform-origin: 248px 236px;
                        }
                        .tablet-lift {
                            animation: tabletBob 4.4s ease-in-out infinite;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes silBob {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(-5px); }
                        }
                        @keyframes charBob {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(-4px); }
                        }
                        @keyframes waveHello {
                            0%, 100% { transform: rotate(0deg); }
                            50% { transform: rotate(7deg); }
                        }
                        @keyframes odHeartPulse {
                            0%, 100% { transform: scale(1); }
                            50% { transform: scale(1.13); }
                        }
                        @keyframes tabletBob {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(-4px); }
                        }
                    </style>

                    <!-- ========================================================= -->
                    <!-- BACKGROUND SILHOUETTE CROWD (#9d9d9c)                     -->
                    <!-- ========================================================= -->
                    <g class="crowd-sil" fill="#9d9d9c">
                        <circle cx="164" cy="116" r="42"></circle>
                        <path d="M 112,215 C 112,174 135,156 164,156 C 193,156 216,174 216,215 L 216,355 L 112,355 Z"></path>
                        <circle cx="316" cy="116" r="42"></circle>
                        <path d="M 264,215 C 264,174 287,156 316,156 C 345,156 368,174 368,215 L 368,355 L 264,355 Z"></path>
                    </g>

