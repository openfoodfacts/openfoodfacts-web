<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-community-building" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .highfive-left {
                            animation: clapLeft 3.4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
                            transform-origin: 210px 330px;
                        }
                        .highfive-right {
                            animation: clapRight 3.4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
                            transform-origin: 350px 330px;
                        }
                        .clap-rays {
                            animation: raysBurst 3.4s ease-out infinite;
                            transform-origin: 280px 88px;
                        }
                        .badge-orbit-1 { animation: orbitBob 3.4s ease-in-out infinite; }
                        .badge-orbit-2 { animation: orbitBob 3.4s ease-in-out infinite 0.5s; }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes clapLeft {
                            0%, 15%, 90%, 100% { transform: translate(-34px, 12px) rotate(-14deg); }
                            40%, 68% { transform: translate(0px, 0px) rotate(0deg); }
                        }
                        @keyframes clapRight {
                            0%, 15%, 90%, 100% { transform: translate(34px, 12px) rotate(14deg); }
                            40%, 68% { transform: translate(0px, 0px) rotate(0deg); }
                        }
                        @keyframes raysBurst {
                            0%, 34%, 78%, 100% { transform: scale(0.4); opacity: 0; }
                            44%, 62% { transform: scale(1.12); opacity: 1; }
                        }
                        @keyframes orbitBob {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(-9px); }
                        }
                    </style>

                    <!-- Soft Circular Community Backdrop -->
                    <circle cx="280" cy="225" r="145" fill="#e1f3fe" opacity="0.7"></circle>

                    <!-- Floating Community Avatars / Badges -->
                    <g class="badge-orbit-1">
                        <circle cx="102" cy="145" r="32" fill="#009a49"></circle>
                        <path d="M 90,146 L 98,154 L 115,137" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
                        <circle cx="458" cy="285" r="28" fill="#ff6b35"></circle>
                        <path fill="#ffffff" d="M 458,298 C 458,298 442,286 442,276 A 8,8 0 0,1 458,272 A 8,8 0 0,1 474,276 C 474,286 458,298 458,298 Z"></path>
                    </g>
                    <g class="badge-orbit-2">
                        <circle cx="452" cy="135" r="30" fill="#f8c100"></circle>
                        <text x="452" y="144" text-anchor="middle" fill="#181818" font-size="24" font-weight="800">★</text>
                        <circle cx="106" cy="295" r="26" fill="#00bdf2"></circle>
                        <circle cx="106" cy="288" r="7" fill="#ffffff"></circle>
                        <path fill="#ffffff" d="M 92,308 C 92,298 120,298 120,308 Z"></path>
                    </g>

                    <!-- ATTACHED HIGH-FIVE.SVG RECONSTRUCTION -->
                    <!-- Top 3 Impact Rays inside White Sticker Halo -->
                    <g class="clap-rays">
                        <line x1="236" y1="92" x2="218" y2="68" stroke="#ffffff" stroke-width="22" stroke-linecap="round"></line>
                        <line x1="280" y1="82" x2="280" y2="52" stroke="#ffffff" stroke-width="22" stroke-linecap="round"></line>
                        <line x1="324" y1="92" x2="342" y2="68" stroke="#ffffff" stroke-width="22" stroke-linecap="round"></line>

                        <line x1="236" y1="92" x2="218" y2="68" stroke="#181818" stroke-width="8" stroke-linecap="round"></line>
                        <line x1="280" y1="82" x2="280" y2="52" stroke="#181818" stroke-width="8" stroke-linecap="round"></line>
                        <line x1="324" y1="92" x2="342" y2="68" stroke="#181818" stroke-width="8" stroke-linecap="round"></line>
                    </g>

                    <!-- Right Brown Hand (#955830) — 4 Fingers + Right Thumb -->
                    <g class="highfive-right">
                        <g transform="rotate(16 322 248)">
                            <!-- White Sticker Border -->
                            <path fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" d="
                                M 262,142 A 13,13 0 0,1 288,142 L 288,218 L 293,218
                                L 293,134 A 13,13 0 0,1 319,134 L 319,218 L 324,218
                                L 324,138 A 13,13 0 0,1 350,138 L 350,218 L 355,218
                                L 355,148 A 13,13 0 0,1 381,148 L 381,252
                                L 408,228 A 13,13 0 0,1 426,247 L 384,302
                                C 362,334 316,348 278,334
                                C 254,325 256,285 262,252 Z"></path>
                            <!-- Brown Hand Fill -->
                            <path fill="#955830" d="
                                M 262,142 A 13,13 0 0,1 288,142 L 288,218 L 293,218
                                L 293,134 A 13,13 0 0,1 319,134 L 319,218 L 324,218
                                L 324,138 A 13,13 0 0,1 350,138 L 350,218 L 355,218
                                L 355,148 A 13,13 0 0,1 381,148 L 381,252
                                L 408,228 A 13,13 0 0,1 426,247 L 384,302
                                C 362,334 316,348 278,334
                                C 254,325 256,285 262,252 Z"></path>
                        </g>
                    </g>

                    <!-- Left Peach Hand (#ffc68a) — 4 Fingers + Left Thumb (Overlaps in Front) -->
                    <g class="highfive-left">
                        <g transform="rotate(-14 238 248)">
                            <!-- White Sticker Border -->
                            <path fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" d="
                                M 298,142 A 13,13 0 0,0 272,142 L 272,218 L 267,218
                                L 267,134 A 13,13 0 0,0 241,134 L 241,218 L 236,218
                                L 236,138 A 13,13 0 0,0 210,138 L 210,218 L 205,218
                                L 205,148 A 13,13 0 0,0 179,148 L 179,252
                                L 152,228 A 13,13 0 0,0 134,247 L 176,302
                                C 198,334 244,348 282,334
                                C 306,325 304,285 298,252 Z"></path>
                            <!-- Peach Hand Fill -->
                            <path fill="#ffc68a" d="
                                M 298,142 A 13,13 0 0,0 272,142 L 272,218 L 267,218
                                L 267,134 A 13,13 0 0,0 241,134 L 241,218 L 236,218
                                L 236,138 A 13,13 0 0,0 210,138 L 210,218 L 205,218
                                L 205,148 A 13,13 0 0,0 179,148 L 179,252
                                L 152,228 A 13,13 0 0,0 134,247 L 176,302
                                C 198,334 244,348 282,334
                                C 306,325 304,285 298,252 Z"></path>
                        </g>
                    </g>
                </svg>