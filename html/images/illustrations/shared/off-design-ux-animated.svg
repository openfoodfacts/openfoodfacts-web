<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-skill-design" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .design-stylus-hand {
                            animation: stylusDraw 4.4s ease-in-out infinite;
                            transform-origin: 480px 320px;
                        }
                        .swatch-card {
                            animation: swatchFloat 4.4s ease-in-out infinite;
                        }
                        .bezier-handle {
                            animation: handlePulse 2.2s ease-in-out infinite;
                            transform-origin: 270px 160px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes stylusDraw {
                            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
                            35% { transform: translate(-48px, -24px) rotate(-5deg); }
                            70% { transform: translate(-18px, 16px) rotate(3deg); }
                        }
                        @keyframes swatchFloat {
                            0%, 100% { transform: translateY(0px) rotate(-4deg); }
                            50% { transform: translateY(-10px) rotate(-1deg); }
                        }
                        @keyframes handlePulse {
                            0%, 100% { transform: scale(1); }
                            50% { transform: scale(1.22); }
                        }
                    </style>

                    <!-- Artboard Canvas Frame -->
                    <rect x="135" y="54" width="270" height="310" rx="22" fill="#ffffff"></rect>
                    <rect x="147" y="66" width="246" height="286" rx="16" fill="#e1f3fe"></rect>

                    <!-- App Header Bar & Wireframe Blocks inside Artboard -->
                    <rect x="165" y="84" width="210" height="34" rx="10" fill="#00bdf2"></rect>
                    <circle cx="184" cy="101" r="8" fill="#ffffff"></circle>
                    <rect x="202" y="96" width="90" height="10" rx="5" fill="#ffffff"></rect>

                    <!-- Bezier Vector Curve & Anchor Nodes -->
                    <path d="M 180,225 C 215,135 325,135 360,225" fill="none" stroke="#ff6b35" stroke-width="5" stroke-dasharray="8 6" stroke-linecap="round"></path>
                    <line x1="215" y1="160" x2="325" y2="160" stroke="#009a49" stroke-width="3"></line>
                    <circle cx="215" cy="160" r="6" fill="#009a49"></circle>
                    <circle cx="325" cy="160" r="6" fill="#009a49"></circle>
                    <rect class="bezier-handle" x="261" y="151" width="18" height="18" rx="4" fill="#ffffff" stroke="#009a49" stroke-width="4"></rect>

                    <!-- UI Component Mockup Cards -->
                    <rect x="165" y="250" width="98" height="78" rx="12" fill="#ffffff"></rect>
                    <circle cx="214" cy="278" r="14" fill="#7fbc2b"></circle>
                    <rect x="182" y="302" width="64" height="10" rx="5" fill="#d9dada"></rect>

                    <rect x="277" y="250" width="98" height="78" rx="12" fill="#ffffff"></rect>
                    <circle cx="326" cy="278" r="14" fill="#f8c100"></circle>
                    <rect x="294" y="302" width="64" height="10" rx="5" fill="#d9dada"></rect>

                    <!-- Floating Color Swatch Palette (Left) -->
                    <g class="swatch-card">
                        <rect x="48" y="110" width="116" height="168" rx="18" fill="#181818"></rect>
                        <rect x="62" y="124" width="88" height="30" rx="8" fill="#ff6b35"></rect>
                        <rect x="62" y="162" width="88" height="30" rx="8" fill="#009a49"></rect>
                        <rect x="62" y="200" width="88" height="30" rx="8" fill="#00bdf2"></rect>
                        <rect x="62" y="238" width="88" height="26" rx="8" fill="#f8c100"></rect>
                    </g>

                    <!-- Right Hand Holding Design Stylus (4 Fingers + Thumb) -->
                    <g class="design-stylus-hand">
                        <!-- Stylus Pen -->
                        <g transform="rotate(-35 355 215)">
                            <rect x="285" y="205" width="145" height="18" rx="9" fill="#606362"></rect>
                            <polygon points="285,205 262,214 285,223" fill="#ff6b35"></polygon>
                            <circle cx="264" cy="214" r="3.5" fill="#181818"></circle>
                        </g>

                        <!-- Peach Hand (#ffc68a) with 4 distinct fingers + thumb -->
                        <path fill="#ffc68a" d="
                            M 548,295
                            C 492,282 448,262 412,232
                            L 382,208 C 374,202 365,212 373,220
                            L 395,240
                            L 336,192 A 8,8 0 0,0 326,204 L 368,238 L 366,241
                            L 322,206 A 8,8 0 0,0 312,218 L 360,256 L 358,259
                            L 320,228 A 8,8 0 0,0 310,240 L 356,277 L 354,280
                            L 324,256 A 8,8 0 0,0 314,268 L 382,322
                            C 432,358 488,376 548,384 Z"></path>
                    </g>
                </svg>