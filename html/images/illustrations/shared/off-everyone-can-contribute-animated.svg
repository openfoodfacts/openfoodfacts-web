<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-everyone-puzzle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" class="">
                    <style>
                        .off-top-hand {
                            animation: topHandSnap 4.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
                            transform-origin: 240px 90px;
                        }
                        .off-right-hand {
                            animation: rightHandSnap 4.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
                            transform-origin: 500px 260px;
                        }
                        .off-board-pulse {
                            animation: boardBounce 4.4s ease-in-out infinite;
                            transform-origin: 280px 280px;
                        }
                        svg.paused * {
                            animation-play-state: paused !important;
                        }
                        @keyframes topHandSnap {
                            0%, 12% { transform: translate(0px, 0px) rotate(-3deg); }
                            42%, 74% { transform: translate(6px, 72px) rotate(0deg); }
                            92%, 100% { transform: translate(0px, 0px) rotate(-3deg); }
                        }
                        @keyframes rightHandSnap {
                            0%, 15% { transform: translate(0px, 0px) rotate(4deg); }
                            45%, 74% { transform: translate(-74px, -18px) rotate(0deg); }
                            92%, 100% { transform: translate(0px, 0px) rotate(4deg); }
                        }
                        @keyframes boardBounce {
                            0%, 42%, 100% { transform: scale(1); }
                            48% { transform: scale(1.02); }
                        }
                    </style>

                    <!-- Assembled 6-Piece Base Cluster (Matches attached puzzle.svg colors) -->
                    <g class="off-board-pulse">
