<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-make-local" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .globe-spin {
                            animation: globePulse 5s ease-in-out infinite;
                            transform-origin: 280px 215px;
                        }
                        .lang-1 { animation: bubbleFloat1 4s ease-in-out infinite; }
                        .lang-2 { animation: bubbleFloat2 4s ease-in-out infinite 0.6s; }
                        .lang-3 { animation: bubbleFloat1 4s ease-in-out infinite 1.2s; }
                        .lang-4 { animation: bubbleFloat2 4s ease-in-out infinite 1.8s; }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes globePulse {
                            0%, 100% { transform: scale(1) rotate(-2deg); }
                            50% { transform: scale(1.03) rotate(2deg); }
                        }
                        @keyframes bubbleFloat1 {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(-10px); }
                        }
                        @keyframes bubbleFloat2 {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(9px); }
                        }
                    </style>

                    <!-- Flat Cyan Earth Globe (#00bdf2) & Green Continents (#009a49) -->
                    <g class="globe-spin">
                        <circle cx="280" cy="215" r="118" fill="#00bdf2"></circle>
                        <!-- Flat Geometric Continents -->
                        <path fill="#009a49" d="
                            M 215,135 C 245,128 270,145 262,175 C 254,200 220,210 202,190 C 185,172 195,142 215,135 Z"></path>
                        <path fill="#009a49" d="
                            M 295,165 C 335,155 368,185 358,232 C 348,274 308,295 282,272 C 262,254 268,175 295,165 Z"></path>
                        <path fill="#7fbc2b" d="
                            M 215,245 C 235,242 252,265 242,295 C 232,315 205,308 202,282 C 198,260 202,248 215,245 Z"></path>
                    </g>

                    <!-- Language Bubble 1: Orange (#ff6b35) -->
                    <g class="lang-1">
                        <rect x="65" y="78" width="142" height="58" rx="16" fill="#ff6b35"></rect>
                        <polygon points="165,136 188,136 182,154" fill="#ff6b35"></polygon>
                        <text x="136" y="114" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">BIO • ORG</text>
                    </g>

                    <!-- Language Bubble 2: Golden Yellow (#f8c100) -->
                    <g class="lang-2">
                        <rect x="355" y="72" width="145" height="58" rx="16" fill="#f8c100"></rect>
                        <polygon points="375,130 398,130 370,148" fill="#f8c100"></polygon>
                        <text x="427" y="108" text-anchor="middle" fill="#181818" font-size="22" font-weight="800">文 → A</text>
                    </g>

                    <!-- Language Bubble 3: Crimson (#dc3522) -->
                    <g class="lang-3">
                        <rect x="60" y="274" width="148" height="58" rx="16" fill="#dc3522"></rect>
                        <polygon points="172,274 192,274 186,256" fill="#dc3522"></polygon>
                        <text x="134" y="310" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="800">FR • ES • DE</text>
                    </g>

                    <!-- Language Bubble 4: Dark Green (#1c8e47) -->
                    <g class="lang-4">
                        <rect x="352" y="280" width="148" height="58" rx="16" fill="#1c8e47"></rect>
                        <polygon points="372,280 394,280 368,262" fill="#1c8e47"></polygon>
                        <text x="426" y="316" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="800">العربية • 日本</text>
                    </g>
                </svg>