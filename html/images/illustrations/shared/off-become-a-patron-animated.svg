<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-patron-support" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .heart-beat {
                            animation: heartFloatPulse 3.6s ease-in-out infinite;
                            transform-origin: 280px 155px;
                        }
                        .coin-float-left {
                            animation: coinBob 3.6s ease-in-out infinite 0.3s;
                        }
                        .coin-float-right {
                            animation: coinBob 3.6s ease-in-out infinite 0.9s;
                        }
                        .support-left {
                            animation: liftLeft 3.6s ease-in-out infinite;
                            transform-origin: 120px 360px;
                        }
                        .support-right {
                            animation: liftRight 3.6s ease-in-out infinite;
                            transform-origin: 440px 360px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes heartFloatPulse {
                            0%, 100% { transform: translateY(0px) scale(1); }
                            50% { transform: translateY(-10px) scale(1.05); }
                        }
                        @keyframes coinBob {
                            0%, 100% { transform: translateY(0px) rotate(-6deg); }
                            50% { transform: translateY(-12px) rotate(8deg); }
                        }
                        @keyframes liftLeft {
                            0%, 100% { transform: rotate(0deg) translateY(0px); }
                            50% { transform: rotate(-4deg) translateY(-6px); }
                        }
                        @keyframes liftRight {
                            0%, 100% { transform: rotate(0deg) translateY(0px); }
                            50% { transform: rotate(4deg) translateY(-6px); }
                        }
                    </style>

                    <!-- Floating Non-Profit Heart & Attached coin-euro.svg -->
                    <g class="heart-beat">
                        <circle cx="280" cy="155" r="84" fill="#f8c100" opacity="0.2"></circle>
                        <path fill="#ff5c6c" d="
                            M 280,224
                            C 280,224 196,170 196,116
                            C 196,86 220,65 248,65
                            C 264,65 274,74 280,86
                            C 286,74 296,65 312,65
                            C 340,65 364,86 364,116
                            C 364,170 280,224 280,224 Z"></path>
                    </g>

                    <!-- Attached coin-euro.svg (Left & Right Floating Coins) -->
                    <g class="coin-float-left" transform="translate(105, 86)">
                        <circle cx="42" cy="42" r="42" fill="#ffc412"></circle>
                        <circle cx="42" cy="42" r="31" fill="#d49619"></circle>
                        <path d="M 52,27 C 42,23 32,29 30,39 L 29,45 C 31,55 42,61 52,57" fill="none" stroke="#6c3c00" stroke-width="6.5" stroke-linecap="round"></path>
                        <line x1="23" y1="39" x2="48" y2="39" stroke="#6c3c00" stroke-width="5"></line>
                        <line x1="23" y1="46" x2="48" y2="46" stroke="#6c3c00" stroke-width="5"></line>
                        <path d="M 52,9 A 34,34 0 0,1 58,11" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"></path>
                        <path d="M 65,16 A 34,34 0 0,1 74,28" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"></path>
                    </g>

                    <g class="coin-float-right" transform="translate(375, 92) scale(0.88)">
                        <circle cx="42" cy="42" r="42" fill="#ffc412"></circle>
                        <circle cx="42" cy="42" r="31" fill="#d49619"></circle>
                        <path d="M 52,27 C 42,23 32,29 30,39 L 29,45 C 31,55 42,61 52,57" fill="none" stroke="#6c3c00" stroke-width="6.5" stroke-linecap="round"></path>
                        <line x1="23" y1="39" x2="48" y2="39" stroke="#6c3c00" stroke-width="5"></line>
                        <line x1="23" y1="46" x2="48" y2="46" stroke="#6c3c00" stroke-width="5"></line>
                        <path d="M 52,9 A 34,34 0 0,1 58,11" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"></path>
                        <path d="M 65,16 A 34,34 0 0,1 74,28" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"></path>
                    </g>

                    <!-- Left Cupped Hand (#ffc68a) — Fixed: 1 Thumb + 4 Parallel Fingers -->
                    <g class="support-left">
                        <path fill="#ffc68a" d="
                            M 32,378
                            C 76,342 114,306 144,260
                            L 164,232 C 171,223 184,231 178,242
                            L 164,268
                            L 222,226 A 8,8 0 0,1 232,239 L 186,272 L 188,275
                            L 238,239 A 8,8 0 0,1 248,252 L 194,290 L 196,293
                            L 244,259 A 8,8 0 0,1 254,272 L 200,310 L 202,313
                            L 242,285 A 8,8 0 0,1 252,298 L 192,340
                            C 152,366 106,392 66,410 Z"></path>
                    </g>

                    <!-- Right Cupped Hand (#955830) — Fixed: 1 Thumb + 4 Parallel Fingers -->
                    <g class="support-right">
                        <path fill="#955830" d="
                            M 528,378
                            C 484,342 446,306 416,260
                            L 396,232 C 389,223 376,231 382,242
                            L 396,268
                            L 338,226 A 8,8 0 0,0 328,239 L 374,272 L 372,275
                            L 322,239 A 8,8 0 0,0 312,252 L 366,290 L 364,293
                            L 316,259 A 8,8 0 0,0 306,272 L 360,310 L 358,313
                            L 318,285 A 8,8 0 0,0 308,298 L 368,340
                            C 408,366 454,392 494,410 Z"></path>
                    </g>
                </svg>