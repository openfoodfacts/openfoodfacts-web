<?xml version="1.0" encoding="UTF-8"?>
<svg id="puzzleSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" class="">
                <style>
                    /* Smooth 4-second looping assembly animation */
                    .anim-left-hand {
                        animation: snapLeft 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
                        transform-origin: center;
                    }
                    
                    .anim-bottom-hand {
                        animation: snapBottom 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
                        transform-origin: center;
                    }

                    .puzzle-cluster {
                        animation: clusterPulse 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
                        transform-origin: 330px 210px;
                    }

                    .snap-glow {
                        animation: glowFlash 4.2s ease-out infinite;
                        pointer-events: none;
                    }

                    /* Paused state toggle */
                    svg.paused .anim-left-hand,
                    svg.paused .anim-bottom-hand,
                    svg.paused .puzzle-cluster,
                    svg.paused .snap-glow {
                        animation-play-state: paused !important;
                    }

                    @keyframes snapLeft {
                        0%, 12% {
                            transform: translate(0px, 0px) rotate(3deg);
                        }
                        42%, 74% {
                            /* Moves right by 78px and levels out to lock cleanly into the grey piece socket */
                            transform: translate(78px, 0px) rotate(0deg);
                        }
                        90%, 100% {
                            transform: translate(0px, 0px) rotate(3deg);
                        }
                    }

                    @keyframes snapBottom {
                        0%, 16% {
                            transform: translate(0px, 0px) rotate(5deg);
                        }
                        46%, 74% {
                            /* Moves up by 74px and levels out to lock cleanly into the light-blue piece socket */
                            transform: translate(0px, -74px) rotate(0deg);
                        }
                        90%, 100% {
                            transform: translate(0px, 0px) rotate(5deg);
                        }
                    }

                    @keyframes clusterPulse {
                        0%, 43% {
                            transform: scale(1);
                        }
                        48% {
                            transform: scale(1.018);
                        }
                        55%, 100% {
                            transform: scale(1);
                        }
                    }

                    @keyframes glowFlash {
                        0%, 42% {
                            opacity: 0;
                        }
                        47% {
                            opacity: 0.75;
                        }
                        62%, 100% {
                            opacity: 0;
                        }
                    }
                </style>

                <defs>
