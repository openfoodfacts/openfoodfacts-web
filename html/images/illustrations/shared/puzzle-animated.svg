                    <path fill="#ff8f7d" d="
                        M 38,190 
                        L 55,190 C 52,214 92,214 89,190 L 106,190 
                        A 16,16 0 0,1 122,206 
                        L 122,223 C 146,220 146,260 122,257 L 122,274 
                        A 16,16 0 0,1 106,290 
