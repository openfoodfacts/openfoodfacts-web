                        A 16,16 0 0,1 500,206 
                        L 500,223 C 476,220 476,260 500,257 L 500,274 
                        A 16,16 0 0,1 484,290 
                        L 467,290 C 470,314 430,314 433,290 L 416,290 
                        A 16,16 0 0,1 400,274 
                        L 400,257 C 424,260 424,220 400,223 L 400,206 
                        A 16,16 0 0,1 416,190 Z"></path>
                </defs>

                <!-- ========================================== -->
                <!-- MAIN CENTRAL 6-PIECE PUZZLE CLUSTER        -->
                <!-- ========================================== -->
                <g class="puzzle-cluster">
                    <!-- Bottom-Left Grey -->
                    <use href="#piece-bl-grey" fill="#d3d5d7"></use>
                    <!-- Top-Left Yellow -->
                    <use href="#piece-tl-yellow" fill="#f3be00"></use>
                    <!-- Bottom-Middle Light Blue -->
                    <use href="#piece-bm-blue" fill="#bce3fa"></use>
                    <!-- Bottom-Right Salmon -->
                    <use href="#piece-br-salmon" fill="#ff8f7d"></use>
                    <!-- Top-Right Grey -->
                    <use href="#piece-tr-grey" fill="#d3d5d7"></use>
                    <!-- Top-Middle Green (Rendered on top so its tabs overlap cleanly) -->
                    <use href="#piece-tm-green" fill="#28c96f"></use>

                    <!-- Subtle Connection Highlight Lines when pieces lock in -->
                    <circle cx="200" cy="240" r="26" fill="none" stroke="#ff8f7d" stroke-width="3" opacity="0" class="snap-glow"></circle>
                    <circle cx="350" cy="290" r="26" fill="none" stroke="#f3be00" stroke-width="3" opacity="0" class="snap-glow"></circle>
                </g>

