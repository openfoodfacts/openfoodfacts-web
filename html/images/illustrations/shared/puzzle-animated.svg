                        L 233,90 C 230,114 270,114 267,90 L 284,90 
                        A 16,16 0 0,1 300,106 
                        L 300,123 C 324,120 324,160 300,157 L 300,174 
                        A 16,16 0 0,1 284,190 
                        L 267,190 C 270,166 230,166 233,190 L 216,190 
                        A 16,16 0 0,1 200,174 
                        L 200,157 C 176,160 176,120 200,123 L 200,106 
