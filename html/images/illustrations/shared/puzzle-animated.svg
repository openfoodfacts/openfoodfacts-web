                        L 87,204
                        L 87,258
                        A 9.5,9.5 0 0,0 106,258
                        L 106,170
                        L 121,183
                        C 127,188 134,182 129,174
                        L 101,142
                        C 103,95 118,45 156,0
                        Z"></path>
                </g>

