<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-science-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" width="380" height="280" class="max-w-[420px]">
                    <style>
                        .sci-bar {
                            transform-box: fill-box;
                            transform-origin: bottom center;
                            animation: barWave 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
                        }
                        .b1  { animation-delay: 0.00s; } .b2  { animation-delay: 0.06s; }
                        .b3  { animation-delay: 0.12s; } .b4  { animation-delay: 0.18s; }
                        .b5  { animation-delay: 0.24s; } .b6  { animation-delay: 0.30s; }
                        .b7  { animation-delay: 0.36s; } .b8  { animation-delay: 0.42s; }
                        .b9  { animation-delay: 0.48s; } .b10 { animation-delay: 0.54s; }
                        .b11 { animation-delay: 0.60s; } .b12 { animation-delay: 0.66s; }
                        .b13 { animation-delay: 0.72s; } .b14 { animation-delay: 0.78s; }
                        .b15 { animation-delay: 0.84s; } .b16 { animation-delay: 0.90s; }
                        .b17 { animation-delay: 0.96s; } .b18 { animation-delay: 1.02s; }
                        .b19 { animation-delay: 1.08s; } .b20 { animation-delay: 1.14s; }
                        .b21 { animation-delay: 1.20s; } .b22 { animation-delay: 1.26s; }
                        .b23 { animation-delay: 1.32s; } .b24 { animation-delay: 1.38s; }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes barWave {
                            0%, 100% { transform: scaleY(1); }
                            30% { transform: scaleY(0.18); }
                            65% { transform: scaleY(1.06); }
                        }
                    </style>

                    <!-- 4 Horizontal Reference Grid Lines -->
                    <line x1="12" y1="32" x2="368" y2="32" stroke="#cccccc" stroke-width="1"></line>
                    <line x1="12" y1="112" x2="368" y2="112" stroke="#cccccc" stroke-width="1"></line>
                    <line x1="12" y1="192" x2="368" y2="192" stroke="#cccccc" stroke-width="1"></line>
                    <line x1="12" y1="272" x2="368" y2="272" stroke="#cccccc" stroke-width="1"></line>

                    <!-- 4 Green Bars (#00a600) -->
                    <rect class="sci-bar b1" x="14" y="261" width="12" height="11" fill="#00a600"></rect>
                    <rect class="sci-bar b2" x="28" y="236" width="12" height="36" fill="#00a600"></rect>
                    <rect class="sci-bar b3" x="42" y="214" width="12" height="58" fill="#00a600"></rect>
                    <rect class="sci-bar b4" x="57" y="214" width="12" height="58" fill="#00a600"></rect>

                    <!-- 6 Yellow Bars (#ffe500) -->
                    <rect class="sci-bar b5" x="71" y="264" width="12" height="8" fill="#ffe500"></rect>
                    <rect class="sci-bar b6" x="85" y="216" width="12" height="56" fill="#ffe500"></rect>
                    <rect class="sci-bar b7" x="100" y="233" width="12" height="39" fill="#ffe500"></rect>
                    <rect class="sci-bar b8" x="114" y="240" width="12" height="32" fill="#ffe500"></rect>
                    <rect class="sci-bar b9" x="128" y="240" width="12" height="32" fill="#ffe500"></rect>
                    <rect class="sci-bar b10" x="143" y="247" width="12" height="25" fill="#ffe500"></rect>

                    <!-- 7 Orange Bars (#ff7b00) -->
                    <rect class="sci-bar b11" x="157" y="253" width="12" height="19" fill="#ff7b00"></rect>
                    <rect class="sci-bar b12" x="171" y="261" width="12" height="11" fill="#ff7b00"></rect>
                    <rect class="sci-bar b13" x="185" y="266" width="12" height="6" fill="#ff7b00"></rect>
                    <rect class="sci-bar b14" x="200" y="257" width="12" height="15" fill="#ff7b00"></rect>
                    <rect class="sci-bar b15" x="214" y="231" width="12" height="41" fill="#ff7b00"></rect>
                    <rect class="sci-bar b16" x="228" y="192" width="12" height="80" fill="#ff7b00"></rect>
                    <rect class="sci-bar b17" x="242" y="118" width="12" height="154" fill="#ff7b00"></rect>

                    <!-- 5 Magenta Bars (#ff00d4) -->
                    <rect class="sci-bar b18" x="257" y="128" width="12" height="144" fill="#ff00d4"></rect>
                    <rect class="sci-bar b19" x="271" y="90" width="12" height="182" fill="#ff00d4"></rect>
                    <rect class="sci-bar b20" x="285" y="58" width="12" height="214" fill="#ff00d4"></rect>
                    <rect class="sci-bar b21" x="299" y="44" width="12" height="228" fill="#ff00d4"></rect>
                    <rect class="sci-bar b22" x="314" y="112" width="12" height="160" fill="#ff00d4"></rect>

                    <!-- 3 Red Bars (#ff0000) -->
                    <rect class="sci-bar b23" x="328" y="192" width="12" height="80" fill="#ff0000"></rect>
                    <rect class="sci-bar b24" x="342" y="216" width="12" height="56" fill="#ff0000"></rect>
                    <rect class="sci-bar b24" x="356" y="204" width="12" height="68" fill="#ff0000"></rect>
                </svg>