<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-expert-help" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .code-line-1 { animation: typeWidth1 3.6s steps(12) infinite; }
                        .code-line-2 { animation: typeWidth2 3.6s steps(12) infinite; }
                        .robot-bob {
                            animation: robotFloat 3.6s ease-in-out infinite;
                            transform-origin: 425px 125px;
                        }
                        .hand-left-type {
                            animation: leftType 0.9s ease-in-out infinite;
                            transform-origin: 185px 380px;
                        }
                        .hand-right-type {
                            animation: rightType 0.9s ease-in-out infinite 0.45s;
                            transform-origin: 375px 380px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes typeWidth1 {
                            0%, 10% { width: 20px; }
                            50%, 90% { width: 145px; }
                            100% { width: 20px; }
                        }
                        @keyframes typeWidth2 {
                            0%, 25% { width: 10px; }
                            65%, 90% { width: 115px; }
                            100% { width: 10px; }
                        }
                        @keyframes robotFloat {
                            0%, 100% { transform: translateY(0px) rotate(-3deg); }
                            50% { transform: translateY(-10px) rotate(4deg); }
                        }
                        @keyframes leftType {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(-7px); }
                        }
                        @keyframes rightType {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(-7px); }
                        }
                    </style>

                    <!-- Central Laptop / Code & Design Window -->
                    <rect x="110" y="76" width="310" height="205" rx="18" fill="#181818"></rect>
                    <rect x="124" y="92" width="282" height="173" rx="10" fill="#26292e"></rect>

                    <!-- Top Window Dots -->
                    <circle cx="142" cy="108" r="5.5" fill="#dc3522"></circle>
                    <circle cx="160" cy="108" r="5.5" fill="#f8c100"></circle>
                    <circle cx="178" cy="108" r="5.5" fill="#009a49"></circle>

                    <!-- Code Bracket & Animated Code Bars -->
                    <text x="142" y="152" fill="#00bdf2" font-family="monospace" font-weight="800" font-size="26">&lt;/&gt;</text>
                    <rect class="code-line-1" x="198" y="134" width="145" height="12" rx="6" fill="#7fbc2b"></rect>
                    <rect class="code-line-2" x="198" y="156" width="115" height="12" rx="6" fill="#f8c100"></rect>
                    <rect x="142" y="182" width="170" height="12" rx="6" fill="#ff6b35"></rect>
                    <rect x="142" y="204" width="128" height="12" rx="6" fill="#00bdf2"></rect>
                    <rect x="142" y="226" width="90" height="12" rx="6" fill="#d9dada"></rect>

                    <!-- Laptop Base -->
                    <path fill="#aeaeae" d="M 82,281 L 448,281 L 432,304 L 98,304 Z"></path>

                    <!-- Floating Robotoff AI Badge (Top Right) -->
                    <g class="robot-bob">
                        <!-- Antenna -->
                        <rect x="421" y="54" width="8" height="22" rx="4" fill="#606362"></rect>
                        <circle cx="425" cy="50" r="9" fill="#ff6b35"></circle>
                        <!-- Robot Head -->
                        <rect x="375" y="72" width="100" height="78" rx="22" fill="#00bdf2"></rect>
                        <rect x="390" y="90" width="70" height="32" rx="10" fill="#181818"></rect>
                        <!-- Glowing Eyes -->
                        <circle cx="408" cy="106" r="7" fill="#f8c100"></circle>
                        <circle cx="442" cy="106" r="7" fill="#f8c100"></circle>
                        <!-- Smile Bar -->
                        <rect x="408" y="132" width="34" height="6" rx="3" fill="#ffffff"></rect>
                    </g>

                    <!-- Left Typing Hand (Peach Tone #ffc68a, Seamless Finger Slits) -->
                    <g class="hand-left-type">
                        <path fill="#ffc68a" d="
                            M 118,415
                            L 138,342
                            L 138,292 A 7.5,7.5 0 0,1 153,292 L 153,330 L 156,330
                            L 156,286 A 7.5,7.5 0 0,1 171,286 L 171,330 L 174,330
                            L 174,286 A 7.5,7.5 0 0,1 189,286 L 189,330 L 192,330
                            L 192,292 A 7.5,7.5 0 0,1 207,292 L 207,340
                            L 222,324 C 229,317 238,325 231,334
                            L 207,365 L 195,415 Z"></path>
                    </g>

                    <!-- Right Typing Hand (Brown Tone #955830, Seamless Finger Slits) -->
                    <g class="hand-right-type">
                        <path fill="#955830" d="
                            M 342,415
                            L 330,365
                            L 306,334 C 299,325 308,317 315,324
                            L 330,340
                            L 330,292 A 7.5,7.5 0 0,1 345,292 L 345,330 L 348,330
                            L 348,286 A 7.5,7.5 0 0,1 363,286 L 363,330 L 366,330
                            L 366,286 A 7.5,7.5 0 0,1 381,286 L 381,330 L 384,330
                            L 384,292 A 7.5,7.5 0 0,1 399,292 L 399,342
                            L 419,415 Z"></path>
                    </g>
                </svg>