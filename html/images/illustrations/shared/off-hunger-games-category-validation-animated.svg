<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-complete-products" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .char-head {
                            animation: headThinkNod 4.6s ease-in-out infinite;
                            transform-origin: 155px 185px;
                        }
                        .char-chin-hand {
                            animation: chinStroke 4.6s ease-in-out infinite;
                            transform-origin: 175px 250px;
                        }
                        .brow-left {
                            animation: browRaise 4.6s ease-in-out infinite;
                            transform-origin: 125px 108px;
                        }
                        .card-float {
                            animation: cardHover 4.6s ease-in-out infinite;
                        }
                        .yes-btn-pulse {
                            animation: yesClick 4.6s ease-in-out infinite;
                            transform-origin: 454px 313px;
                        }
                        .green-check-badge {
                            animation: checkAppear 4.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
                            transform-origin: 495px 98px;
                        }
                        svg.paused * {
                            animation-play-state: paused !important;
                        }
                        @keyframes headThinkNod {
                            0%, 100% { transform: rotate(-2deg); }
                            45%, 75% { transform: rotate(3deg) translateY(2px); }
                        }
                        @keyframes chinStroke {
                            0%, 100% { transform: translate(0px, 0px); }
                            50% { transform: translate(-2px, -4px); }
                        }
                        @keyframes browRaise {
                            0%, 100% { transform: translateY(0px) rotate(0deg); }
                            50% { transform: translateY(-4px) rotate(-5deg); }
                        }
                        @keyframes cardHover {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(-6px); }
                        }
                        @keyframes yesClick {
                            0%, 40%, 85%, 100% { transform: scale(1); }
                            48%, 72% { transform: scale(1.09); }
                        }
                        @keyframes checkAppear {
                            0%, 44%, 88%, 100% { transform: scale(0) rotate(-25deg); opacity: 0; }
                            54%, 78% { transform: scale(1) rotate(0deg); opacity: 1; }
                        }
                    </style>

                    <!-- 1. ATTACHED SKEPTIC CHARACTER MAN -->
                    <g transform="translate(-12, 0)">
                        <!-- Neck -->
                        <rect x="142" y="172" width="48" height="44" fill="#c89d7c"></rect>

                        <!-- Black T-Shirt Torso & Sleeves (#181818) -->
                        <path fill="#181818" d="
                            M 95,198
                            C 122,190 208,190 236,198
                            C 262,206 276,245 284,298
                            L 252,298 L 252,400 L 78,400 L 78,298 L 46,298
                            C 54,245 68,206 95,198 Z"></path>

                        <!-- Right Hand Fingers Gripping Left Bicep -->
                        <g fill="#c89d7c">
                            <rect x="234" y="255" width="24" height="8.5" rx="4.2" transform="rotate(-36 246 259)"></rect>
                            <rect x="240" y="264" width="24" height="8.5" rx="4.2" transform="rotate(-36 252 268)"></rect>
                            <rect x="246" y="273" width="24" height="8.5" rx="4.2" transform="rotate(-36 258 277)"></rect>
                        </g>

                        <!-- Lower Crossed Left Arm -->
                        <path fill="#dab396" d="
                            M 49,298
                            L 92,298
                            C 98,322 145,320 218,278
                            L 236,314
                            C 162,364 82,366 56,338
                            C 48,328 47,312 49,298 Z"></path>

                        <!-- Animated Head Group -->
                        <g class="char-head">
                            <ellipse cx="165" cy="122" rx="64" ry="68" fill="#dab396"></ellipse>
                            <circle cx="228" cy="130" r="16" fill="#dab396"></circle>
                            <!-- Auburn Hair (#b96537) -->
                            <path fill="#b96537" d="
                                M 102,110
                                C 96,74 125,44 156,52
                                C 176,38 225,52 234,92
                                C 238,108 234,118 228,118
                                L 220,118 L 220,106
                                C 194,102 168,88 156,70
                                C 148,92 126,105 102,110 Z"></path>
                            <!-- Eyebrows (#a35229) -->
                            <path class="brow-left" d="M 122,107 C 130,107 140,103 145,99" fill="none" stroke="#a35229" stroke-width="5.5" stroke-linecap="round"></path>
                            <path d="M 176,105 C 184,101 194,100 202,101" fill="none" stroke="#a35229" stroke-width="5.5" stroke-linecap="round"></path>
                            <!-- Eyes -->
                            <circle cx="135" cy="120" r="5.5" fill="#0d0d0d"></circle>
                            <circle cx="188" cy="122" r="5.5" fill="#0d0d0d"></circle>
                            <!-- Thinking Frown Mouth -->
                            <path d="M 153,152 C 160,145 170,145 176,152" fill="none" stroke="#0d0d0d" stroke-width="5.5" stroke-linecap="round"></path>
                        </g>

                        <!-- Upper Arm + Hand on Chin (4 Fingers + Thumb) -->
                        <g class="char-chin-hand">
                            <path fill="#dab396" d="
                                M 132,166
                                A 5.5,5.5 0 0,1 132,177 L 145,177 L 145,179.5
                                L 130,179.5 A 5.5,5.5 0 0,1 130,190.5 L 145,190.5 L 145,193
                                L 130,193 A 5.5,5.5 0 0,1 130,204 L 145,204 L 145,206.5
                                L 132,206.5 A 5.5,5.5 0 0,1 132,217.5 L 168,223
                                L 218,332
                                C 232,354 272,344 274,312
                                L 194,185
                                L 206,170 C 211,163 202,155 195,162
                                L 182,175 Z"></path>
                        </g>
                    </g>

                    <!-- 2. HUNGER GAMES — BREAKFAST CEREALS CATEGORY YES/NO CARD -->
                    <g class="card-float">
                        <!-- Card Drop Background -->
                        <rect x="288" y="64" width="242" height="292" rx="22" fill="#e6e8ec" opacity="0.45"></rect>
                        <rect x="284" y="58" width="242" height="292" rx="22" fill="#ffffff"></rect>

                        <!-- Product Display Area Featuring Attached "CRISPY" Cereal Pack -->
                        <rect x="304" y="76" width="202" height="136" rx="14" fill="#fff3ed"></rect>

                        <!-- Mini Attached Cereal Pack.svg inside the card -->
                        <g transform="translate(362, 84) rotate(-5)">
                            <path fill="#ff6b35" d="M 8,6 L 78,6 A 6,6 0 0,1 84,12 L 84,78 C 84,88 66,92 58,100 C 50,108 60,118 44,122 C 28,125 16,118 8,122 L 2,12 A 6,6 0 0,1 8,6 Z"></path>
                            <text x="15" y="34" fill="#d95326" font-family="Inter, sans-serif" font-weight="800" font-size="17">CRISPY</text>
                            <path fill="#bfc3c6" d="M 48,14 A 3.5,3.5 0 0,1 54,12 L 66,44 A 10,10 0 1,1 56,48 Z"></path>
                            <path fill="#00bdf2" d="M 36,62 L 84,62 L 84,88 C 72,104 42,102 36,62 Z"></path>
                            <ellipse cx="18" cy="48" rx="5" ry="2.5" transform="rotate(-25 18 48)" fill="#f8c100"></ellipse>
                            <ellipse cx="26" cy="68" rx="5" ry="2.5" transform="rotate(35 26 68)" fill="#f8c100"></ellipse>
                            <ellipse cx="18" cy="92" rx="5" ry="2.5" transform="rotate(-45 18 92)" fill="#f8c100"></ellipse>
                            <ellipse cx="28" cy="110" rx="5" ry="2.5" transform="rotate(20 28 110)" fill="#f8c100"></ellipse>
                        </g>

                        <!-- Category Question Prompt Pill -->
                        <text x="405" y="234" text-anchor="middle" fill="#64748b" font-size="11" font-weight="700" letter-spacing="0.6">BELONGS TO CATEGORY?</text>
                        <rect x="304" y="244" width="202" height="36" rx="10" fill="#e1f3fe"></rect>
                        <text x="405" y="267" text-anchor="middle" fill="#0d0d0d" font-size="15" font-weight="800">🥣 Breakfast cereals</text>

                        <!-- NO / YES Validation Buttons -->
                        <rect x="304" y="294" width="94" height="38" rx="11" fill="#fee2e2"></rect>
                        <text x="351" y="318" text-anchor="middle" fill="#dc3522" font-size="14" font-weight="800">✕ NO</text>

                        <g class="yes-btn-pulse">
                            <rect x="408" y="294" width="98" height="38" rx="11" fill="#0b7a3e"></rect>
                            <text x="457" y="318" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">✓ YES</text>
                        </g>

                        <!-- Attached Green check.svg Floating Validation Badge -->
                        <g class="green-check-badge">
                            <circle cx="493" cy="101" r="26" fill="#000000" opacity="0.12"></circle>
                            <circle cx="495" cy="98" r="25" fill="#0b7a3e"></circle>
                            <path d="M 483,99 L 491,107 L 508,90" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"></path>
                        </g>
                    </g>
                </svg>