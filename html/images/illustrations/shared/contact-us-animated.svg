<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-contact-us" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" class="max-w-[400px]">
                    <style>
                        .contact-heart {
                            animation: heartBeatContact 3.6s ease-in-out infinite;
                            transform-origin: 90px 28px;
                        }
                        .line-draw-3 {
                            animation: drawThirdLine 3.6s ease-in-out infinite;
                        }
                        .pencil-write {
                            animation: pencilMove 3.6s ease-in-out infinite;
                            transform-origin: 220px 155px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes heartBeatContact {
                            0%, 100% { transform: scale(1); }
                            50% { transform: scale(1.12) translateY(-2px); }
                        }
                        @keyframes drawThirdLine {
                            0%, 12% { width: 45px; }
                            55%, 85% { width: 166px; }
                            100% { width: 45px; }
                        }
                        @keyframes pencilMove {
                            0%, 12% { transform: translateX(-120px) rotate(-4deg); }
                            28% { transform: translateX(-60px) translateY(-5px) rotate(2deg); }
                            55%, 85% { transform: translateX(0px) rotate(0deg); }
                            100% { transform: translateX(-120px) rotate(-4deg); }
                        }
                    </style>

                    <!-- Top-Left Pink Heart with Subtle Grey Drop Shadow -->
                    <g class="contact-heart">
                        <path fill="#e2e2e2" d="M 89,50 C 89,50 65,30 65,17 C 65,9 72,4 80,4 C 85,4 88,7 89,10 C 91,7 94,4 99,4 C 107,4 114,9 114,17 C 114,30 89,50 89,50 Z" transform="translate(-2, 2)"></path>
                        <path fill="#ff6270" d="M 90,48 C 90,48 67,29 67,17 C 67,9 74,4 81,4 C 86,4 89,7 90,10 C 92,7 95,4 100,4 C 107,4 114,9 114,17 C 114,29 90,48 90,48 Z"></path>
                    </g>

                    <!-- 3 Rounded Grey Message Lines (#b1b1b1) -->
                    <rect x="41" y="82" width="238" height="8" rx="4" fill="#b1b1b1"></rect>
                    <rect x="41" y="117" width="238" height="8" rx="4" fill="#b1b1b1"></rect>
                    <rect class="line-draw-3" x="41" y="152" width="166" height="8" rx="4" fill="#b1b1b1"></rect>

                    <!-- Striped Blue Pencil (#49a6ff & #0062cc) -->
                    <g class="pencil-write">
                        <g transform="rotate(18 242 82)">
                            <!-- Pencil Cone Tip (#ffc88a) & Graphite Nib (#333333) -->
                            <polygon points="224,126 260,126 242,162" fill="#ffc88a"></polygon>
                            <path fill="#333333" d="M 235,148 L 249,148 L 244,158 C 243,161 241,161 240,158 Z"></path>
                            <!-- 4 Vertical Blue Stripes -->
                            <path fill="#49a6ff" d="M 224,8 C 224,3 228,0 233,0 L 233,126 L 224,126 Z"></path>
                            <rect x="233" y="0" width="9" height="126" fill="#0062cc"></rect>
                            <rect x="242" y="0" width="9" height="126" fill="#49a6ff"></rect>
                            <path fill="#0062cc" d="M 251,0 L 252,0 C 257,0 260,3 260,8 L 260,126 L 251,126 Z"></path>
                        </g>
                    </g>
                </svg>