<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-lets-talk" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .megaphone-rig {
                            animation: megaTilt 3.8s ease-in-out infinite;
                            transform-origin: 180px 260px;
                        }
                        .chat-pop-1 {
                            animation: chatEmit1 3.8s ease-out infinite;
                            transform-origin: 340px 140px;
                        }
                        .chat-pop-2 {
                            animation: chatEmit2 3.8s ease-out infinite 0.5s;
                            transform-origin: 410px 235px;
                        }
                        .chat-pop-3 {
                            animation: chatEmit3 3.8s ease-out infinite 1s;
                            transform-origin: 355px 315px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes megaTilt {
                            0%, 100% { transform: rotate(0deg); }
                            30% { transform: rotate(-6deg) translateY(-4px); }
                            65% { transform: rotate(2deg); }
                        }
                        @keyframes chatEmit1 {
                            0%, 15% { transform: translate(-40px, 20px) scale(0.7); opacity: 0; }
                            35%, 80% { transform: translate(0px, 0px) scale(1); opacity: 1; }
                            95%, 100% { transform: translate(15px, -10px) scale(0.9); opacity: 0; }
                        }
                        @keyframes chatEmit2 {
                            0%, 15% { transform: translate(-45px, 0px) scale(0.7); opacity: 0; }
                            35%, 80% { transform: translate(0px, 0px) scale(1); opacity: 1; }
                            95%, 100% { transform: translate(18px, 0px) scale(0.9); opacity: 0; }
                        }
                        @keyframes chatEmit3 {
                            0%, 15% { transform: translate(-35px, -20px) scale(0.7); opacity: 0; }
                            35%, 80% { transform: translate(0px, 0px) scale(1); opacity: 1; }
                            95%, 100% { transform: translate(15px, 12px) scale(0.9); opacity: 0; }
                        }
                    </style>

                    <!-- Animated Megaphone & Hand Group -->
                    <g class="megaphone-rig">
                        <!-- Megaphone Handle -->
                        <rect x="132" y="220" width="28" height="94" rx="10" transform="rotate(-12 146 267)" fill="#606362"></rect>

                        <!-- Left Hand Gripping Megaphone Handle (#dab396) — 4 Fingers + Upper Thumb -->
                        <path fill="#dab396" d="
                            M 18,358
                            C 58,318 92,288 118,255
                            L 132,235 C 138,226 150,233 144,243
                            L 135,256
                            L 168,254 A 7,7 0 0,1 168,268 L 138,270 L 138,273
                            L 171,271 A 7,7 0 0,1 171,285 L 139,287 L 139,290
                            L 170,288 A 7,7 0 0,1 170,302 L 140,304 L 140,307
                            L 166,305 A 7,7 0 0,1 166,319 L 128,323
                            C 96,356 62,385 18,408 Z"></path>

                        <!-- Megaphone Cone (#ff6b35 & #f8c100) -->
                        <g transform="rotate(-14 185 205)">
                            <path fill="#ff6b35" d="M 108,185 L 258,125 L 258,275 L 108,225 Z"></path>
                            <rect x="92" y="182" width="22" height="46" rx="8" fill="#dc3522"></rect>
                            <rect x="252" y="118" width="18" height="164" rx="9" fill="#f8c100"></rect>
                        </g>
                    </g>

                    <!-- Emitted Slack / Community Chat Bubbles -->
                    <g class="chat-pop-1">
                        <rect x="305" y="74" width="165" height="64" rx="18" fill="#00bdf2"></rect>
                        <polygon points="325,138 348,138 316,156" fill="#00bdf2"></polygon>
                        <text x="387" y="114" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">#general 💬</text>
                    </g>

                    <g class="chat-pop-2">
                        <rect x="355" y="178" width="168" height="64" rx="18" fill="#009a49"></rect>
                        <polygon points="375,242 398,242 365,258" fill="#009a49"></polygon>
                        <rect x="378" y="198" width="95" height="10" rx="5" fill="#ffffff"></rect>
                        <rect x="378" y="216" width="122" height="10" rx="5" fill="#7fbc2b"></rect>
                    </g>

                    <g class="chat-pop-3">
                        <rect x="310" y="282" width="150" height="58" rx="18" fill="#f8c100"></rect>
                        <polygon points="330,282 352,282 320,265" fill="#f8c100"></polygon>
                        <text x="385" y="318" text-anchor="middle" fill="#181818" font-size="19" font-weight="800">JOIN US ✨</text>
                    </g>
                </svg>