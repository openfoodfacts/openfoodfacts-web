<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-crowdsourcing-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360" class="">
                    <style>
                        .cs-left-arm {
                            animation: raisePhoneArm 4.2s ease-in-out infinite;
                            /* Pivot directly inside the rounded left shoulder socket */
                            transform-origin: 86px 194px;
                        }
                        .cs-left-head {
                            animation: nodHeadLeft 4.2s ease-in-out infinite;
                            transform-origin: 145px 140px;
                        }
                        .cs-right-head {
                            animation: nodHeadRight 4.2s ease-in-out infinite;
                            transform-origin: 330px 140px;
                        }
                        .cs-scan-phone {
                            animation: scanTilt 4.2s ease-in-out infinite;
                            /* Pivot at the elbow/shoulder so the forearm never detaches from the sleeve */
                            transform-origin: 282px 236px;
                        }
                        .cs-bottle-hold {
                            animation: bottlePresent 4.2s ease-in-out infinite;
                            transform-origin: 374px 232px;
                        }
                        .cs-flash-beam {
                            animation: beamFlash 4.2s ease-out infinite;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes raisePhoneArm {
                            0%, 100% { transform: rotate(0deg); }
                            50% { transform: rotate(-4.5deg); }
                        }
                        @keyframes nodHeadLeft {
                            0%, 100% { transform: rotate(-1.5deg); }
                            50% { transform: rotate(2deg); }
                        }
                        @keyframes nodHeadRight {
                            0%, 100% { transform: rotate(1.5deg); }
                            50% { transform: rotate(-2deg) translateY(2px); }
                        }
                        @keyframes scanTilt {
                            0%, 100% { transform: rotate(0deg); }
                            45%, 65% { transform: rotate(-4deg); }
                        }
                        @keyframes bottlePresent {
                            0%, 100% { transform: rotate(0deg); }
                            45%, 65% { transform: rotate(-4deg); }
                        }
                        @keyframes beamFlash {
                            0%, 38%, 78%, 100% { opacity: 0; }
                            48%, 62% { opacity: 0.55; }
                        }
                    </style>

                    <!-- ========================================================= -->
                    <!-- LEFT CHARACTER: "Perso Yes We Scan.svg" HOLDING PHONE UP  -->
                    <!-- ========================================================= -->
                    <g>
                        <!-- 1. Raised Left Arm (Pivots cleanly from inside the left sleeve) -->
                        <g class="cs-left-arm">
                            <!-- Smooth Peach Arm (#ffd8b4) with rounded shoulder socket at (86,194) -->
                            <path fill="#ffd8b4" d="
                                M 86,210
                                C 50,206 36,174 36,114
                                L 64,114
                                C 64,158 72,178 96,180
                                A 15,15 0 0,1 86,210 Z"></path>

                            <!-- Smartphone Held Upright Showing Red/Brown Bottle on Screen -->
                            <g transform="rotate(-7 50 74)">
                                <rect x="26" y="30" width="48" height="84" rx="7" fill="#222222"></rect>
                                <rect x="30" y="36" width="40" height="72" rx="4" fill="#d9dada"></rect>
                                <!-- Mini Soda Bottle Inside Screen -->
                                <rect x="45" y="45" width="10" height="7" rx="2" fill="#f02d0c"></rect>
                                <path fill="#6d4c41" d="M 39,58 C 39,53 43,51 47,51 L 53,51 C 57,51 61,53 61,58 L 61,94 C 61,98 57,100 53,100 L 47,100 C 43,100 39,98 39,94 Z"></path>
                                <rect x="39" y="65" width="22" height="20" fill="#ff5252"></rect>
                            </g>

                            <!-- Hand Gripping Phone Base (4 Fingers + Thumb in #ffd8b4) -->
                            <path fill="#ffd8b4" d="
                                M 34,104
                                A 3.5,3.5 0 0,1 41,104 L 41,116 L 43,116
                                L 43,103 A 3.5,3.5 0 0,1 50,103 L 50,116 L 52,116
                                L 52,103 A 3.5,3.5 0 0,1 59,103 L 59,116 L 61,116
                                L 61,105 A 3.5,3.5 0 0,1 68,105 L 68,120
                                L 75,112 C 78,108 83,113 79,118
                                L 66,130 L 36,128 Z"></path>
                        </g>

                        <!-- 2. Relaxed Right Arm Emerging From Under the Right Sleeve -->
                        <path fill="#ffd8b4" d="
                            M 192,208
                            L 218,208
                            L 226,312
                            A 3.5,3.5 0 0,1 219,312 L 219,292 L 217,292
                            L 217,313 A 3.5,3.5 0 0,1 210,313 L 210,292 L 208,292
                            L 208,313 A 3.5,3.5 0 0,1 201,313 L 201,292 L 199,292
                            L 199,311 A 3.5,3.5 0 0,1 192,311 L 192,284
                            L 184,292 C 181,295 177,291 180,287
                            L 192,270 Z"></path>

                        <!-- 3. Single Continuous Blue T-Shirt (Torso + Both Sleeves + Rounded Shoulders) -->
                        <path fill="#2374ab" d="
                            M 64,174
                            C 82,164 106,162 145,162
                            C 182,162 202,168 214,186
                            L 230,226
                            L 196,236
                            L 196,355
                            L 94,355
                            L 94,214
                            L 58,208 Z"></path>

                        <!-- Neck (#dfb595) with Rounded Collar Bottom Overlapping the T-Shirt Cleanly -->
                        <path fill="#dfb595" d="
                            M 131,132
                            L 159,132
                            L 159,165
                            A 14,15 0 0,1 131,165 Z"></path>

                        <!-- "Yes We Scan!" Text + White Barcode on Shirt -->
                        <text x="145" y="214" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="22" font-weight="500">Yes We</text>
                        <text x="145" y="244" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="29" font-weight="600" letter-spacing="1">Scan!</text>
                        <g fill="#ffffff">
                            <rect x="103" y="252" width="9" height="44"></rect>
                            <rect x="116" y="252" width="5" height="44"></rect>
                            <rect x="125" y="252" width="3" height="44"></rect>
                            <rect x="132" y="252" width="5" height="44"></rect>
                            <rect x="141" y="252" width="4" height="44"></rect>
                            <rect x="149" y="252" width="9" height="44"></rect>
                            <rect x="163" y="252" width="3" height="44"></rect>
                            <rect x="170" y="252" width="9" height="44"></rect>
                            <rect x="183" y="252" width="5" height="44"></rect>
                        </g>

                        <!-- 4. Head Group (Exact Unified Hair & Glasses from Perso Yes We Scan.svg) -->
                        <g class="cs-left-head">
                            <!-- Ears & Face Oval (#ffd8b4) -->
                            <circle cx="98" cy="102" r="12" fill="#ffd8b4"></circle>
                            <circle cx="192" cy="102" r="12" fill="#ffd8b4"></circle>
                            <ellipse cx="145" cy="98" rx="46" ry="48" fill="#ffd8b4"></ellipse>
                            <!-- Single Unified Center-Parted Hair Cap (#7b5840) -->
                            <path fill="#7b5840" d="
                                M 97,92
                                C 93,64 106,36 128,36
                                C 136,36 142,39 145,44
                                C 149,37 160,34 172,36
                                C 192,40 198,64 193,92
                                L 185,92
                                L 185,80
                                C 166,76 151,65 145,50
                                C 139,65 124,76 105,80
                                L 105,92 Z"></path>
                            <!-- Eyebrows -->
                            <path d="M 118,80 C 124,77 132,77 137,79" fill="none" stroke="#6d4c36" stroke-width="3.8" stroke-linecap="round"></path>
                            <path d="M 153,79 C 158,77 166,77 172,80" fill="none" stroke="#6d4c36" stroke-width="3.8" stroke-linecap="round"></path>
                            <!-- Eyes -->
                            <circle cx="127" cy="92" r="4.5" fill="#0d0d0d"></circle>
                            <circle cx="163" cy="92" r="4.5" fill="#0d0d0d"></circle>
                            <!-- Round Teal Glasses (#005b5c) -->
                            <circle cx="126" cy="92" r="13" fill="none" stroke="#005b5c" stroke-width="2.4"></circle>
                            <circle cx="164" cy="92" r="13" fill="none" stroke="#005b5c" stroke-width="2.4"></circle>
                            <line x1="139" y1="92" x2="151" y2="92" stroke="#005b5c" stroke-width="2.4"></line>
                            <!-- Happy Smile -->
                            <path d="M 137,114 C 141,119 149,119 153,114" fill="none" stroke="#0d0d0d" stroke-width="4.5" stroke-linecap="round"></path>
                        </g>
                    </g>

                    <!-- ========================================================= -->
                    <!-- RIGHT CHARACTER: "Person Scanning Product" WITH BOTTLE    -->
                    <!-- ========================================================= -->
                    <g>
                        <!-- 1. Held Soda Bottle & Back Forearm Emerging From Behind Right Shoulder -->
                        <g class="cs-bottle-hold">
                            <!-- Left Forearm (#a3704c) -->
                            <path fill="#a3704c" d="M 358,218 L 410,248 L 398,274 L 348,244 Z"></path>
                            <g transform="rotate(38 402 258)">
                                <!-- Red Cap (#ff0000) -->
                                <rect x="392" y="202" width="20" height="12" rx="4" fill="#ff0000"></rect>
                                <!-- Dark Brown Bottle (#330904) -->
                                <path fill="#330904" d="
                                    M 380,226 C 380,217 387,212 395,212 L 409,212 C 417,212 424,217 424,226
                                    L 424,284 C 424,292 417,298 409,298 L 395,298 C 387,298 380,292 380,284 Z"></path>
                                <!-- Red Label (#ff1e1e) -->
                                <rect x="380" y="234" width="44" height="38" fill="#ff1e1e"></rect>
                            </g>
                            <!-- 4 Fingers Gripping Bottle -->
                            <g fill="#b5805a">
                                <rect x="408" y="252" width="20" height="7" rx="3.5" transform="rotate(35 418 255)"></rect>
                                <rect x="403" y="260" width="20" height="7" rx="3.5" transform="rotate(35 413 263)"></rect>
                                <rect x="398" y="268" width="20" height="7" rx="3.5" transform="rotate(35 408 271)"></rect>
                                <rect x="392" y="276" width="18" height="7" rx="3.5" transform="rotate(35 401 279)"></rect>
                            </g>
                        </g>

                        <!-- 2. Unified Head & Flowing Wavy Dark-Brown Hair (Moves Together!) -->
                        <g class="cs-right-head">
                            <!-- Back Flowing Wavy Hair Silhouette (#3b2110) -->
                            <path fill="#3b2110" d="
                                M 325,38
                                C 285,38 268,66 264,96
                                C 260,124 248,144 256,172
                                C 260,188 272,196 286,196
                                L 374,196
                                C 388,182 392,150 386,120
                                C 392,84 374,38 325,38 Z"></path>
                            <!-- Neck (#a3704c) Seated Under Chin -->
                            <path fill="#a3704c" d="
                                M 312,132
                                L 344,132
                                L 344,174
                                A 16,15 0 0,1 312,174 Z"></path>
                            <!-- Face Oval & Left Ear (#b5805a) -->
                            <ellipse cx="332" cy="100" rx="42" ry="46" fill="#b5805a"></ellipse>
                            <circle cx="288" cy="102" r="10" fill="#b5805a"></circle>
                            <!-- Swept Front Hair Part (#3b2110) -->
                            <path fill="#3b2110" d="
                                M 278,96
                                C 278,52 318,40 356,48
                                C 380,54 388,82 380,114
                                C 374,92 360,74 344,62
                                C 328,84 304,96 278,96 Z"></path>
                            <!-- Eyebrows & Eyes Looking at Phone -->
                            <path d="M 322,84 C 328,82 335,82 340,84" fill="none" stroke="#2b170a" stroke-width="3.2" stroke-linecap="round"></path>
                            <path d="M 352,86 C 357,85 363,86 367,88" fill="none" stroke="#2b170a" stroke-width="3.2" stroke-linecap="round"></path>
                            <circle cx="332" cy="96" r="4" fill="#181818"></circle>
                            <circle cx="358" cy="98" r="4" fill="#181818"></circle>
                            <path d="M 336,116 C 342,121 350,120 354,115" fill="none" stroke="#181818" stroke-width="3.2" stroke-linecap="round"></path>
                        </g>

                        <!-- 3. Single Unified Green T-Shirt Torso & Smooth Shoulder Cap (#009a49) -->
                        <path fill="#009a49" d="
                            M 254,238
                            C 258,196 272,168 302,164
                            L 312,164
                            A 16,14 0 0,0 344,164
                            C 368,164 384,178 390,210
                            L 394,355
                            L 264,355
                            L 264,242 Z"></path>

                        <!-- Camera Scan Beam Between Smartphone & Bottle -->
                        <polygon class="cs-flash-beam" points="354,205 415,215 395,285 344,235" fill="#7ce0ff" opacity="0"></polygon>

                        <!-- 4. Foreground Bent Arm + Hand Holding Grey Smartphone -->
                        <g class="cs-scan-phone">
                            <!-- Tilted Grey Smartphone (#727677) -->
                            <g transform="rotate(26 346 206)">
                                <rect x="326" y="172" width="40" height="68" rx="6" fill="#525657"></rect>
                                <rect x="330" y="176" width="34" height="60" rx="4" fill="#7a7e7f"></rect>
                                <circle cx="354" cy="184" r="3.5" fill="#e2e8f0"></circle>
                            </g>
                            <!-- Forearm & 4-Finger Hand Holding Phone (#b5805a) -->
                            <path fill="#b5805a" d="
                                M 264,236
                                C 266,282 296,286 336,240
                                L 356,228 A 3.5,3.5 0 0,0 352,222 L 338,228
                                L 358,218 A 3.5,3.5 0 0,0 354,212 L 336,220
                                L 354,210 A 3.5,3.5 0 0,0 350,204 L 330,214
                                L 325,204 C 322,200 316,204 318,210
                                L 320,222
                                C 298,246 290,246 288,236 Z"></path>
                        </g>

                        <!-- Foreground Left Sleeve Cuff Overlapping the Upper Arm Seamlessly -->
                        <path fill="#00843d" d="
                            M 254,240
                            C 258,200 270,174 296,166
                            L 302,240 Z"></path>
                    </g>
                </svg>