<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-op-margins" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .comp-tier-1 { animation: tierExplode1 4.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
                        .comp-tier-2 { animation: tierExplode2 4.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
                        .comp-tier-3 { animation: tierExplode3 4.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
                        .comp-tier-4 { animation: tierExplode4 4.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
                        .comp-tier-5 { animation: tierExplode5 4.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
                        .bottle-comp-float {
                            animation: bottleCompBob 4.6s ease-in-out infinite;
                            transform-origin: 112px 215px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes tierExplode1 {
                            0%, 15%, 90%, 100% { transform: translateY(16px); }
                            40%, 75% { transform: translateY(0px); }
                        }
                        @keyframes tierExplode2 {
                            0%, 15%, 90%, 100% { transform: translateY(8px); }
                            40%, 75% { transform: translateY(0px); }
                        }
                        @keyframes tierExplode3 {
                            0%, 100% { transform: translateY(0px); }
                        }
                        @keyframes tierExplode4 {
                            0%, 15%, 90%, 100% { transform: translateY(-8px); }
                            40%, 75% { transform: translateY(0px); }
                        }
                        @keyframes tierExplode5 {
                            0%, 15%, 90%, 100% { transform: translateY(-16px); }
                            40%, 75% { transform: translateY(0px); }
                        }
                        @keyframes bottleCompBob {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(-6px); }
                        }
                    </style>

                    <!-- Left: Attached Illustration - Bottle.svg + Total Euro Tag -->
                    <g class="bottle-comp-float">
                        <circle cx="112" cy="225" r="88" fill="#dcf0f7"></circle>
                        <!-- Grey Cap (#aeaeae) -->
                        <rect x="92" y="54" width="40" height="18" rx="5" fill="#aeaeae"></rect>
                        <!-- Green Bottle Body (#009a49) -->
                        <path fill="#009a49" d="
                            M 96,72 L 128,72 L 128,118
                            C 156,128 170,154 170,188
                            L 170,332 A 16,16 0 0,1 154,348
                            L 70,348 A 16,16 0 0,1 54,332
                            L 54,188 C 54,154 68,128 96,118 Z"></path>
                        <!-- White Bottle Label with 3 Grey Lines -->
                        <rect x="74" y="182" width="76" height="110" rx="8" fill="#ffffff"></rect>
                        <line x1="86" y1="206" x2="138" y2="206" stroke="#999999" stroke-width="4.5" stroke-linecap="round"></line>
                        <line x1="86" y1="222" x2="138" y2="222" stroke="#999999" stroke-width="4.5" stroke-linecap="round"></line>
                        <line x1="86" y1="238" x2="138" y2="238" stroke="#999999" stroke-width="4.5" stroke-linecap="round"></line>

                        <!-- Attached coin-euro.svg Badge on Bottle Base -->
                        <g transform="translate(126, 294) scale(0.75)">
                            <circle cx="42" cy="42" r="42" fill="#ffc412"></circle>
                            <circle cx="42" cy="42" r="31" fill="#d49619"></circle>
                            <path d="M 52,27 C 42,23 32,29 30,39 L 29,45 C 31,55 42,61 52,57" fill="none" stroke="#6c3c00" stroke-width="6.5" stroke-linecap="round"></path>
                            <line x1="23" y1="39" x2="48" y2="39" stroke="#6c3c00" stroke-width="5"></line>
                            <line x1="23" y1="46" x2="48" y2="46" stroke="#6c3c00" stroke-width="5"></line>
                        </g>
                    </g>

                    <!-- Bracket Connecting Bottle to Price Composition Stack -->
                    <path d="M 192,82 L 210,82 L 210,346 L 192,346" fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>

                    <!-- ========================================================= -->
                    <!-- RIGHT: 5-TIER STACKED PRICE COMPOSITION & MARGINS BAR     -->
                    <!-- ========================================================= -->
                    <!-- Tier 1 (Top): VAT / Taxes (#dc3522) -->
                    <g class="comp-tier-1">
                        <rect x="234" y="66" width="96" height="38" rx="10" fill="#dc3522"></rect>
                        <line x1="336" y1="85" x2="362" y2="85" stroke="#dc3522" stroke-width="3.5" stroke-dasharray="5 4" stroke-linecap="round"></line>
                        <rect x="368" y="66" width="152" height="38" rx="10" fill="#fee2e2"></rect>
                        <circle cx="390" cy="85" r="10" fill="#dc3522"></circle>
                        <text x="390" y="89" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800">%</text>
                        <rect x="410" y="79" width="54" height="12" rx="6" fill="#dc3522"></rect>
                        <text x="506" y="90" text-anchor="end" fill="#dc3522" font-size="14" font-weight="800">10%</text>
                    </g>

                    <!-- Tier 2: Retailer / Store Margin (#ff6b35) -->
                    <g class="comp-tier-2">
                        <rect x="234" y="112" width="96" height="54" rx="10" fill="#ff6b35"></rect>
                        <line x1="336" y1="139" x2="362" y2="139" stroke="#ff6b35" stroke-width="3.5" stroke-dasharray="5 4" stroke-linecap="round"></line>
                        <rect x="368" y="116" width="152" height="46" rx="12" fill="#fff3ed"></rect>
                        <circle cx="390" cy="139" r="10" fill="#ff6b35"></circle>
                        <text x="390" y="143" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800">€</text>
                        <rect x="410" y="133" width="54" height="12" rx="6" fill="#ff6b35"></rect>
                        <text x="506" y="144" text-anchor="end" fill="#d95326" font-size="14" font-weight="800">22%</text>
                    </g>

                    <!-- Tier 3: Transport & Logistics (#00bdf2) -->
                    <g class="comp-tier-3">
                        <rect x="234" y="174" width="96" height="48" rx="10" fill="#00bdf2"></rect>
                        <line x1="336" y1="198" x2="362" y2="198" stroke="#00bdf2" stroke-width="3.5" stroke-dasharray="5 4" stroke-linecap="round"></line>
                        <rect x="368" y="176" width="152" height="44" rx="12" fill="#e1f3fe"></rect>
                        <circle cx="390" cy="198" r="10" fill="#00bdf2"></circle>
                        <rect x="410" y="192" width="54" height="12" rx="6" fill="#0077c8"></rect>
                        <text x="506" y="203" text-anchor="end" fill="#0077c8" font-size="14" font-weight="800">15%</text>
                    </g>

                    <!-- Tier 4: Processing, Packaging & Brand Margin (#ffc412) -->
                    <g class="comp-tier-4">
                        <rect x="234" y="230" width="96" height="58" rx="10" fill="#ffc412"></rect>
                        <line x1="336" y1="259" x2="362" y2="259" stroke="#d49619" stroke-width="3.5" stroke-dasharray="5 4" stroke-linecap="round"></line>
                        <rect x="368" y="236" width="152" height="46" rx="12" fill="#fffbeb"></rect>
                        <circle cx="390" cy="259" r="10" fill="#ffc412"></circle>
                        <rect x="410" y="253" width="54" height="12" rx="6" fill="#d49619"></rect>
                        <text x="506" y="264" text-anchor="end" fill="#6c3c00" font-size="14" font-weight="800">25%</text>
                    </g>

                    <!-- Tier 5 (Bottom): Producer & Raw Agricultural Ingredients (#009a49) -->
                    <g class="comp-tier-5">
                        <rect x="234" y="296" width="96" height="66" rx="10" fill="#009a49"></rect>
                        <line x1="336" y1="329" x2="362" y2="329" stroke="#009a49" stroke-width="3.5" stroke-dasharray="5 4" stroke-linecap="round"></line>
                        <rect x="368" y="304" width="152" height="50" rx="12" fill="#e8f8ef"></rect>
                        <circle cx="390" cy="329" r="10" fill="#009a49"></circle>
                        <rect x="410" y="323" width="54" height="12" rx="6" fill="#009a49"></rect>
                        <text x="506" y="334" text-anchor="end" fill="#009a49" font-size="14" font-weight="800">28%</text>
                    </g>
                </svg>