<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-op-store-comparison" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .st-bubble-left {
                            animation: storeBubbleFloat 4.2s ease-in-out infinite;
                            transform-origin: 116px 82px;
                        }
                        .st-bubble-best {
                            animation: bestDealPulse 4.2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
                            transform-origin: 280px 58px;
                        }
                        .st-bubble-right {
                            animation: storeBubbleFloat 4.2s ease-in-out infinite 0.7s;
                            transform-origin: 444px 82px;
                        }
                        .same-product-pulse {
                            animation: prodCenterFloat 4.2s ease-in-out infinite;
                            transform-origin: 280px 334px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes storeBubbleFloat {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(-7px); }
                        }
                        @keyframes bestDealPulse {
                            0%, 100% { transform: translateY(0px) scale(1); }
                            50% { transform: translateY(-10px) scale(1.08); }
                        }
                        @keyframes prodCenterFloat {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(-5px); }
                        }
                    </style>

                    <!-- Soft Map Ground Oval (#dcf0f7) & Connecting Roads -->
                    <ellipse cx="280" cy="245" rx="248" ry="135" fill="#dcf0f7"></ellipse>
                    <path d="M 116,220 L 280,330 L 444,220 M 280,196 L 280,330" fill="none" stroke="#94a3b8" stroke-width="5" stroke-dasharray="9 7" stroke-linecap="round"></path>

                    <!-- ========================================== -->
                    <!-- STORE 1 (LEFT): MODERATE PRICE (2.49 €)    -->
                    <!-- ========================================== -->
                    <g transform="translate(56, 134)">
                        <!-- Store Body -->
                        <rect x="10" y="34" width="100" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"></rect>
                        <!-- Door & Window -->
                        <rect x="24" y="56" width="30" height="50" rx="4" fill="#7ce0ff"></rect>
                        <rect x="64" y="56" width="32" height="28" rx="4" fill="#e1f3fe"></rect>
                        <!-- Striped Awning (#ff6b35 & #ffffff) -->
                        <path fill="#ff6b35" d="M 4,14 L 116,14 L 122,38 L -2,38 Z"></path>
                        <rect x="20" y="14" width="16" height="24" fill="#ffffff"></rect>
                        <rect x="52" y="14" width="16" height="24" fill="#ffffff"></rect>
                        <rect x="84" y="14" width="16" height="24" fill="#ffffff"></rect>
                    </g>
                    <!-- Price Tag Pin Over Store 1 -->
                    <g class="st-bubble-left">
                        <rect x="64" y="54" width="104" height="44" rx="12" fill="#ffc412"></rect>
                        <polygon points="106,98 126,98 116,112" fill="#ffc412"></polygon>
                        <text x="116" y="82" text-anchor="middle" fill="#181818" font-size="20" font-weight="800">2.49 €</text>
                    </g>

                    <!-- ========================================== -->
                    <!-- STORE 2 (CENTER): BEST PRICE (1.95 €)      -->
                    <!-- ========================================== -->
                    <g transform="translate(216, 108)">
                        <rect x="8" y="36" width="112" height="78" rx="10" fill="#ffffff" stroke="#009a49" stroke-width="4"></rect>
                        <rect x="24" y="60" width="34" height="54" rx="4" fill="#7ce0ff"></rect>
                        <rect x="68" y="60" width="36" height="32" rx="4" fill="#e1f3fe"></rect>
                        <!-- Green Awning (#009a49) -->
                        <path fill="#009a49" d="M 0,12 L 128,12 L 134,38 L -6,38 Z"></path>
                        <rect x="22" y="12" width="18" height="26" fill="#ffffff"></rect>
                        <rect x="56" y="12" width="18" height="26" fill="#ffffff"></rect>
                        <rect x="90" y="12" width="18" height="26" fill="#ffffff"></rect>
                    </g>
                    <!-- Best Price Tag Pin Over Store 2 + Attached Green Check -->
                    <g class="st-bubble-best">
                        <rect x="218" y="24" width="124" height="50" rx="14" fill="#009a49"></rect>
                        <polygon points="268,74 292,74 280,90" fill="#009a49"></polygon>
                        <text x="272" y="56" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">1.95 €</text>
                        <!-- Mini Green check.svg -->
                        <circle cx="334" cy="28" r="16" fill="#0b7a3e" stroke="#ffffff" stroke-width="3"></circle>
                        <path d="M 327,28 L 332,33 L 342,23" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
                    </g>

                    <!-- ========================================== -->
                    <!-- STORE 3 (RIGHT): HIGH PRICE (2.89 €)       -->
                    <!-- ========================================== -->
                    <g transform="translate(384, 134)">
                        <rect x="10" y="34" width="100" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"></rect>
                        <rect x="24" y="56" width="30" height="50" rx="4" fill="#7ce0ff"></rect>
                        <rect x="64" y="56" width="32" height="28" rx="4" fill="#e1f3fe"></rect>
                        <!-- Blue Awning (#00bdf2) -->
                        <path fill="#00bdf2" d="M 4,14 L 116,14 L 122,38 L -2,38 Z"></path>
                        <rect x="20" y="14" width="16" height="24" fill="#ffffff"></rect>
                        <rect x="52" y="14" width="16" height="24" fill="#ffffff"></rect>
                        <rect x="84" y="14" width="16" height="24" fill="#ffffff"></rect>
                    </g>
                    <!-- High Price Tag Pin Over Store 3 -->
                    <g class="st-bubble-right">
                        <rect x="392" y="54" width="104" height="44" rx="12" fill="#dc3522"></rect>
                        <polygon points="434,98 454,98 444,112" fill="#dc3522"></polygon>
                        <text x="444" y="82" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">2.89 €</text>
                    </g>

                    <!-- ========================================== -->
                    <!-- FOREGROUND SAME PRODUCT BADGE (CEREAL PACK)-->
                    <!-- ========================================== -->
                    <g class="same-product-pulse">
                        <circle cx="280" cy="332" r="64" fill="#ffffff" stroke="#181818" stroke-width="4"></circle>
                        <!-- Attached Crispy Cereal Pack Inside Circle -->
                        <g transform="translate(248, 284)">
                            <rect x="0" y="0" width="64" height="88" rx="6" fill="#ff6b35"></rect>
                            <text x="6" y="21" fill="#d95326" font-weight="800" font-size="14">CRISPY</text>
                            <path fill="#bfc3c6" d="M 38,8 L 43,6 L 51,28 A 8,8 0 1,1 43,31 Z"></path>
                            <path fill="#00bdf2" d="M 26,46 L 64,46 L 64,66 C 54,80 30,78 26,46 Z"></path>
                            <ellipse cx="14" cy="38" rx="4.5" ry="2.2" fill="#f8c100"></ellipse>
                            <ellipse cx="18" cy="58" rx="4.5" ry="2.2" fill="#f8c100"></ellipse>
                            <ellipse cx="14" cy="74" rx="4.5" ry="2.2" fill="#f8c100"></ellipse>
                        </g>
                    </g>
                </svg>