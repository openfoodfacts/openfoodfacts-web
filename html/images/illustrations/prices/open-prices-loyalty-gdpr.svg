<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-op-loyalty-gdpr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .gdpr-shield-pulse {
                            animation: shieldFloat 4.2s ease-in-out infinite;
                            transform-origin: 280px 185px;
                        }
                        .gdpr-arrow-flow {
                            stroke-dashoffset: 60;
                            animation: dataFlowDash 2.1s linear infinite;
                        }
                        .gdpr-export-board {
                            animation: boardSlideIn 4.2s ease-in-out infinite;
                            transform-origin: 445px 215px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes shieldFloat {
                            0%, 100% { transform: translateY(0px) scale(1); }
                            50% { transform: translateY(-8px) scale(1.05); }
                        }
                        @keyframes dataFlowDash {
                            to { stroke-dashoffset: 0; }
                        }
                        @keyframes boardSlideIn {
                            0%, 100% { transform: translateY(0px) rotate(3deg); }
                            50% { transform: translateY(-7px) rotate(0deg); }
                        }
                    </style>

                    <!-- Left: Fanned Loyalty Cards Stack -->
                    <g transform="translate(-22, 10)">
                        <!-- Back Orange Card -->
                        <g transform="rotate(-12 145 195)">
                            <rect x="52" y="102" width="185" height="116" rx="14" fill="#ff6b35" stroke="#ffffff" stroke-width="3"></rect>
                            <circle cx="84" cy="134" r="14" fill="#ffc412"></circle>
                            <rect x="108" y="128" width="90" height="10" rx="5" fill="#ffffff"></rect>
                        </g>
                        <!-- Middle Cyan Card -->
                        <g transform="rotate(-4 155 205)">
                            <rect x="62" y="124" width="185" height="116" rx="14" fill="#00bdf2" stroke="#ffffff" stroke-width="3"></rect>
                            <circle cx="94" cy="156" r="14" fill="#ffffff"></circle>
                            <rect x="118" y="150" width="90" height="10" rx="5" fill="#ffffff"></rect>
                        </g>
                        <!-- Front Green Loyalty Card -->
                        <g transform="rotate(4 165 225)">
                            <rect x="72" y="148" width="185" height="116" rx="14" fill="#009a49" stroke="#ffffff" stroke-width="3"></rect>
                            <circle cx="104" cy="180" r="15" fill="#ffc412"></circle>
                            <rect x="128" y="174" width="95" height="10" rx="5" fill="#ffffff"></rect>
                            <rect x="90" y="210" width="150" height="36" rx="6" fill="#ffffff"></rect>
                            <g fill="#181818" transform="translate(102, 216)">
                                <rect x="0" y="0" width="4" height="24"></rect><rect x="8" y="0" width="7" height="24"></rect>
                                <rect x="19" y="0" width="3" height="24"></rect><rect x="26" y="0" width="8" height="24"></rect>
                                <rect x="38" y="0" width="5" height="24"></rect><rect x="47" y="0" width="9" height="24"></rect>
                                <rect x="60" y="0" width="3" height="24"></rect><rect x="67" y="0" width="7" height="24"></rect>
                                <rect x="78" y="0" width="6" height="24"></rect><rect x="88" y="0" width="8" height="24"></rect>
                                <rect x="100" y="0" width="4" height="24"></rect><rect x="108" y="0" width="7" height="24"></rect>
                                <rect x="119" y="0" width="5" height="24"></rect>
                            </g>
                        </g>
                    </g>

                    <!-- Animated Data Portability Stream Connecting Cards -> GDPR -> Checklist -->
                    <line class="gdpr-arrow-flow" x1="220" y1="205" x2="375" y2="205" stroke="#0062cc" stroke-width="6" stroke-dasharray="10 10" stroke-linecap="round"></line>

                    <!-- Center: EU / GDPR Shield Badge (#0052b4 + Golden Stars #ffc412) -->
                    <g class="gdpr-shield-pulse">
                        <path fill="#0052b4" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" d="
                            M 285,108
                            L 345,128
                            L 345,190
                            C 345,234 316,264 285,278
                            C 254,264 225,234 225,190
                            L 225,128 Z"></path>
                        <!-- Ring of 8 Golden Stars Around "GDPR" -->
                        <g fill="#ffc412">
                            <circle cx="285" cy="136" r="4"></circle>
                            <circle cx="315" cy="148" r="4"></circle>
                            <circle cx="325" cy="178" r="4"></circle>
                            <circle cx="315" cy="208" r="4"></circle>
                            <circle cx="285" cy="222" r="4"></circle>
                            <circle cx="255" cy="208" r="4"></circle>
                            <circle cx="245" cy="178" r="4"></circle>
                            <circle cx="255" cy="148" r="4"></circle>
                        </g>
                        <text x="285" y="182" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="1">GDPR</text>
                        <!-- Data Export Arrow Inside Shield -->
                        <rect x="263" y="192" width="44" height="18" rx="9" fill="#ffc412"></rect>
                        <text x="285" y="205" text-anchor="middle" fill="#181818" font-size="11" font-weight="800">EXPORT →</text>
                    </g>

                    <!-- Right: Extracted Open Prices Data on Attached Checklist.svg + Green Check -->
                    <g class="gdpr-export-board">
                        <rect x="372" y="88" width="152" height="214" rx="22" fill="#00bdf2"></rect>
                        <rect x="386" y="106" width="124" height="180" rx="12" fill="#ffffff"></rect>
                        <rect x="420" y="74" width="56" height="36" rx="8" fill="#aeaeae"></rect>

                        <!-- Extracted Price Rows -->
                        <circle cx="408" cy="142" r="7" fill="#009a49"></circle>
                        <rect x="424" y="137" width="42" height="10" rx="5" fill="#606362"></rect>
                        <text x="498" y="146" text-anchor="end" fill="#009a49" font-size="12" font-weight="800">2.49€</text>

                        <circle cx="408" cy="176" r="7" fill="#ff6b35"></circle>
                        <rect x="424" y="171" width="36" height="10" rx="5" fill="#606362"></rect>
                        <text x="498" y="180" text-anchor="end" fill="#ff6b35" font-size="12" font-weight="800">1.85€</text>

                        <circle cx="408" cy="210" r="7" fill="#00bdf2"></circle>
                        <rect x="424" y="205" width="44" height="10" rx="5" fill="#606362"></rect>
                        <text x="498" y="214" text-anchor="end" fill="#0077c8" font-size="12" font-weight="800">3.10€</text>

                        <circle cx="408" cy="244" r="7" fill="#ffc412"></circle>
                        <rect x="424" y="239" width="38" height="10" rx="5" fill="#606362"></rect>
                        <text x="498" y="248" text-anchor="end" fill="#d49619" font-size="12" font-weight="800">4.20€</text>

                        <!-- Attached Green check.svg Badge -->
                        <circle cx="512" cy="288" r="26" fill="#0b7a3e"></circle>
                        <path d="M 500,288 L 508,296 L 525,279" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    </g>
                </svg>