<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-op-stores-grid" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .grid-store-1 { animation: storeTilePop 4.4s ease-in-out infinite 0.0s; transform-origin: 166px 128px; }
                        .grid-store-2 { animation: storeTilePop 4.4s ease-in-out infinite 0.6s; transform-origin: 394px 128px; }
                        .grid-store-3 { animation: storeTilePop 4.4s ease-in-out infinite 1.2s; transform-origin: 166px 292px; }
                        .grid-store-4 { animation: storeTilePop 4.4s ease-in-out infinite 1.8s; transform-origin: 394px 292px; }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes storeTilePop {
                            0%, 35%, 100% { transform: translateY(0px) scale(1); }
                            18% { transform: translateY(-6px) scale(1.03); }
                        }
                    </style>

                    <!-- ========================================== -->
                    <!-- TILE 1 (TOP-LEFT): GREEN STORE (1,420)     -->
                    <!-- ========================================== -->
                    <g class="grid-store-1">
                        <rect x="64" y="54" width="204" height="148" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"></rect>
                        <!-- Mini Storefront Icon -->
                        <rect x="86" y="92" width="66" height="50" rx="6" fill="#dcf0f7"></rect>
                        <rect x="108" y="110" width="22" height="32" rx="3" fill="#0077c8"></rect>
                        <path fill="#009a49" d="M 80,76 L 158,76 L 162,94 L 76,94 Z"></path>
                        <rect x="94" y="76" width="12" height="18" fill="#ffffff"></rect>
                        <rect x="118" y="76" width="12" height="18" fill="#ffffff"></rect>
                        <rect x="142" y="76" width="12" height="18" fill="#ffffff"></rect>
                        <!-- Registered Prices Counter Badge -->
                        <rect x="168" y="82" width="84" height="60" rx="14" fill="#009a49"></rect>
                        <text x="210" y="110" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">1,420</text>
                        <text x="210" y="128" text-anchor="middle" fill="#e8f8ef" font-size="10" font-weight="800">PRICES €</text>
                        <!-- Bottom Store Bar -->
                        <rect x="86" y="160" width="166" height="14" rx="7" fill="#e2e8f0"></rect>
                        <rect x="86" y="160" width="128" height="14" rx="7" fill="#009a49"></rect>
                    </g>

                    <!-- ========================================== -->
                    <!-- TILE 2 (TOP-RIGHT): ORANGE STORE (865)     -->
                    <!-- ========================================== -->
                    <g class="grid-store-2">
                        <rect x="292" y="54" width="204" height="148" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"></rect>
                        <rect x="314" y="92" width="66" height="50" rx="6" fill="#dcf0f7"></rect>
                        <rect x="336" y="110" width="22" height="32" rx="3" fill="#0077c8"></rect>
                        <path fill="#ff6b35" d="M 308,76 L 386,76 L 390,94 L 304,94 Z"></path>
                        <rect x="322" y="76" width="12" height="18" fill="#ffffff"></rect>
                        <rect x="346" y="76" width="12" height="18" fill="#ffffff"></rect>
                        <rect x="370" y="76" width="12" height="18" fill="#ffffff"></rect>
                        <!-- Counter Badge -->
                        <rect x="396" y="82" width="84" height="60" rx="14" fill="#ff6b35"></rect>
                        <text x="438" y="110" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">865</text>
                        <text x="438" y="128" text-anchor="middle" fill="#fff3ed" font-size="10" font-weight="800">PRICES €</text>
                        <rect x="314" y="160" width="166" height="14" rx="7" fill="#e2e8f0"></rect>
                        <rect x="314" y="160" width="92" height="14" rx="7" fill="#ff6b35"></rect>
                    </g>

                    <!-- ========================================== -->
                    <!-- TILE 3 (BOTTOM-LEFT): CYAN STORE (2,190)   -->
                    <!-- ========================================== -->
                    <g class="grid-store-3">
                        <rect x="64" y="218" width="204" height="148" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"></rect>
                        <rect x="86" y="256" width="66" height="50" rx="6" fill="#dcf0f7"></rect>
                        <rect x="108" y="274" width="22" height="32" rx="3" fill="#0077c8"></rect>
                        <path fill="#00bdf2" d="M 80,240 L 158,240 L 162,258 L 76,258 Z"></path>
                        <rect x="94" y="240" width="12" height="18" fill="#ffffff"></rect>
                        <rect x="118" y="240" width="12" height="18" fill="#ffffff"></rect>
                        <rect x="142" y="240" width="12" height="18" fill="#ffffff"></rect>
                        <!-- Counter Badge -->
                        <rect x="168" y="246" width="84" height="60" rx="14" fill="#00bdf2"></rect>
                        <text x="210" y="274" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800">2,190</text>
                        <text x="210" y="292" text-anchor="middle" fill="#e1f3fe" font-size="10" font-weight="800">PRICES €</text>
                        <rect x="86" y="324" width="166" height="14" rx="7" fill="#e2e8f0"></rect>
                        <rect x="86" y="324" width="152" height="14" rx="7" fill="#00bdf2"></rect>
                    </g>

                    <!-- ========================================== -->
                    <!-- TILE 4 (BOTTOM-RIGHT): YELLOW STORE (540)  -->
                    <!-- ========================================== -->
                    <g class="grid-store-4">
                        <rect x="292" y="218" width="204" height="148" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"></rect>
                        <rect x="314" y="256" width="66" height="50" rx="6" fill="#dcf0f7"></rect>
                        <rect x="336" y="274" width="22" height="32" rx="3" fill="#0077c8"></rect>
                        <path fill="#ffc412" d="M 308,240 L 386,240 L 390,258 L 304,258 Z"></path>
                        <rect x="322" y="240" width="12" height="18" fill="#ffffff"></rect>
                        <rect x="346" y="240" width="12" height="18" fill="#ffffff"></rect>
                        <rect x="370" y="240" width="12" height="18" fill="#ffffff"></rect>
                        <!-- Counter Badge -->
                        <rect x="396" y="246" width="84" height="60" rx="14" fill="#ffc412"></rect>
                        <text x="438" y="274" text-anchor="middle" fill="#181818" font-size="18" font-weight="800">540</text>
                        <text x="438" y="292" text-anchor="middle" fill="#6c3c00" font-size="10" font-weight="800">PRICES €</text>
                        <rect x="314" y="324" width="166" height="14" rx="7" fill="#e2e8f0"></rect>
                        <rect x="314" y="324" width="66" height="14" rx="7" fill="#ffc412"></rect>
                    </g>
                </svg>