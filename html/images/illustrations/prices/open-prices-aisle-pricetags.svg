<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-op-aisle-tags" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .tag-pop-1 {
                            animation: shelfTagZoom 4.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
                            transform-origin: 132px 218px;
                        }
                        .tag-pop-2 {
                            animation: shelfTagZoom 4.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 1.5s;
                            transform-origin: 280px 218px;
                        }
                        .tag-pop-3 {
                            animation: shelfTagZoom 4.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 3.0s;
                            transform-origin: 428px 218px;
                        }
                        .zoom-callout-tag {
                            animation: calloutFloat 4.5s ease-in-out infinite;
                            transform-origin: 280px 334px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes shelfTagZoom {
                            0%, 28%, 100% { transform: scale(1); }
                            14% { transform: scale(1.22) translateY(-3px); }
                        }
                        @keyframes calloutFloat {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(-6px); }
                        }
                    </style>

                    <!-- Store Aisle Backboard -->
                    <rect x="44" y="34" width="472" height="352" rx="28" fill="#dcf0f7"></rect>

                    <!-- ========================================== -->
                    <!-- TOP SHELF PRODUCTS                         -->
                    <!-- ========================================== -->
                    <!-- Product 1 (Left): Attached Crispy Cereal Pack -->
                    <g transform="translate(88, 62)">
                        <rect x="0" y="0" width="88" height="122" rx="8" fill="#ff6b35"></rect>
                        <text x="10" y="28" fill="#d95326" font-weight="800" font-size="18">CRISPY</text>
                        <path fill="#bfc3c6" d="M 52,10 L 58,8 L 68,38 A 10,10 0 1,1 58,42 Z"></path>
                        <path fill="#00bdf2" d="M 36,64 L 88,64 L 88,92 C 74,112 42,108 36,64 Z"></path>
                        <ellipse cx="18" cy="52" rx="6" ry="3" fill="#f8c100"></ellipse>
                        <ellipse cx="24" cy="78" rx="6" ry="3" fill="#f8c100"></ellipse>
                        <ellipse cx="18" cy="102" rx="6" ry="3" fill="#f8c100"></ellipse>
                    </g>

                    <!-- Product 2 (Center): Attached Green Bottle (x2 in aisle) -->
                    <g transform="translate(232, 46)">
                        <rect x="16" y="0" width="22" height="10" rx="3" fill="#aeaeae"></rect>
                        <path fill="#009a49" d="M 19,10 L 35,10 L 35,34 C 48,40 54,54 54,72 L 54,128 A 10,10 0 0,1 44,138 L 10,138 A 10,10 0 0,1 0,128 L 0,72 C 0,54 6,40 19,34 Z"></path>
                        <rect x="9" y="64" width="36" height="50" rx="4" fill="#ffffff"></rect>
                        <line x1="14" y1="78" x2="40" y2="78" stroke="#999999" stroke-width="3"></line>
                        <line x1="14" y1="88" x2="40" y2="88" stroke="#999999" stroke-width="3"></line>
                    </g>
                    <g transform="translate(292, 46)" opacity="0.85">
                        <rect x="16" y="0" width="22" height="10" rx="3" fill="#aeaeae"></rect>
                        <path fill="#009a49" d="M 19,10 L 35,10 L 35,34 C 48,40 54,54 54,72 L 54,128 A 10,10 0 0,1 44,138 L 10,138 A 10,10 0 0,1 0,128 L 0,72 C 0,54 6,40 19,34 Z"></path>
                        <rect x="9" y="64" width="36" height="50" rx="4" fill="#ffffff"></rect>
                    </g>

                    <!-- Product 3 (Right): Attached Pet-Food-Kibble-Bag -->
                    <g transform="translate(384, 58)">
                        <rect x="14" y="0" width="60" height="12" rx="3" fill="#d68b28"></rect>
                        <path fill="#f5b041" d="M 14,12 L 74,12 L 88,36 L 88,118 A 8,8 0 0,1 80,126 L 8,126 A 8,8 0 0,1 0,118 L 0,36 Z"></path>
                        <circle cx="44" cy="68" r="30" fill="#ffffff"></circle>
                        <ellipse cx="44" cy="75" rx="12" ry="8" fill="#595048"></ellipse>
                        <circle cx="30" cy="62" r="4.5" fill="#595048"></circle>
                        <circle cx="39" cy="55" r="4.5" fill="#595048"></circle>
                        <circle cx="49" cy="55" r="4.5" fill="#595048"></circle>
                        <circle cx="58" cy="62" r="4.5" fill="#595048"></circle>
                    </g>

                    <!-- ========================================== -->
                    <!-- HORIZONTAL SHELF RAIL & 3 PRICETAGS        -->
                    <!-- ========================================== -->
                    <rect x="56" y="184" width="448" height="22" rx="6" fill="#606362"></rect>
                    <rect x="56" y="184" width="448" height="8" rx="4" fill="#999999"></rect>

                    <!-- Shelf Pricetag 1 (Left) -->
                    <g class="tag-pop-1">
                        <rect x="86" y="194" width="92" height="52" rx="8" fill="#ffffff" stroke="#181818" stroke-width="3"></rect>
                        <rect x="92" y="200" width="80" height="22" rx="4" fill="#ffc412"></rect>
                        <text x="132" y="216" text-anchor="middle" fill="#181818" font-size="14" font-weight="800">2.49 €</text>
                        <!-- Mini Barcode on Shelf Tag -->
                        <g fill="#181818" transform="translate(98, 227)">
                            <rect x="0" y="0" width="3" height="13"></rect><rect x="6" y="0" width="5" height="13"></rect>
                            <rect x="14" y="0" width="2" height="13"></rect><rect x="19" y="0" width="6" height="13"></rect>
                            <rect x="28" y="0" width="3" height="13"></rect><rect x="34" y="0" width="7" height="13"></rect>
                            <rect x="44" y="0" width="2" height="13"></rect><rect x="49" y="0" width="5" height="13"></rect>
                            <rect x="57" y="0" width="4" height="13"></rect><rect x="64" y="0" width="3" height="13"></rect>
                        </g>
                    </g>

                    <!-- Shelf Pricetag 2 (Center) -->
                    <g class="tag-pop-2">
                        <rect x="234" y="194" width="92" height="52" rx="8" fill="#ffffff" stroke="#181818" stroke-width="3"></rect>
                        <rect x="240" y="200" width="80" height="22" rx="4" fill="#ffc412"></rect>
                        <text x="280" y="216" text-anchor="middle" fill="#181818" font-size="14" font-weight="800">1.85 €</text>
                        <g fill="#181818" transform="translate(246, 227)">
                            <rect x="0" y="0" width="4" height="13"></rect><rect x="7" y="0" width="3" height="13"></rect>
                            <rect x="13" y="0" width="6" height="13"></rect><rect x="22" y="0" width="2" height="13"></rect>
                            <rect x="27" y="0" width="7" height="13"></rect><rect x="37" y="0" width="3" height="13"></rect>
                            <rect x="43" y="0" width="5" height="13"></rect><rect x="51" y="0" width="4" height="13"></rect>
                            <rect x="58" y="0" width="6" height="13"></rect><rect x="66" y="0" width="2" height="13"></rect>
                        </g>
                    </g>

                    <!-- Shelf Pricetag 3 (Right) -->
                    <g class="tag-pop-3">
                        <rect x="382" y="194" width="92" height="52" rx="8" fill="#ffffff" stroke="#181818" stroke-width="3"></rect>
                        <rect x="388" y="200" width="80" height="22" rx="4" fill="#ffc412"></rect>
                        <text x="428" y="216" text-anchor="middle" fill="#181818" font-size="14" font-weight="800">4.90 €</text>
                        <g fill="#181818" transform="translate(394, 227)">
                            <rect x="0" y="0" width="3" height="13"></rect><rect x="6" y="0" width="6" height="13"></rect>
                            <rect x="15" y="0" width="3" height="13"></rect><rect x="21" y="0" width="5" height="13"></rect>
                            <rect x="29" y="0" width="4" height="13"></rect><rect x="36" y="0" width="6" height="13"></rect>
                            <rect x="45" y="0" width="2" height="13"></rect><rect x="50" y="0" width="6" height="13"></rect>
                            <rect x="59" y="0" width="3" height="13"></rect><rect x="65" y="0" width="3" height="13"></rect>
                        </g>
                    </g>

                    <!-- ========================================== -->
                    <!-- FOREGROUND ZOOMED SHELF PRICE TAG CALLOUT  -->
                    <!-- ========================================== -->
                    <g class="zoom-callout-tag">
                        <rect x="135" y="268" width="290" height="104" rx="18" fill="#181818"></rect>
                        <rect x="143" y="276" width="274" height="88" rx="14" fill="#ffffff"></rect>

                        <!-- Left Side: Product Name Bars & Barcode -->
                        <rect x="160" y="290" width="106" height="10" rx="5" fill="#606362"></rect>
                        <rect x="160" y="306" width="74" height="8" rx="4" fill="#aeaeae"></rect>

                        <g fill="#181818" transform="translate(160, 324)">
                            <rect x="0" y="0" width="4" height="26"></rect><rect x="7" y="0" width="2" height="26"></rect>
                            <rect x="12" y="0" width="7" height="26"></rect><rect x="22" y="0" width="3" height="26"></rect>
                            <rect x="28" y="0" width="6" height="26"></rect><rect x="37" y="0" width="2" height="26"></rect>
                            <rect x="42" y="0" width="8" height="26"></rect><rect x="53" y="0" width="3" height="26"></rect>
                            <rect x="59" y="0" width="5" height="26"></rect><rect x="67" y="0" width="7" height="26"></rect>
                            <rect x="77" y="0" width="2" height="26"></rect><rect x="82" y="0" width="5" height="26"></rect>
                            <rect x="90" y="0" width="4" height="26"></rect>
                        </g>

                        <!-- Right Side: Yellow Price Box (#ffc412) -->
                        <rect x="278" y="288" width="124" height="64" rx="12" fill="#ffc412"></rect>
                        <text x="340" y="328" text-anchor="middle" fill="#181818" font-size="28" font-weight="800">1.85 €</text>
                        <text x="340" y="344" text-anchor="middle" fill="#6c3c00" font-size="10" font-weight="700">3.70 € / L</text>
                    </g>
                </svg>