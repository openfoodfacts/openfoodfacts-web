<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-op-scan-aisle-pricetag" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .aisle-tag-focus {
                            animation: aisleTagHighlight 4.2s ease-in-out infinite;
                            transform-origin: 204px 238px;
                        }
                        .aisle-scanner-hand {
                            animation: aislePhoneMove 4.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
                            transform-origin: 520px 360px;
                        }
                        .aisle-laser-line {
                            animation: aisleLaserSweep 2.1s ease-in-out infinite;
                        }
                        .aisle-scan-badge {
                            animation: aisleBadgePop 4.2s ease-out infinite;
                            transform-origin: 355px 250px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes aisleTagHighlight {
                            0%, 100% { transform: scale(1); }
                            45%, 60% { transform: scale(1.12); }
                        }
                        @keyframes aislePhoneMove {
                            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
                            45%, 60% { transform: translate(-22px, -8px) rotate(-3deg); }
                        }
                        @keyframes aisleLaserSweep {
                            0%, 100% { transform: translateY(-34px); opacity: 0.35; }
                            50% { transform: translateY(38px); opacity: 1; }
                        }
                        @keyframes aisleBadgePop {
                            0%, 38%, 90%, 100% { transform: scale(0); opacity: 0; }
                            48%, 78% { transform: scale(1); opacity: 1; }
                        }
                    </style>

                    <!-- ========================================================= -->
                    <!-- BACKGROUND: OPEN-PRICES-AISLE-PRICETAGS.SVG               -->
                    <!-- ========================================================= -->
                    <g transform="translate(-14, 12)">
                        <rect x="34" y="28" width="380" height="310" rx="26" fill="#dcf0f7"></rect>

                        <!-- Shelf Product 1 (Left): Crispy Cereal Pack -->
                        <g transform="translate(62, 56)">
                            <rect x="0" y="0" width="82" height="116" rx="8" fill="#ff6b35"></rect>
                            <text x="9" y="26" fill="#d95326" font-weight="800" font-size="17">CRISPY</text>
                            <path fill="#bfc3c6" d="M 48,10 L 54,8 L 63,36 A 9,9 0 1,1 54,40 Z"></path>
                            <path fill="#00bdf2" d="M 34,60 L 82,60 L 82,88 C 68,106 38,102 34,60 Z"></path>
                            <ellipse cx="16" cy="48" rx="5.5" ry="2.8" fill="#f8c100"></ellipse>
                            <ellipse cx="22" cy="74" rx="5.5" ry="2.8" fill="#f8c100"></ellipse>
                            <ellipse cx="16" cy="96" rx="5.5" ry="2.8" fill="#f8c100"></ellipse>
                        </g>

                        <!-- Shelf Product 2 (Center): Green Bottle -->
                        <g transform="translate(178, 42)">
                            <rect x="16" y="0" width="22" height="10" rx="3" fill="#aeaeae"></rect>
                            <path fill="#009a49" d="M 19,10 L 35,10 L 35,34 C 48,40 54,54 54,72 L 54,120 A 10,10 0 0,1 44,130 L 10,130 A 10,10 0 0,1 0,120 L 0,72 C 0,54 6,40 19,34 Z"></path>
                            <rect x="9" y="60" width="36" height="46" rx="4" fill="#ffffff"></rect>
                            <line x1="14" y1="74" x2="40" y2="74" stroke="#999999" stroke-width="3"></line>
                            <line x1="14" y1="84" x2="40" y2="84" stroke="#999999" stroke-width="3"></line>
                        </g>

                        <!-- Shelf Product 3 (Right): Pet Food Kibble Bag -->
                        <g transform="translate(268, 52)">
                            <rect x="12" y="0" width="56" height="11" rx="3" fill="#d68b28"></rect>
                            <path fill="#f5b041" d="M 12,11 L 68,11 L 80,34 L 80,112 A 8,8 0 0,1 72,120 L 8,120 A 8,8 0 0,1 0,112 L 0,34 Z"></path>
                            <circle cx="40" cy="64" r="27" fill="#ffffff"></circle>
                            <ellipse cx="40" cy="70" rx="10" ry="7" fill="#595048"></ellipse>
                            <circle cx="28" cy="58" r="4" fill="#595048"></circle>
                            <circle cx="36" cy="52" r="4" fill="#595048"></circle>
                            <circle cx="44" cy="52" r="4" fill="#595048"></circle>
                            <circle cx="52" cy="58" r="4" fill="#595048"></circle>
                        </g>

                        <!-- Shelf Metal Rail -->
                        <rect x="44" y="172" width="356" height="20" rx="6" fill="#606362"></rect>
                        <rect x="44" y="172" width="356" height="7" rx="3.5" fill="#999999"></rect>

                        <!-- Left Shelf Pricetag (2.49 €) -->
                        <g>
                            <rect x="60" y="182" width="86" height="50" rx="8" fill="#ffffff" stroke="#181818" stroke-width="3"></rect>
                            <rect x="66" y="188" width="74" height="20" rx="4" fill="#ffc412"></rect>
                            <text x="103" y="203" text-anchor="middle" fill="#181818" font-size="13" font-weight="800">2.49 €</text>
                            <g fill="#181818" transform="translate(72, 213)">
                                <rect x="0" y="0" width="3" height="12"></rect><rect x="6" y="0" width="5" height="12"></rect>
                                <rect x="14" y="0" width="2" height="12"></rect><rect x="19" y="0" width="6" height="12"></rect>
                                <rect x="28" y="0" width="3" height="12"></rect><rect x="34" y="0" width="7" height="12"></rect>
                                <rect x="44" y="0" width="2" height="12"></rect><rect x="49" y="0" width="5" height="12"></rect>
                            </g>
                        </g>

                        <!-- Center Highlighted Shelf Pricetag Being Scanned (1.85 €) -->
                        <g class="aisle-tag-focus">
                            <rect x="160" y="182" width="92" height="54" rx="8" fill="#ffffff" stroke="#009a49" stroke-width="3.5"></rect>
                            <rect x="166" y="188" width="80" height="22" rx="4" fill="#ffc412"></rect>
                            <text x="206" y="204" text-anchor="middle" fill="#181818" font-size="14" font-weight="800">1.85 €</text>
                            <g fill="#181818" transform="translate(172, 215)">
                                <rect x="0" y="0" width="4" height="13"></rect><rect x="7" y="0" width="3" height="13"></rect>
                                <rect x="13" y="0" width="6" height="13"></rect><rect x="22" y="0" width="2" height="13"></rect>
                                <rect x="27" y="0" width="7" height="13"></rect><rect x="37" y="0" width="3" height="13"></rect>
                                <rect x="43" y="0" width="5" height="13"></rect><rect x="51" y="0" width="4" height="13"></rect>
                                <rect x="58" y="0" width="6" height="13"></rect>
                            </g>
                        </g>
                    </g>

                    <!-- ========================================================= -->
                    <!-- FOREGROUND: SMARTPHONE HAND SCANNING SHELF PRICETAG       -->
                    <!-- ========================================================= -->
                    <g class="aisle-scanner-hand">
                        <g fill="#955830">
                            <rect x="292" y="142" width="45" height="22" rx="11" transform="rotate(35 314 153)"></rect>
                            <rect x="275" y="164" width="58" height="22" rx="11" transform="rotate(35 304 175)"></rect>
                            <rect x="260" y="186" width="66" height="22" rx="11" transform="rotate(35 293 197)"></rect>
                        </g>
                        <path fill="#955830" d="M 380,210 L 432,216 C 470,252 508,270 555,280 L 555,375 C 488,365 436,336 385,292 Z"></path>
                        <g transform="rotate(5 355 200)">
                            <rect x="294" y="88" width="122" height="214" rx="14" fill="#606362"></rect>
                            <rect x="300" y="95" width="110" height="200" rx="11" fill="#e1f3fe"></rect>

                            <!-- Mini Shelf Rail + Shelf Pricetag Inside the Smartphone Camera Viewfinder! -->
                            <rect x="306" y="122" width="98" height="12" rx="3" fill="#606362"></rect>
                            <rect x="312" y="130" width="86" height="84" rx="8" fill="#ffffff" stroke="#181818" stroke-width="2.5"></rect>
                            <!-- Yellow Price Box on Tag -->
                            <rect x="320" y="138" width="70" height="30" rx="5" fill="#ffc412"></rect>
                            <text x="355" y="159" text-anchor="middle" fill="#181818" font-size="16" font-weight="800">1.85 €</text>
                            <!-- Mini Barcode Under Price on the Shelf Tag -->
                            <g fill="#222222" transform="translate(323, 176)">
                                <rect x="0" y="0" width="3" height="24"></rect><rect x="6" y="0" width="6" height="24"></rect>
                                <rect x="15" y="0" width="2" height="24"></rect><rect x="20" y="0" width="5" height="24"></rect>
                                <rect x="28" y="0" width="7" height="24"></rect><rect x="38" y="0" width="3" height="24"></rect>
                                <rect x="44" y="0" width="6" height="24"></rect><rect x="53" y="0" width="4" height="24"></rect>
                                <rect x="60" y="0" width="4" height="24"></rect>
                            </g>

                            <!-- Red Laser Scan Line Sweeping Across the Shelf Pricetag -->
                            <rect class="aisle-laser-line" x="304" y="166" width="102" height="3.5" rx="1.5" fill="#dc3522"></rect>

                            <!-- Green Confirmation Pill -->
                            <g class="aisle-scan-badge">
                                <rect x="320" y="236" width="70" height="26" rx="13" fill="#009a49"></rect>
                                <path d="M 346,249 L 352,255 L 365,243" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
                            </g>
                            <path fill="#606362" d="M 332,93 L 378,93 L 375,102 L 335,102 Z"></path>
                        </g>
                        <path fill="#955830" d="M 404,268 L 410,162 A 12,12 0 0,1 434,162 L 440,220 L 430,274 Z"></path>
                    </g>
                </svg>