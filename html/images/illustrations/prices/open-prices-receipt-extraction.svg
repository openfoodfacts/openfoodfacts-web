<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-op-extraction" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .ocr-laser-beam {
                            animation: ocrLaserScan 4.2s ease-in-out infinite;
                        }
                        .extract-card-1 {
                            animation: cardExtractSlide 4.2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.3s;
                        }
                        .extract-card-2 {
                            animation: cardExtractSlide 4.2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 0.9s;
                        }
                        .extract-card-3 {
                            animation: cardExtractSlide 4.2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite 1.5s;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes ocrLaserScan {
                            0%, 100% { transform: translateY(0px); }
                            50% { transform: translateY(195px); }
                        }
                        @keyframes cardExtractSlide {
                            0%, 15%, 92%, 100% { transform: translateX(-36px) scale(0.9); opacity: 0.25; }
                            35%, 80% { transform: translateX(0px) scale(1); opacity: 1; }
                        }
                    </style>

                    <!-- ========================================== -->
                    <!-- LEFT: PAPER RECEIPT BEING SCANNED          -->
                    <!-- ========================================== -->
                    <g>
                        <!-- Receipt Paper Body -->
                        <path fill="#ffffff" stroke="#cbd5e1" stroke-width="3" d="
                            M 46,66
                            L 62,54 L 78,66 L 94,54 L 110,66 L 126,54 L 142,66 L 158,54 L 174,66 L 190,54 L 206,66 L 222,54 L 238,66
                            L 238,354
                            L 222,366 L 206,354 L 190,366 L 174,354 L 158,366 L 142,354 L 126,366 L 110,354 L 94,366 L 78,354 L 62,366 L 46,354
                            Z"></path>

                        <!-- Receipt Header -->
                        <rect x="86" y="84" width="112" height="20" rx="10" fill="#dcf0f7"></rect>

                        <!-- Dashed OCR Bounding Boxes Around Receipt Rows -->
                        <!-- Row 1 Box -->
                        <rect x="62" y="124" width="160" height="40" rx="8" fill="#fff3ed" stroke="#ff6b35" stroke-width="2.5" stroke-dasharray="6 4"></rect>
                        <rect x="74" y="139" width="78" height="10" rx="5" fill="#606362"></rect>
                        <rect x="172" y="139" width="38" height="10" rx="5" fill="#ff6b35"></rect>

                        <!-- Row 2 Box -->
                        <rect x="62" y="182" width="160" height="40" rx="8" fill="#e8f8ef" stroke="#009a49" stroke-width="2.5" stroke-dasharray="6 4"></rect>
                        <rect x="74" y="197" width="66" height="10" rx="5" fill="#606362"></rect>
                        <rect x="172" y="197" width="38" height="10" rx="5" fill="#009a49"></rect>

                        <!-- Row 3 Box -->
                        <rect x="62" y="240" width="160" height="40" rx="8" fill="#fffbeb" stroke="#d68b28" stroke-width="2.5" stroke-dasharray="6 4"></rect>
                        <rect x="74" y="255" width="84" height="10" rx="5" fill="#606362"></rect>
                        <rect x="172" y="255" width="38" height="10" rx="5" fill="#d68b28"></rect>

                        <!-- Receipt Barcode -->
                        <g fill="#aeaeae" transform="translate(88, 304)">
                            <rect x="0" y="0" width="5" height="28"></rect><rect x="10" y="0" width="8" height="28"></rect>
                            <rect x="23" y="0" width="4" height="28"></rect><rect x="32" y="0" width="9" height="28"></rect>
                            <rect x="46" y="0" width="3" height="28"></rect><rect x="54" y="0" width="8" height="28"></rect>
                            <rect x="67" y="0" width="5" height="28"></rect><rect x="77" y="0" width="7" height="28"></rect>
                            <rect x="89" y="0" width="4" height="28"></rect><rect x="98" y="0" width="8" height="28"></rect>
                        </g>

                        <!-- Sweeping Cyan/Green OCR Laser Line -->
                        <g class="ocr-laser-beam">
                            <rect x="36" y="110" width="212" height="18" rx="9" fill="#00bdf2" opacity="0.22"></rect>
                            <rect x="34" y="117" width="216" height="5" rx="2.5" fill="#00bdf2"></rect>
                        </g>
                    </g>

                    <!-- Connecting Dashed Extraction Arrows -->
                    <g stroke="#00bdf2" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round">
                        <line x1="244" y1="144" x2="294" y2="108"></line>
                        <line x1="244" y1="202" x2="294" y2="210"></line>
                        <line x1="244" y1="260" x2="294" y2="312"></line>
                    </g>

                    <!-- ========================================== -->
                    <!-- RIGHT: 3 EXTRACTED PRODUCT + PRICE CARDS   -->
                    <!-- ========================================== -->
                    <!-- Extracted Card 1: Crispy Cereal + 2.49€ + Green Check -->
                    <g class="extract-card-1" transform="translate(298, 66)">
                        <rect x="0" y="0" width="222" height="82" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"></rect>
                        <!-- Mini Cereal Icon -->
                        <rect x="16" y="14" width="40" height="54" rx="5" fill="#ff6b35"></rect>
                        <path fill="#00bdf2" d="M 28,44 L 56,44 C 52,58 32,58 28,44 Z"></path>
                        <!-- Extracted Price Pill -->
                        <rect x="70" y="18" width="86" height="28" rx="8" fill="#ffc412"></rect>
                        <text x="113" y="37" text-anchor="middle" fill="#181818" font-size="16" font-weight="800">2.49 €</text>
                        <rect x="70" y="54" width="72" height="10" rx="5" fill="#cbd5e1"></rect>
                        <!-- Attached Green check.svg -->
                        <circle cx="188" cy="41" r="20" fill="#0b7a3e"></circle>
                        <path d="M 179,41 L 185,47 L 198,34" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    </g>

                    <!-- Extracted Card 2: Green Bottle + 1.85€ + Green Check -->
                    <g class="extract-card-2" transform="translate(298, 168)">
                        <rect x="0" y="0" width="222" height="82" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"></rect>
                        <!-- Mini Green Bottle Icon -->
                        <rect x="30" y="12" width="12" height="6" rx="2" fill="#aeaeae"></rect>
                        <path fill="#009a49" d="M 31,18 L 41,18 L 41,28 C 49,32 52,40 52,48 L 52,66 A 4,4 0 0,1 48,70 L 24,70 A 4,4 0 0,1 20,66 L 20,48 C 20,40 23,32 31,28 Z"></path>
                        <rect x="26" y="42" width="20" height="20" rx="2" fill="#ffffff"></rect>
                        <!-- Extracted Price Pill -->
                        <rect x="70" y="18" width="86" height="28" rx="8" fill="#ffc412"></rect>
                        <text x="113" y="37" text-anchor="middle" fill="#181818" font-size="16" font-weight="800">1.85 €</text>
                        <rect x="70" y="54" width="64" height="10" rx="5" fill="#cbd5e1"></rect>
                        <!-- Attached Green check.svg -->
                        <circle cx="188" cy="41" r="20" fill="#0b7a3e"></circle>
                        <path d="M 179,41 L 185,47 L 198,34" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    </g>

                    <!-- Extracted Card 3: Pet Food Bag + 4.90€ + Green Check -->
                    <g class="extract-card-3" transform="translate(298, 270)">
                        <rect x="0" y="0" width="222" height="82" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"></rect>
                        <!-- Mini Kibble Bag Icon -->
                        <rect x="22" y="14" width="28" height="6" rx="2" fill="#d68b28"></rect>
                        <path fill="#f5b041" d="M 22,20 L 50,20 L 56,30 L 56,66 A 4,4 0 0,1 52,70 L 20,70 A 4,4 0 0,1 16,66 L 16,30 Z"></path>
                        <circle cx="36" cy="45" r="12" fill="#ffffff"></circle>
                        <circle cx="36" cy="46" r="5" fill="#595048"></circle>
                        <!-- Extracted Price Pill -->
                        <rect x="70" y="18" width="86" height="28" rx="8" fill="#ffc412"></rect>
                        <text x="113" y="37" text-anchor="middle" fill="#181818" font-size="16" font-weight="800">4.90 €</text>
                        <rect x="70" y="54" width="80" height="10" rx="5" fill="#cbd5e1"></rect>
                        <!-- Attached Green check.svg -->
                        <circle cx="188" cy="41" r="20" fill="#0b7a3e"></circle>
                        <path d="M 179,41 L 185,47 L 198,34" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path>
                    </g>
                </svg>