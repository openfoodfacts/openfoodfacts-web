<?xml version="1.0" encoding="UTF-8"?>
<svg width="48px" height="48px" viewBox="0 0 48 48" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Photos for Impact</title>
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2D72D2"/>
            <stop offset="100%" stop-color="#1852A4"/>
        </linearGradient>
        <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#347644"/>
            <stop offset="100%" stop-color="#22562E"/>
        </linearGradient>
    </defs>
    <!-- Background rounded squircle -->
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bgGrad)"/>
    
    <!-- Camera Top Bar & Flash -->
    <path d="M16 13 C16 11.5 17.5 10 19 10 L29 10 C30.5 10 32 11.5 32 13 L33 15 L15 15 Z" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="35" cy="19" r="2.5" fill="#FFB800"/>
    
    <!-- Camera Body Outline -->
    <rect x="8" y="15" width="32" height="22" rx="5" fill="#FFFFFF"/>
    <rect x="10" y="17" width="28" height="18" rx="3.5" fill="#F0F4F8"/>
    
    <!-- Big Camera Lens Outer Ring -->
    <circle cx="24" cy="26" r="8" fill="url(#lensGrad)"/>
    <circle cx="24" cy="26" r="6.5" fill="#1B3F23"/>
    <circle cx="24" cy="26" r="5.5" fill="#347644"/>
    
    <!-- Stylized Barcode / Spark in Lens -->
    <rect x="21" y="23" width="1.2" height="6" rx="0.6" fill="#FFFFFF"/>
    <rect x="23.2" y="23" width="1.6" height="6" rx="0.6" fill="#FFFFFF"/>
    <rect x="25.8" y="23" width="1" height="6" rx="0.5" fill="#FFFFFF"/>
    
    <!-- Lens reflection -->
    <path d="M22 21 C24 20 26.5 20.5 28 22" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>
    
    <!-- Small Target / Star badge at bottom right -->
    <circle cx="37" cy="37" r="5" fill="#E87A00"/>
    <path d="M37 34 L37.8 36.2 L40 37 L37.8 37.8 L37 40 L36.2 37.8 L34 37 L36.2 36.2 Z" fill="#FFFFFF"/>
</svg>
