<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-data-quality-nonfood" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .dq-nf-lens {
                            animation: dqNfSweep 4.5s ease-in-out infinite;
                            transform-origin: 310px 210px;
                        }
                        .dq-nf-badge {
                            animation: dqNfPop 4.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
                            transform-origin: 432px 115px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes dqNfSweep {
                            0%, 100% { transform: translate(-45px, -25px) rotate(-6deg); }
                            50% { transform: translate(35px, 20px) rotate(6deg); }
                        }
                        @keyframes dqNfPop {
                            0%, 30%, 90%, 100% { transform: scale(0.85); }
                            50%, 75% { transform: scale(1.08); }
                        }
                    </style>

                    <!-- Left: Attached Checklist.svg Data Sheet -->
                    <g transform="translate(55, 58) rotate(-4)">
                        <rect x="0" y="14" width="185" height="250" rx="22" fill="#00bdf2"></rect>
                        <rect x="16" y="34" width="153" height="214" rx="14" fill="#ffffff"></rect>
                        <rect x="60" y="0" width="65" height="42" rx="10" fill="#aeaeae"></rect>
                        <circle cx="46" cy="78" r="10" fill="none" stroke="#0077c8" stroke-width="4"></circle>
                        <line x1="72" y1="78" x2="146" y2="78" stroke="#181818" stroke-width="5" stroke-linecap="round"></line>
                        <circle cx="46" cy="116" r="10" fill="none" stroke="#0077c8" stroke-width="4"></circle>
                        <line x1="72" y1="116" x2="146" y2="116" stroke="#181818" stroke-width="5" stroke-linecap="round"></line>
                        <circle cx="46" cy="154" r="10" fill="none" stroke="#0077c8" stroke-width="4"></circle>
                        <line x1="72" y1="154" x2="146" y2="154" stroke="#009a49" stroke-width="5" stroke-linecap="round"></line>
                        <circle cx="46" cy="192" r="10" fill="none" stroke="#0077c8" stroke-width="4"></circle>
                        <line x1="72" y1="192" x2="146" y2="192" stroke="#181818" stroke-width="5" stroke-linecap="round"></line>
                    </g>

                    <!-- Center-Right: Attached washing-machine.svg -->
                    <g transform="translate(216, 108) rotate(4)">
                        <!-- Bottom Feet (#606362) -->
                        <path fill="#606362" d="M 14,228 L 36,228 L 33,236 L 17,236 Z"></path>
                        <path fill="#606362" d="M 148,228 L 170,228 L 167,236 L 151,236 Z"></path>
                        <!-- Main Light Grey Body (#b1b1b1) -->
                        <rect x="0" y="0" width="184" height="228" rx="10" fill="#b1b1b1"></rect>
                        <!-- Top Dark Grey Control Bar (#606362) -->
                        <path fill="#606362" d="M 10,0 L 174,0 A 10,10 0 0,1 184,10 L 184,32 L 0,32 L 0,10 A 10,10 0 0,1 10,0 Z"></path>
                        <!-- Top-Left White Dispenser Drawer -->
                        <rect x="10" y="7" width="40" height="18" rx="3" fill="#ffffff"></rect>
                        <!-- Top-Right 3 Cyan Dots (#7ce0ff) -->
                        <circle cx="114" cy="16" r="4.8" fill="#7ce0ff"></circle>
                        <circle cx="141" cy="16" r="4.8" fill="#7ce0ff"></circle>
                        <circle cx="168" cy="16" r="4.8" fill="#7ce0ff"></circle>
                        <!-- Center Drum Outer Ring (#606362) & Cyan Glass (#7ce0ff) -->
                        <circle cx="92" cy="130" r="62" fill="#606362"></circle>
                        <circle cx="92" cy="130" r="47" fill="#7ce0ff"></circle>
                        <!-- White Glass Reflection Highlights -->
                        <ellipse cx="104" cy="96" rx="5.5" ry="3.8" transform="rotate(28 104 96)" fill="#ffffff"></ellipse>
                        <rect x="112" y="100" width="20" height="7.5" rx="3.8" transform="rotate(42 122 104)" fill="#ffffff"></rect>
                    </g>

                    <!-- Attached Green check.svg Quality Seal -->
                    <g class="dq-nf-badge">
                        <circle cx="430" cy="118" r="44" fill="#000000" opacity="0.1"></circle>
                        <circle cx="432" cy="115" r="42" fill="#0b7a3e"></circle>
                        <path d="M 412,116 L 426,130 L 454,102" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"></path>
                    </g>

                    <!-- Animated Magnifying Glass Inspecting Washing Machine -->
                    <g class="dq-nf-lens">
                        <rect x="336" y="255" width="24" height="95" rx="12" transform="rotate(-38 348 302)" fill="#181818"></rect>
                        <circle cx="290" cy="215" r="64" fill="#ffffff" fill-opacity="0.35" stroke="#181818" stroke-width="16"></circle>
                        <path d="M 252,182 A 44,44 0 0,1 295,168" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"></path>
                    </g>
                </svg>