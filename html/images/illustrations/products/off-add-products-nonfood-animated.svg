<?xml version="1.0" encoding="UTF-8"?>
<svg id="svg-add-products-nonfood" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" class="">
                    <style>
                        .nf-washer-float {
                            animation: nfWasherBob 4.2s ease-in-out infinite;
                            transform-origin: 138px 235px;
                        }
                        .nf-drum-glare {
                            animation: drumSpin 4.2s ease-in-out infinite;
                            transform-origin: 138px 250px;
                        }
                        .nf-drill-float {
                            animation: nfDrillBob 4.2s ease-in-out infinite 0.35s;
                            transform-origin: 265px 155px;
                        }
                        .nf-scanner-hand {
                            animation: nfPhoneScanMove 4.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
                            transform-origin: 520px 360px;
                        }
                        .nf-laser-line {
                            animation: nfLaserSweep 2.1s ease-in-out infinite;
                        }
                        .nf-scan-badge {
                            animation: nfBadgePop 4.2s ease-out infinite;
                            transform-origin: 355px 245px;
                        }
                        svg.paused * { animation-play-state: paused !important; }
                        @keyframes nfWasherBob {
                            0%, 100% { transform: translateY(0px) rotate(-3deg); }
                            50% { transform: translateY(-8px) rotate(-1deg); }
                        }
                        @keyframes drumSpin {
                            0%, 100% { transform: rotate(0deg); }
                            50% { transform: rotate(22deg); }
                        }
                        @keyframes nfDrillBob {
                            0%, 100% { transform: translateY(0px) rotate(12deg); }
                            50% { transform: translateY(-10px) rotate(16deg); }
                        }
                        @keyframes nfPhoneScanMove {
                            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
                            45%, 60% { transform: translate(-18px, -10px) rotate(-3deg); }
                        }
                        @keyframes nfLaserSweep {
                            0%, 100% { transform: translateY(-38px); opacity: 0.35; }
                            50% { transform: translateY(42px); opacity: 1; }
                        }
                        @keyframes nfBadgePop {
                            0%, 38%, 90%, 100% { transform: scale(0); opacity: 0; }
                            48%, 78% { transform: scale(1); opacity: 1; }
                        }
                    </style>

                    <!-- 1. ATTACHED WASHING-MACHINE.SVG -->
                    <g class="nf-washer-float">
                        <!-- Bottom Dark Grey Feet (#606362) -->
                        <path fill="#606362" d="M 54,352 L 74,352 L 71,360 L 57,360 Z"></path>
                        <path fill="#606362" d="M 202,352 L 222,352 L 219,360 L 205,360 Z"></path>
                        <!-- Main Light Grey Body (#b1b1b1) -->
                        <rect x="42" y="112" width="192" height="240" rx="10" fill="#b1b1b1"></rect>
                        <!-- Top Dark Grey Control Bar (#606362) -->
                        <path fill="#606362" d="M 52,112 L 224,112 A 10,10 0 0,1 234,122 L 234,144 L 42,144 L 42,122 A 10,10 0 0,1 52,112 Z"></path>
                        <!-- Top-Left White Dispenser Drawer -->
                        <rect x="52" y="119" width="42" height="18" rx="3" fill="#ffffff"></rect>
                        <!-- Top-Right 3 Cyan Indicator Dots (#7ce0ff) -->
                        <circle cx="162" cy="128" r="5" fill="#7ce0ff"></circle>
                        <circle cx="190" cy="128" r="5" fill="#7ce0ff"></circle>
                        <circle cx="218" cy="128" r="5" fill="#7ce0ff"></circle>
                        <!-- Center Drum Outer Ring (#606362) & Cyan Glass Window (#7ce0ff) -->
                        <circle cx="138" cy="248" r="66" fill="#606362"></circle>
                        <circle cx="138" cy="248" r="50" fill="#7ce0ff"></circle>
                        <!-- White Glass Reflection Highlights -->
                        <g class="nf-drum-glare">
                            <ellipse cx="150" cy="212" rx="6" ry="4" transform="rotate(28 150 212)" fill="#ffffff"></ellipse>
                            <rect x="160" y="216" width="22" height="8" rx="4" transform="rotate(42 171 220)" fill="#ffffff"></rect>
                        </g>
                    </g>

                    <!-- 2. CORDLESS DRILL (From hero-openprices.svg) -->
                    <g class="nf-drill-float">
                        <rect x="192" y="88" width="32" height="7" rx="3" fill="#aeaeae"></rect>
                        <rect x="220" y="82" width="18" height="18" rx="3" fill="#aeaeae"></rect>
                        <rect x="236" y="76" width="14" height="30" rx="3" fill="#606362"></rect>
                        <path fill="#ffc412" d="M 250,68 L 328,68 A 14,14 0 0,1 342,82 L 342,116 A 14,14 0 0,1 328,130 L 320,130 L 320,185 L 256,185 L 278,164 L 266,130 L 250,122 Z"></path>
                        <rect x="298" y="82" width="30" height="5" rx="2.5" fill="#606362"></rect>
                        <rect x="298" y="92" width="30" height="5" rx="2.5" fill="#606362"></rect>
                        <rect x="246" y="182" width="78" height="28" rx="5" fill="#606362"></rect>
                    </g>

                    <!-- 3. HAND WITH SMARTPHONE SCANNING NON-FOOD PRODUCTS -->
                    <g class="nf-scanner-hand">
                        <g fill="#955830">
                            <rect x="292" y="142" width="45" height="22" rx="11" transform="rotate(35 314 153)"></rect>
                            <rect x="275" y="164" width="58" height="22" rx="11" transform="rotate(35 304 175)"></rect>
                            <rect x="260" y="186" width="66" height="22" rx="11" transform="rotate(35 293 197)"></rect>
                        </g>
                        <path fill="#955830" d="M 380,210 L 432,216 C 470,252 508,270 555,280 L 555,375 C 488,365 436,336 385,292 Z"></path>
                        <g transform="rotate(5 355 200)">
                            <rect x="294" y="88" width="122" height="214" rx="14" fill="#606362"></rect>
                            <rect x="300" y="95" width="110" height="200" rx="11" fill="#e1f3fe"></rect>
                            <rect x="314" y="122" width="82" height="90" rx="8" fill="#ffffff"></rect>
                            <g fill="#222222">
                                <rect x="325" y="140" width="4" height="44"></rect>
                                <rect x="333" y="140" width="8" height="44"></rect>
                                <rect x="345" y="140" width="3" height="44"></rect>
                                <rect x="352" y="140" width="6" height="44"></rect>
                                <rect x="362" y="140" width="10" height="44"></rect>
                                <rect x="376" y="140" width="3" height="44"></rect>
                                <rect x="383" y="140" width="5" height="44"></rect>
                            </g>
                            <rect class="nf-laser-line" x="304" y="162" width="102" height="3.5" rx="1.5" fill="#dc3522"></rect>
                            <g class="nf-scan-badge">
                                <rect x="320" y="232" width="70" height="26" rx="13" fill="#009a49"></rect>
                                <path d="M 346,245 L 352,251 L 365,239" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
                            </g>
                            <path fill="#606362" d="M 332,93 L 378,93 L 375,102 L 335,102 Z"></path>
                        </g>
                        <path fill="#955830" d="M 404,268 L 410,162 A 12,12 0 0,1 434,162 L 440,220 L 430,274 Z"></path>
                    </g>
                </svg>