<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bgGrad)"/>
  <!-- Newspaper sheet mockup -->
  <g transform="translate(50, 25)">
    <rect width="220" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Header band -->
    <rect x="16" y="18" width="188" height="14" rx="3" fill="#e2e8f0"/>
    <!-- Orange accent line -->
    <rect x="16" y="38" width="70" height="5" rx="2" fill="#e65100"/>
    <!-- Article columns mockup -->
    <rect x="16" y="52" width="86" height="5" rx="2" fill="#94a3b8"/>
    <rect x="16" y="63" width="86" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="16" y="74" width="75" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="16" y="85" width="80" height="5" rx="2" fill="#cbd5e1"/>
    <!-- Right photo / illustration mockup -->
    <rect x="116" y="52" width="88" height="44" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="145" cy="70" r="8" fill="#fed7aa"/>
    <path d="M125 88 L142 74 L158 88" fill="none" stroke="#e65100" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150 88 L168 76 L194 88" fill="none" stroke="#fdba74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom lines -->
    <rect x="16" y="106" width="188" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="16" y="117" width="160" height="5" rx="2" fill="#e2e8f0"/>
    <rect x="16" y="128" width="130" height="5" rx="2" fill="#e2e8f0"/>
  </g>
  <!-- Caption -->
  <text x="160" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="0.5">PRESSE &amp; MEDIA COVERAGE</text>
</svg>
