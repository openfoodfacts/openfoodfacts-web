<!-- Include: Edit page on GitHub -->
<style>
.off-edit-page-card {
  margin: 2.5rem 0 1.5rem 0;
  padding: 1.25rem 1.5rem;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: #334155;
  clear: both;
}
.off-edit-page-card * {
  box-sizing: border-box;
}
.off-edit-page-content {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex: 1;
  min-width: 0;
}
.off-edit-page-icon {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #0f172a;
}
.off-edit-page-icon svg {
  width: 32px;
  height: 32px;
  fill: currentColor;
}
.off-edit-page-texts {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
.off-edit-page-title {
  font-weight: 700;
  font-size: 1rem;
  color: #0f172a;
  line-height: 1.3;
}
.off-edit-page-desc {
  font-size: 0.875rem;
  color: #64748b;
  line-height: 1.4;
}
.off-edit-page-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.4rem;
  flex-shrink: 0;
}
.off-edit-page-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.6rem 1.15rem;
  background-color: #24292f;
  color: #ffffff !important;
  border-radius: 8px;
  font-size: 0.875rem;
  font-weight: 600;
  text-decoration: none !important;
  white-space: nowrap;
  transition: background-color 0.15s ease-in-out;
}
.off-edit-page-btn:hover,
.off-edit-page-btn:focus {
  background-color: #0f172a;
  color: #ffffff !important;
}
.off-edit-page-btn svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}
.off-edit-page-en-link {
  font-size: 0.75rem;
  color: #64748b !important;
  text-decoration: underline;
  transition: color 0.15s ease;
}
.off-edit-page-en-link:hover {
  color: #0f172a !important;
}
@media (max-width: 640px) {
  .off-edit-page-card {
    flex-direction: column;
    align-items: stretch;
    gap: 1rem;
    padding: 1.1rem;
  }
  .off-edit-page-actions {
    align-items: stretch;
  }
  .off-edit-page-btn {
    width: 100%;
    text-align: center;
  }
  .off-edit-page-en-link {
    text-align: center;
  }
}
</style>

<div class="off-edit-page-card" id="off-edit-page-card">
  <div class="off-edit-page-content">
    <div class="off-edit-page-icon" aria-hidden="true">
      <svg viewBox="0 0 16 16" width="32" height="32" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
    </div>
    <div class="off-edit-page-texts">
      <span class="off-edit-page-title">Help improve this page</span>
      <span class="off-edit-page-desc">Found a typo, outdated information, or want to improve the text? You can edit this page directly on GitHub.</span>
    </div>
  </div>
  <div class="off-edit-page-actions">
    <a id="off-edit-page-btn" class="off-edit-page-btn" href="https://github.com/openfoodfacts/openfoodfacts-web" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M11.013 1.427a1.75 1.75 0 012.474 0l1.086 1.086a1.75 1.75 0 010 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 01-.927-.928l.929-3.25a1.75 1.75 0 01.445-.758l8.61-8.61zm1.414 1.06a.25.25 0 00-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 000-.354l-1.086-1.086zM11.189 6.25L9.75 4.81l-6.286 6.287a.25.25 0 00-.064.108l-.558 1.953 1.953-.558a.249.249 0 00.108-.064l6.286-6.286z"></path></svg>
      <span>Edit this page on GitHub</span>
    </a>
    <a id="off-edit-page-en-link" class="off-edit-page-en-link" href="#" target="_blank" rel="noopener noreferrer" style="display: none;">Edit original English version</a>
  </div>
</div>

<script>
(function() {
  var card = document.getElementById('off-edit-page-card');
  if (!card) return;

  // Pages that must not be editable (legal & governance)
  var nonEditablePages = [
    'terms-of-use',
    'code-of-conduct',
    'legal',
    'privacy'
  ];

  // 1. Determine page slug
  var pageSlug = '';
  var canonical = document.querySelector('link[rel="canonical"]');
  if (canonical && canonical.href) {
    try {
      var canUrl = new URL(canonical.href, window.location.origin);
      var parts = canUrl.pathname.replace(/^\/+|\/+$/g, '').split('/');
      pageSlug = parts[parts.length - 1] || '';
    } catch (e) {}
  }

  if (!pageSlug) {
    var pathParts = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/');
    pageSlug = pathParts[pathParts.length - 1] || '';
  }

  // Remove .html if present
  pageSlug = pageSlug.replace(/\.html$/, '');

  // Treat root or empty as index
  if (!pageSlug) {
    pageSlug = 'index';
  }

  // Guard: hide widget on non-editable pages
  if (nonEditablePages.indexOf(pageSlug) !== -1) {
    card.style.display = 'none';
    return;
  }

  // 2. Determine language
  var lang = (document.documentElement.getAttribute('lang') || '').toLowerCase().trim();
  if (!lang) {
    var hostParts = window.location.hostname.split('.');
    if (hostParts.length > 2) {
      var sub = hostParts[0].replace(/^world-/, '');
      if (sub && sub !== 'world' && sub !== 'www' && sub !== 'static') {
        lang = sub;
      }
    }
  }
  if (!lang) {
    lang = 'en';
  }

  // 3. Map language to repo folder name
  var langFolder = lang;
  var localeMapping = {
    'zh-hk': 'zh_HK',
    'zh-cn': 'zh_CN',
    'en-au': 'en_AU',
    'en-gb': 'en_GB',
    'pt-br': 'pt_BR',
    'pt-pt': 'pt_PT',
    'nl-be': 'nl_BE',
    'nl-nl': 'nl_NL',
    'zh-tw': 'zh_TW',
    'sr-cs': 'sr_CS',
    'sr-rs': 'sr_RS',
    'kmr-tr': 'kmr_TR'
  };

  if (localeMapping[lang]) {
    langFolder = localeMapping[lang];
  } else if (lang.indexOf('-') !== -1) {
    var p = lang.split('-');
    langFolder = p[0].toLowerCase() + '_' + p[1].toUpperCase();
  }

  // 4. Update action links
  var baseUrl = 'https://github.com/openfoodfacts/openfoodfacts-web/blob/main/lang/';
  var btn = document.getElementById('off-edit-page-btn');
  if (btn) {
    btn.href = baseUrl + langFolder + '/texts/' + pageSlug + '.html';
  }

  var enLink = document.getElementById('off-edit-page-en-link');
  if (enLink && langFolder !== 'en') {
    enLink.href = baseUrl + 'en/texts/' + pageSlug + '.html';
    enLink.style.display = 'inline';
  }
})();
</script>
