<!-- Section 1: Hero -->
<div class="block block-hero">
    <div class="hero-wrapper">
        <img src="/images/producers/hero-orange.svg" onerror="if(!this.src.includes('html/')) this.src='html'+this.getAttribute('src');" alt="Open Food Facts Mascot" class="hero-mascot-img" loading="eager">
        <div class="hero-text-col">
            <h1 class="title-1">The world's largest open food database</h1>
            <p class="subtitle">Whether you know it or not, your products are likely already in Open Food Facts. Take control, verify your data, and turn transparency into a competitive advantage.</p>
            <div class="hero-search-box">
                <svg class="hero-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="hero-brand-input" class="hero-search-input" placeholder="Enter your brand name to verify (e.g. Danone, Barilla...)" aria-label="Enter your brand name to verify">
                <button type="button" id="hero-brand-submit-btn" class="hero-search-btn">
                    <span>Verify brand</span>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
            <div class="hero-cta-group">
                <a href="https://world.pro.openfoodfacts.org/cgi/user.pl" class="pro-btn pro-btn-primary">
                    <span>Access the Pro Platform</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
                <a href="https://world.pro.openfoodfacts.org/tutorial" class="pro-btn pro-btn-secondary">
                    <span>How it works</span>
                </a>
            </div>
        </div>
        <div class="hero-phone-col">
            <img src="/images/producers/official-app-screenshot.png" onerror="if(!this.src.includes('html/')) this.src='html'+this.getAttribute('src');" alt="Open Food Facts Official App Product View" loading="eager">
        </div>
    </div>
</div>
